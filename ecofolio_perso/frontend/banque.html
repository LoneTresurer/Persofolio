<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EcoFolio · Budget et comptes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  /* Même système visuel que portefeuille.html (compte-titres) */
  :root {
    --papier: #F2F4F1;
    --carte: #FFFFFF;
    --encre: #15261D;
    --encre-2: #5B6A61;
    --filet: #D8DED8;
    --filet-2: #EDF0EC;
    --foret: #1E6A48;
    --foret-clair: #E3EFE7;
    --invest: #2B5680;
    --invest-clair: #E6EEF7;
    --gain: #1D7A4B;
    --perte: #B23A2E;
    --perte-clair: #F7E6E3;
    --ambre: #8A5412;
    --ambre-clair: #FBEEDC;
    --champ: #FFFFFF;
    --rayon: 10px;
  }
  /* Mode sombre, repris du compte-titres pour que les deux modules se ressemblent :
     les verts sont éclaircis pour rester lisibles sur fond foncé, et gains et pertes
     restent distinguables l'un de l'autre sans dépendre de la seule teinte. */
  html[data-theme="sombre"] {
    --papier: #121714;
    --carte: #1A211C;
    --encre: #E8EDE9;
    --encre-2: #9DAAA1;
    --filet: #2C3630;
    --filet-2: #232C26;
    --foret: #5FBC8C;
    --foret-clair: #1E3328;
    --invest: #7FA7CB;
    --invest-clair: #1C2A38;
    --gain: #5FBC8C;
    --perte: #E2796B;
    --perte-clair: #3A221F;
    --ambre: #D9A441;
    --ambre-clair: #2E2719;
    --champ: #222A25;
  }
  html { color-scheme: light; }
  html[data-theme="sombre"] { color-scheme: dark; }

  /* Interrupteur de thème, identique à celui du compte-titres. */
  .bascule-theme { position: relative; display: inline-flex; align-items: center;
    width: 46px; height: 26px; border-radius: 999px; border: 1px solid var(--filet);
    background: var(--papier); cursor: pointer; padding: 0; flex: none; transition: background .2s; }
  .bascule-theme::after { content: ""; position: absolute; left: 2px; top: 1px;
    width: 20px; height: 20px; border-radius: 50%; background: var(--carte);
    box-shadow: 0 1px 2px rgba(21, 38, 29, .15); transition: transform .2s; }
  html[data-theme="sombre"] .bascule-theme { background: var(--foret-clair); border-color: var(--foret); }
  html[data-theme="sombre"] .bascule-theme::after { transform: translateX(20px); }
  .bascule-theme span { position: absolute; font-size: 11px; line-height: 1; top: 7px; }
  .bascule-theme .clair { left: 6px; opacity: 0; }
  .bascule-theme .sombre { right: 6px; opacity: .85; }
  html[data-theme="sombre"] .bascule-theme .clair { opacity: .85; }
  html[data-theme="sombre"] .bascule-theme .sombre { opacity: 0; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--papier); color: var(--encre);
    font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.5;
    font-variant-numeric: tabular-nums;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--foret); outline-offset: 2px; }
  .cache { display: none !important; }
  .num { text-align: right; white-space: nowrap; }
  .gain { color: var(--gain); }
  .perte { color: var(--perte); }
  .discret { color: var(--encre-2); font-size: 13px; }
  h1, h2, h3 { margin: 0; }

  .champ { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; min-width: 0; }
  .champ label, .champ .lib { font-size: 13px; color: var(--encre-2); }
  .champ > label { display: flex; flex-direction: column; gap: 6px; }
  .champ input, .champ select { font-size: 15px; color: var(--encre); }
  .bloc-dette { background: var(--carte); border: 1px solid var(--filet); border-radius: var(--rayon); padding: 14px 16px; margin-bottom: 12px; }
  .bloc-dette .tete-panneau { margin-bottom: 10px; }
  .champ input, .champ select, .saisie {
    background: var(--champ); border: 1px solid var(--filet); border-radius: 8px; padding: 9px 11px; width: 100%; min-width: 0;
  }
  .champ input:focus, .champ select:focus, .saisie:focus { border-color: var(--foret); outline: none; }
  .btn { border: 1px solid var(--foret); background: var(--foret); color: #fff; border-radius: 8px; padding: 10px 18px; font-weight: 500; white-space: nowrap; }
  .btn:hover { background: #185a3c; }
  .btn-sec { background: transparent; color: var(--foret); }
  .btn-sec:hover { background: var(--foret-clair); }
  .btn-lien { background: none; border: none; color: var(--foret); padding: 0; text-decoration: underline; }
  .btn-danger { border-color: var(--perte); background: transparent; color: var(--perte); }
  .btn-danger:hover { background: var(--perte-clair); }
  .mini-btn { border: 1px solid var(--filet); background: var(--carte); border-radius: 6px; padding: 4px 10px; font-size: 13px; white-space: nowrap; text-decoration: none; }
  .mini-btn:hover { border-color: var(--foret); color: var(--foret); }
  .mini-btn.danger:hover { border-color: var(--perte); color: var(--perte); }
  .erreur { background: var(--perte-clair); color: var(--perte); border-radius: 8px; padding: 10px 12px; font-size: 14px; margin-bottom: 14px; }
  .note { background: var(--papier); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; color: var(--encre-2); }
  .note.alerte { background: var(--ambre-clair); color: var(--ambre); }
  .note.danger { background: var(--perte-clair); color: var(--perte); }

  /* ── En-tête ───────────────────────────────────────────── */
  header { border-bottom: 1px solid var(--filet); background: var(--carte); }
  .barre { max-width: 1240px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 12px; }
  .marque { font-weight: 600; letter-spacing: .01em; }
  .marque span { color: var(--foret); }
  .module { color: var(--encre-2); font-size: 14px; padding-left: 12px; border-left: 1px solid var(--filet); }
  .barre .espace { flex: 1; }
  .sauvegarde { font-size: 13px; color: var(--encre-2); white-space: nowrap; }
  .sauvegarde.erreur-svg { color: var(--perte); }
  .sauvegarde button { font-size: 13px; }
  .utilisateur { color: var(--encre-2); font-size: 14px; }
  main { max-width: 1240px; margin: 0 auto; padding: 28px 24px 60px; }

  /* ── Relevé permanent : patrimoine net et ses composantes ─ */
  .releve { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 22px 48px; margin-bottom: 26px; }
  .releve .libelle { color: var(--encre-2); font-size: 14px; }
  .releve .montant { font-family: 'IBM Plex Serif', serif; font-size: clamp(38px, 6vw, 54px); line-height: 1.05; }
  .releve .evol { font-size: 15px; margin-top: 6px; }
  .chiffres { display: grid; grid-template-columns: repeat(3, auto); gap: 10px 36px; }
  .chiffres > div > span { display: flex; align-items: center; gap: 7px; color: var(--encre-2); font-size: 13px; }
  .chiffres strong { font-size: 18px; font-weight: 500; }
  .pastille { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; display: inline-block; }

  nav.onglets { display: flex; gap: 4px; border-bottom: 1px solid var(--filet); margin-bottom: 22px; overflow-x: auto; }
  nav.onglets button { background: none; border: none; border-bottom: 2px solid transparent; padding: 10px 14px; color: var(--encre-2); font-weight: 500; white-space: nowrap; }
  nav.onglets button[aria-selected="true"] { color: var(--encre); border-bottom-color: var(--foret); }

  .panneau { background: var(--carte); border: 1px solid var(--filet); border-radius: var(--rayon); padding: 18px 20px; margin-bottom: 18px; min-width: 0; }
  .panneau h2 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
  .panneau .sous-titre { color: var(--encre-2); font-size: 13px; margin: 0 0 14px; }
  .tete-panneau { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .grille-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 18px; margin-bottom: 18px; }
  .grille-2 > .panneau { margin-bottom: 0; }
  .grille-large { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; }
  @media (max-width: 960px) { .grille-large { grid-template-columns: 1fr; } }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-weight: 500; color: var(--encre-2); font-size: 12.5px; padding: 8px 10px; border-bottom: 1px solid var(--filet); white-space: nowrap; }
  th.num { text-align: right; }
  td { padding: 9px 10px; border-bottom: 1px solid var(--filet-2); vertical-align: middle; }
  tr.cliquable:hover td, .cat-ligne.cliquable:hover td { background: var(--foret-clair); }
  tbody tr:last-child td { border-bottom: none; }
  .defile { overflow-x: auto; }
  .sous { display: block; font-size: 12px; color: var(--encre-2); }
  .etiquette { display: inline-block; border-radius: 4px; padding: 1px 7px; font-size: 12px; font-weight: 500; background: var(--filet-2); white-space: nowrap; }
  .etiquette.courant { background: var(--foret-clair); color: var(--foret); }
  .etiquette.invest { background: var(--invest-clair); color: var(--invest); }
  .etiquette.auto { background: var(--papier); color: var(--encre-2); font-weight: 400; }
  .vide { text-align: center; padding: 30px 16px; color: var(--encre-2); }
  .vide p { margin: 0 0 14px; }
  .courbe { position: relative; height: 280px; }
  .donut { position: relative; height: 190px; }

  /* Flux du mois : diagramme de flux + deux camemberts côte à côte */
  .grille-flux { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 1080px) {
    .grille-flux { grid-template-columns: 1fr; }
    .sankey { min-width: 520px; }          /* empilé : on retrouve la largeur, et le défilement */
    #sankey { overflow-x: auto; }
  }
  .bloc-part h3 { font-size: 14px; font-weight: 600; margin: 0 0 2px; }
  .bloc-part .sous-titre { margin-bottom: 8px; }
  .legende-part { font-size: 13px; margin-top: 10px; }
  .legende-part div { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; padding: 2px 0; }
  .legende-part .part { color: var(--encre-2); font-variant-numeric: tabular-nums; }

  /* Simulateur d'intérêts composés */
  .grille-simu { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 26px; align-items: start; }
  @media (max-width: 860px) { .grille-simu { grid-template-columns: 1fr; } }
  .grille-simu input[type=range] { width: 100%; accent-color: var(--foret); padding: 0; border: none; background: none; }
  .grille-simu .champ label { display: flex; flex-direction: row; justify-content: space-between; gap: 10px; align-items: baseline; }
  .grille-simu .champ label strong { color: var(--encre); font-weight: 600; }

  /* Accroche du simulateur sur la synthèse */
  .accroche { display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 18px; align-items: center; }
  @media (max-width: 720px) { .accroche { grid-template-columns: 1fr; } }
  .accroche .chiffre { font-family: 'IBM Plex Serif', serif; font-size: 30px; line-height: 1.1; color: var(--invest); }
  .accroche .mini { height: 92px; }

  /* ── Synthèse : les deux comptes ───────────────────────── */
  .comptes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 18px; margin-bottom: 18px; }
  .compte { background: var(--carte); border: 1px solid var(--filet); border-radius: var(--rayon); padding: 18px 20px; border-top: 4px solid var(--foret); display: flex; flex-direction: column; gap: 10px; }
  .compte.invest { border-top-color: var(--invest); }
  .compte .nom { font-weight: 600; }
  .compte .role { color: var(--encre-2); font-size: 13px; }
  .compte .solde { font-family: 'IBM Plex Serif', serif; font-size: 34px; line-height: 1.1; }
  .compte .lignes { display: grid; grid-template-columns: 1fr auto; gap: 3px 16px; font-size: 13.5px; border-top: 1px solid var(--filet-2); padding-top: 10px; }
  .compte .lignes span:nth-child(odd) { color: var(--encre-2); }
  .compte .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }

  /* Barre de répartition : où est l'argent, et ce qui est dû */
  .repartition { margin-bottom: 18px; }
  .rep-barre { display: flex; height: 36px; border-radius: 6px; overflow: hidden; background: var(--filet-2); }
  .rep-barre > div { min-width: 2px; display: flex; align-items: center; padding: 0 10px; color: #fff; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; }
  .rep-barre.dette { height: 14px; margin-top: 8px; background: transparent; }
  .rep-legende { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13px; color: var(--encre-2); margin-top: 10px; }
  .rep-legende span { display: inline-flex; align-items: center; gap: 7px; }

  /* Pas d'overflow:hidden : les infobulles de formule débordent des tuiles. */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); border: 1px solid var(--filet); border-radius: var(--rayon); background: var(--carte); margin-bottom: 18px; }
  .kpis > div:first-child { border-top-left-radius: var(--rayon); }
  .kpis > div:last-child { border-bottom-right-radius: var(--rayon); border-right: none; }

  /* Formule d'un indicateur, au survol de son intitulé. */
  .formule { position: relative; border-bottom: 1px dotted var(--encre-2); cursor: help; }
  .formule::after {
    content: attr(data-formule);
    position: absolute; left: 0; top: calc(100% + 7px); z-index: 40;
    width: max-content; max-width: 300px;
    background: var(--encre); color: #fff; border-radius: 8px; padding: 9px 11px;
    font-size: 12.5px; font-weight: 400; line-height: 1.5; white-space: pre-line;
    opacity: 0; pointer-events: none; transition: opacity .12s;
    box-shadow: 0 6px 20px rgba(21, 38, 29, .22);
  }
  .formule:hover::after, .formule:focus-visible::after { opacity: 1; }
  /* Près du bord droit, l'infobulle s'aligne par la droite pour rester dans la page. */
  .formule.droite::after { left: auto; right: 0; }
  @media (hover: none) { .formule::after { display: none; } }
  .kpis > div { padding: 14px 18px; border-right: 1px solid var(--filet-2); border-bottom: 1px solid var(--filet-2); }
  .kpis .nom { font-size: 13px; color: var(--encre-2); }
  .kpis .valeur { font-size: 22px; font-weight: 500; margin: 2px 0; }
  .kpis .aide { font-size: 12.5px; color: var(--encre-2); line-height: 1.4; }

  .progres { position: relative; height: 8px; background: var(--filet-2); border-radius: 4px; overflow: hidden; }
  .progres > i { position: absolute; inset: 0 auto 0 0; background: var(--foret); border-radius: 4px; }
  .progres > i.depasse { background: var(--perte); }
  .progres > i.proche { background: #C08A3E; }
  .progres > b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--encre); opacity: .55; }

  .objectif { padding: 12px 0; border-bottom: 1px solid var(--filet-2); display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; align-items: center; }
  .objectif:last-child { border-bottom: none; }
  .objectif .titre { font-weight: 500; }
  .objectif .progres { grid-column: 1 / -1; }
  .objectif .detail { grid-column: 1 / -1; font-size: 13px; color: var(--encre-2); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .statut { font-size: 12px; font-weight: 500; border-radius: 4px; padding: 1px 7px; }
  .statut.ok { background: var(--foret-clair); color: var(--foret); }
  .statut.serre { background: var(--ambre-clair); color: var(--ambre); }
  .statut.ko { background: var(--perte-clair); color: var(--perte); }
  .statut.fini { background: var(--invest-clair); color: var(--invest); }

  .echeance { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--filet-2); align-items: center; font-size: 14px; }
  .echeance:last-child { border-bottom: none; }
  .echeance .jour { text-align: center; line-height: 1.1; }
  .echeance .jour strong { display: block; font-size: 18px; font-weight: 500; }
  .echeance .jour small { color: var(--encre-2); font-size: 12px; }

  /* ── Outils de filtre ──────────────────────────────────── */
  .filtres { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .filtres .saisie { width: auto; padding: 7px 10px; font-size: 14px; }
  .segments { display: inline-flex; background: var(--papier); padding: 3px; border-radius: 8px; gap: 2px; }
  .segments button { border: none; background: none; border-radius: 6px; padding: 6px 12px; font-size: 13.5px; color: var(--encre-2); }
  .segments button[aria-pressed="true"] { background: var(--carte); color: var(--encre); box-shadow: 0 1px 2px rgba(0,0,0,.08); font-weight: 500; }
  .nav-mois { display: inline-flex; align-items: center; gap: 6px; }
  .nav-mois strong { min-width: 150px; text-align: center; font-weight: 500; text-transform: capitalize; }
  select.cat-inline { border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 3px 4px; font-size: 13.5px; max-width: 190px; }
  select.cat-inline:hover, select.cat-inline:focus { border-color: var(--filet); background: var(--carte); }

  /* ── Flux du mois (Sankey) ─────────────────────────────── */
  /* Le diagramme s'ajuste à la largeur de sa colonne : une barre de défilement
     sous le graphique le désaligne des camemberts posés à côté. */
  .sankey { width: 100%; display: block; }
  /* Tailles exprimées dans le viewBox : le SVG étant réduit pour tenir dans sa
     colonne, elles sont choisies plus grandes qu'à l'écran. */
  .sankey text { font-size: 16px; fill: var(--encre); }
  .sankey text.m { fill: var(--encre-2); font-size: 14px; }
  .sankey path { opacity: .32; transition: opacity .15s; }
  .sankey path:hover { opacity: .6; }

  .cat-ligne td:first-child { display: flex; align-items: center; gap: 8px; }
  .cat-ligne .progres { min-width: 120px; }
  tr.cliquable { cursor: pointer; }

  /* ── Dettes ────────────────────────────────────────────── */
  .jauge { margin-top: 8px; }
  .jauge .progres { height: 10px; }
  .jauge .graduation { display: flex; justify-content: space-between; font-size: 12px; color: var(--encre-2); margin-top: 4px; }
  .resultat { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 6px; }
  .resultat > div { background: var(--papier); border-radius: 8px; padding: 10px 12px; }
  .resultat span { display: block; font-size: 12.5px; color: var(--encre-2); }
  .resultat strong { font-size: 18px; font-weight: 500; }

  /* ── Assistant de configuration ────────────────────────── */
  #assistant { min-height: 100vh; padding: 40px 20px 80px; }
  .assistant { max-width: 720px; margin: 0 auto; }
  .assistant > .marque { margin-bottom: 36px; }
  .etapes { display: flex; gap: 6px; margin-bottom: 30px; list-style: none; padding: 0; counter-reset: e; }
  .etapes li { flex: 1; font-size: 12.5px; color: var(--encre-2); border-top: 3px solid var(--filet); padding-top: 8px; counter-increment: e; }
  .etapes li::before { content: counter(e) ". "; }
  .etapes li.fait { border-top-color: #9CC5A9; }
  .etapes li.actif { border-top-color: var(--foret); color: var(--encre); font-weight: 500; }
  .assistant h1 { font-family: 'IBM Plex Serif', serif; font-weight: 500; font-size: 32px; line-height: 1.2; margin-bottom: 8px; }
  .assistant .intro { color: var(--encre-2); margin: 0 0 26px; max-width: 60ch; }
  .assistant h3 { font-size: 15px; font-weight: 600; margin: 26px 0 10px; }
  .lignes-saisie { display: flex; flex-direction: column; gap: 8px; }
  .ligne-saisie { display: grid; gap: 8px; align-items: end; }
  .ligne-saisie label { font-size: 12px; color: var(--encre-2); display: block; margin-bottom: 3px; }
  @media (min-width: 721px) { .ligne-saisie label.repete { display: none; } }
  .ligne-saisie .suppr { height: 40px; width: 40px; border: 1px solid var(--filet); background: var(--carte); border-radius: 8px; color: var(--encre-2); }
  .ligne-saisie .suppr:hover { color: var(--perte); border-color: var(--perte); }
  .puces { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .puces button { border: 1px dashed var(--filet); background: transparent; border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--encre-2); }
  .puces button:hover { border-color: var(--foret); color: var(--foret); }
  .grille-budgets { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0 12px; }
  .bilan { background: var(--carte); border: 1px solid var(--filet); border-radius: var(--rayon); padding: 16px 18px; margin-top: 24px; }
  .bilan .ligne { display: flex; justify-content: space-between; padding: 3px 0; font-size: 14.5px; }

<script>
/* ════════════════════════════════════════════════════════════════════════
   EcoFolio · Budget et comptes — prototype front-end
   Données stockées dans le navigateur (localStorage), une entrée par utilisateur.
   Le modèle (comptes / opérations / opérations programmées / dettes / objectifs)
   est pensé pour être déplacé tel quel dans une table SQLite côté backend.
   ════════════════════════════════════════════════════════════════════════ */

const $ = s => document.querySelector(s);
/* Même compte que le compte-titres : jeton délivré par l'API à la connexion (index.html). */
const API = /:8000$/.test(location.host) ? location.origin : 'http://localhost:8000';
const JETON = localStorage.getItem('ecofolio_jeton');
let UTILISATEUR = localStorage.getItem('ecofolio_user') || '';
if (!JETON) location.replace('index.html');
const ANCIENNE_CLE = 'ecofolio_banque_v1:' + UTILISATEUR.toLowerCase();   // prototype précédent (navigateur)

/* ── Référentiels ──────────────────────────────────────── */
const CATEGORIES = {
  // Sorties
  logement:    { nom: 'Logement',                 sens: 'SORTIE', couleur: '#1E6A48' },
  factures:    { nom: 'Énergie et télécoms',      sens: 'SORTIE', couleur: '#4F9A74' },
  courses:     { nom: 'Courses',                  sens: 'SORTIE', couleur: '#9CC5A9' },
  transport:   { nom: 'Transport',                sens: 'SORTIE', couleur: '#7FA7CB' },
  sorties:     { nom: 'Restaurants et sorties',   sens: 'SORTIE', couleur: '#C08A3E' },
  abonnements: { nom: 'Abonnements',              sens: 'SORTIE', couleur: '#8E6BA8' },
  sante:       { nom: 'Santé',                    sens: 'SORTIE', couleur: '#D98C7A' },
  shopping:    { nom: 'Shopping',                 sens: 'SORTIE', couleur: '#D5C9A1' },
  loisirs:     { nom: 'Loisirs et voyages',       sens: 'SORTIE', couleur: '#5F8F8B' },
  credit:      { nom: 'Remboursements de crédit', sens: 'SORTIE', couleur: '#B23A2E' },
  impots:      { nom: 'Impôts et taxes',          sens: 'SORTIE', couleur: '#6B7A70' },
  frais:       { nom: 'Frais bancaires',          sens: 'SORTIE', couleur: '#8A5412' },
  especes:     { nom: 'Retraits d\'espèces',       sens: 'SORTIE', couleur: '#B7A98C' },
  divers:      { nom: 'Divers',                   sens: 'SORTIE', couleur: '#A8B2AB' },
  // Entrées
  salaire:     { nom: 'Salaire',                  sens: 'ENTREE', couleur: '#1D7A4B' },
  complement:  { nom: 'Revenus complémentaires',  sens: 'ENTREE', couleur: '#4F9A74' },
  aides:       { nom: 'Aides et allocations',     sens: 'ENTREE', couleur: '#7FA7CB' },
  rembours:    { nom: 'Remboursements reçus',     sens: 'ENTREE', couleur: '#9CC5A9' },
  autre_rev:   { nom: 'Autres revenus',           sens: 'ENTREE', couleur: '#A8B2AB' },
  // Mouvement interne, jamais compté comme revenu ou dépense
  virement:    { nom: 'Virement entre comptes',   sens: 'INTERNE', couleur: '#2B5680' },
  // Ce que la lecture des relevés n'a pas su classer : visible, jamais deviné.
  inconnu:     { nom: 'Non catégorisé',           sens: 'TOUS',    couleur: '#C3CCC5' },
};
const CATS_SORTIE = Object.keys(CATEGORIES).filter(k => ['SORTIE', 'TOUS'].includes(CATEGORIES[k].sens));
const CATS_ENTREE = Object.keys(CATEGORIES).filter(k => ['ENTREE', 'TOUS'].includes(CATEGORIES[k].sens));
const CATS_VARIABLES = ['courses', 'transport', 'sorties', 'loisirs', 'shopping', 'sante', 'especes', 'divers'];
const COMPTES = {
  courant: { nom: 'Compte courant', court: 'Courant', couleur: '#1E6A48', role: 'Dépenses du quotidien et épargne disponible' },
  invest:  { nom: 'Compte investissement', court: 'Investissement', couleur: '#2B5680', role: 'Liquidités disponibles pour le compte-titres' },
};
const TYPES_DETTE = {
  immobilier: 'Prêt immobilier', conso: 'Crédit à la consommation', auto: 'Crédit auto',
  etudiant: 'Prêt étudiant', renouvelable: 'Crédit renouvelable', autre: 'Autre dette',
};
const SEUIL_ENDETTEMENT = 35; // % des revenus nets, norme HCSF (assurance comprise)

/* ── Thème clair / sombre ───────────────────────────────
   Le réglage est partagé avec le compte-titres (même clé de stockage) : choisi d'un
   côté, il s'applique de l'autre. */
function appliquerTheme(nom, redessiner = false) {
  document.documentElement.dataset.theme = nom;
  const bouton = $('#btn-theme');
  if (bouton) bouton.setAttribute('aria-checked', nom === 'sombre' ? 'true' : 'false');
  try { localStorage.setItem('ecofolio_theme', nom); } catch {}
  // Les graphiques sont tracés sur un canevas : ils ne suivent pas la feuille de style
  // et doivent être redessinés. Jamais au premier appel, avant tout affichage.
  if (redessiner && E) rafraichir();
}
appliquerTheme((() => { try { return localStorage.getItem('ecofolio_theme'); } catch { return null; } })()
  || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'sombre' : 'clair'));
document.addEventListener('DOMContentLoaded', () => {
  const bouton = $('#btn-theme');
  if (!bouton) return;
  bouton.setAttribute('aria-checked', document.documentElement.dataset.theme === 'sombre' ? 'true' : 'false');
  bouton.onclick = () => appliquerTheme(
    document.documentElement.dataset.theme === 'sombre' ? 'clair' : 'sombre', true);
});

/* ── Formats ───────────────────────────────────────────── */
const nombre = (v, d = 2) => (v == null || isNaN(v)) ? '—' : new Intl.NumberFormat('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d }).format(v);
function argent(v, signe = false, d = 2) {
  if (v == null || isNaN(v)) return '—';
  return new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', minimumFractionDigits: d, maximumFractionDigits: d, signDisplay: signe ? 'exceptZero' : 'auto' }).format(v);
}
const argent0 = (v, signe) => argent(v, signe, 0);
const pct = (v, d = 1) => (v == null || !isFinite(v)) ? '—' : nombre(v, d) + ' %';
const classe = v => v > 0.004 ? 'gain' : v < -0.004 ? 'perte' : '';
const echap = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lireNombre = v => { const n = parseFloat(String(v ?? '').replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : 0; };
const arrondi = v => Math.round(v * 100) / 100;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ── Dates (toujours en chaînes locales AAAA-MM-JJ) ─────── */
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const versDate = s => new Date(s + 'T12:00:00');
const AUJ = iso(new Date());
const moisDe = s => s.slice(0, 7);
const joursDansMois = (a, m) => new Date(a, m, 0).getDate();           // m = 1..12
function decalerMois(cleMois, n) {
  const [a, m] = cleMois.split('-').map(Number);
  const d = new Date(a, m - 1 + n, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}
function decalerJours(s, n) { const d = versDate(s); d.setDate(d.getDate() + n); return iso(d); }
function dateDansMois(cleMois, jour) {
  const [a, m] = cleMois.split('-').map(Number);
  return `${cleMois}-${String(Math.min(jour, joursDansMois(a, m))).padStart(2, '0')}`;
}
const libelleMois = (cle, court = false) => versDate(cle + '-01').toLocaleDateString('fr-FR', court ? { month: 'short' } : { month: 'long', year: 'numeric' });
const dateCourte = s => versDate(s).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
const dateLongue = s => versDate(s).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
const ecartMois = (de, a) => { const [a1, m1] = de.split('-').map(Number), [a2, m2] = a.split('-').map(Number); return (a2 - a1) * 12 + (m2 - m1); };
function dureeTexte(mois) {
  if (mois == null || !isFinite(mois)) return '—';
  const a = Math.floor(mois / 12), m = mois % 12;
  return [a ? `${a} an${a > 1 ? 's' : ''}` : '', m ? `${m} mois` : ''].filter(Boolean).join(' ') || '0 mois';
}

/* Intitulé d'indicateur portant sa formule, visible au survol ou au clavier.
   On y met le calcul *et* les nombres du moment : une formule abstraite se vérifie mal. */
function formule(nom, calcul, droite = false) {
  return `<span class="formule${droite ? ' droite' : ''}" tabindex="0" data-formule="${echap(calcul)}">${nom}</span>`;
}

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}

/* ════════════════════════════════════════════════════════════════════════
   ÉTAT ET PERSISTANCE
   ════════════════════════════════════════════════════════════════════════ */
let E = null;          // état complet du module
let VERSION = 0;       // version serveur sur laquelle E est fondé (contrôle de concurrence)

async function api(chemin, options = {}) {
  let rep;
  try {
    rep = await fetch(API + chemin, { ...options, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + JETON, ...(options.headers || {}) } });
  } catch {
    const e = new Error('Le serveur ne répond pas. Dans le dossier backend, lancez « python -m uvicorn main:app --reload », puis ouvrez http://localhost:8000.');
    e.reseau = true; throw e;
  }
  const data = await rep.json().catch(() => ({}));
  if (rep.status === 401) { deconnecter(); throw new Error('Session expirée.'); }
  if (!rep.ok) {
    const d = data.detail, e = new Error(typeof d === 'string' ? d : d?.message || (Array.isArray(d) ? d.map(x => x.msg).join(' ; ') : `Erreur ${rep.status}`));
    e.status = rep.status; e.detail = d; throw e;
  }
  return data;
}

function deconnecter() {
  fetch(API + '/auth/deconnexion', { method: 'POST', headers: { Authorization: 'Bearer ' + JETON } }).catch(() => {});
  localStorage.removeItem('ecofolio_jeton'); localStorage.removeItem('ecofolio_user');
  location.replace('index.html');
}

async function charger() {
  const r = await api('/banque/etat');
  E = r.etat; VERSION = r.version;
}

/* Enregistrement sur le serveur : regroupé (300 ms), une requête à la fois, jamais silencieux en cas d'échec. */
let enAttente = false, envoiEnCours = null, minuterie = null;
function sauver() { enAttente = true; indiquerSauvegarde('en-cours'); clearTimeout(minuterie); minuterie = setTimeout(envoyer, 300); }
async function envoyer() {
  if (envoiEnCours) await envoiEnCours;
  if (!enAttente || !E) return;
  enAttente = false;
  envoiEnCours = (async () => {
    try {
      const r = await api('/banque/etat', { method: 'PUT', body: JSON.stringify({ etat: E, version: VERSION }) });
      VERSION = r.version;
      indiquerSauvegarde(enAttente ? 'en-cours' : 'ok');
    } catch (ex) {
      if (ex.status === 409) {
        // Modifié ailleurs : on recharge la version du serveur plutôt que de l'écraser
        await charger(); if (E) { posterEcheances(); rafraichir(); } else ouvrirAssistant();
        indiquerSauvegarde('ok');
        toast('Modification non enregistrée : vos comptes avaient changé dans un autre onglet ou appareil. Version à jour rechargée, refaites la modification.');
      } else { enAttente = true; indiquerSauvegarde('erreur', ex.message); }
    } finally { envoiEnCours = null; }
  })();
  return envoiEnCours;
}
function indiquerSauvegarde(etat, message) {
  const z = $('#sauvegarde'); if (!z) return;
  z.classList.toggle('erreur-svg', etat === 'erreur');
  z.innerHTML = etat === 'ok' ? 'Enregistré' : etat === 'en-cours' ? 'Enregistrement…'
    : `Non enregistré <button class="btn-lien" id="svg-reessayer" title="${echap(message || '')}">Réessayer</button>`;
  if (etat === 'erreur') $('#svg-reessayer').onclick = () => { indiquerSauvegarde('en-cours'); envoyer(); };
}
window.addEventListener('beforeunload', e => {
  if (!enAttente) return;
  // Dernière chance : envoi maintenu même si la page se ferme
  fetch(API + '/banque/etat', { method: 'PUT', keepalive: true, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + JETON }, body: JSON.stringify({ etat: E, version: VERSION }) });
  e.preventDefault(); e.returnValue = '';
});

/* ════════════════════════════════════════════════════════════════════════
   MOTEUR : opérations programmées, soldes, dettes
   ════════════════════════════════════════════════════════════════════════ */

/* Taux mensuel équivalent au TAEG annuel saisi (convention bancaire française : taux proportionnel). */
const tauxMensuel = tauxAnnuelPct => tauxAnnuelPct / 100 / 12;

/* Mensualité constante hors assurance qui solde `capital` en `n` échéances (formule d'annuité). */
function mensualiteAnnuite(capital, tauxAnnuel, n) {
  if (n < 1) return null;
  const r = tauxMensuel(tauxAnnuel);
  return r === 0 ? capital / n : capital * r / (1 - Math.pow(1 + r, -n));
}
/* Mois de la prochaine échéance : la première date « jour » strictement après `apres`. */
function prochainMois(jour, apres = AUJ) {
  const m = moisDe(apres);
  return dateDansMois(m, jour) > apres ? m : decalerMois(m, 1);
}
/* Nombre d'échéances restantes, de la prochaine (à partir de `debut` inclus) au mois de la dernière inclus. */
const echeancesRestantes = (echeance, jour, debut = decalerJours(AUJ, 1)) => ecartMois(prochainMois(jour, decalerJours(debut, -1)), echeance) + 1;
/* Assurance emprunteur : montant fixe, ou taux annuel appliqué au capital emprunté à l'origine (usage en France). */
const assuranceMensuelle = a => !a || !a.valeur ? 0 : a.mode === 'pct' ? a.valeur / 100 * (a.base || 0) / 12 : a.valeur;
const assuranceDe = d => arrondi(assuranceMensuelle(d.assurance));

/* Rejoue toutes les échéances d'une dette pour connaître son capital restant dû.
   Chaque échéance normale = intérêts du mois + amortissement ; un remboursement anticipé = 100 % capital. */
function etatDette(dette, jusquA = '9999-12-31') {
  const r = tauxMensuel(dette.taux);
  let capital = dette.capitalDepart, interets = 0, amorti = 0, nb = 0;
  const recalages = (dette.recalages || []).map(r => ({ date: r.date, recalage: r.capital }));
  E.operations
    .filter(o => o.detteId === dette.id)
    .concat(recalages)
    .filter(o => o.date <= jusquA)
    .sort((a, b) => a.date.localeCompare(b.date) || (a.recalage != null) - (b.recalage != null))
    .forEach(o => {
      if (o.recalage != null) { capital = o.recalage; return; }   // capital corrigé par l'utilisateur
      const paiement = -o.montant - (o.assurance || 0);          // l'assurance n'amortit rien
      if (o.anticipe) { const p = Math.min(paiement, capital); capital -= p; amorti += p; return; }
      const i = capital * r, p = Math.min(Math.max(paiement - i, 0), capital);
      capital -= p; interets += i; amorti += p; nb++;
    });
  return { capital: Math.max(0, arrondi(capital)), interets, amorti, nb };
}

/* Projection d'amortissement à mensualité constante. */
function projeter(capital, tauxAnnuel, mensualite, extra = 0) {
  const r = tauxMensuel(tauxAnnuel), paiement = mensualite + extra;
  if (capital <= 0.005) return { mois: 0, interets: 0, serie: [0] };
  if (paiement <= capital * r + 0.005) return { impossible: true };
  let c = capital, interets = 0, mois = 0; const serie = [c];
  while (c > 0.005 && mois < 720) {
    const i = c * r, p = Math.min(paiement, c + i);
    c = c + i - p; interets += i; mois++; serie.push(Math.max(0, c));
  }
  return { mois, interets, serie };
}

/* Poste automatiquement les opérations programmées échues (salaire, loyer, mensualités, virement mensuel),
   comme le ferait une banque. Idempotent : chaque occurrence porte une clé « id:AAAA-MM ». */
function posterEcheances() {
  const deja = new Set([...E.operations.filter(o => o.occurrence).map(o => o.occurrence), ...(E.ignorees || [])]);
  const aPoster = [];
  for (const rec of E.programmees) {
    if (!rec.actif) continue;
    let cle = moisDe(rec.debut);
    while (cle <= moisDe(AUJ)) {
      const date = dateDansMois(cle, rec.jour), occ = rec.id + ':' + cle;
      if (date >= rec.debut && date <= AUJ && !deja.has(occ)) aPoster.push({ rec, date, occ });
      cle = decalerMois(cle, 1);
    }
  }
  aPoster.sort((a, b) => a.date.localeCompare(b.date));
  let n = 0;
  for (const { rec, date, occ } of aPoster) {
    if (rec.type === 'VIREMENT') { creerVirement(rec.compte, rec.versCompte, rec.montant, date, rec.libelle, { occurrence: occ, programmeeId: rec.id }); n++; continue; }
    if (rec.detteId) {
      const dette = E.dettes.find(d => d.id === rec.detteId);
      if (!dette) continue;
      const etat = etatDette(dette, date);
      if (etat.capital <= 0.005) { rec.actif = false; continue; }             // prêt soldé : on arrête le prélèvement
      const credit = Math.min(dette.mensualite, arrondi(etat.capital * (1 + tauxMensuel(dette.taux)))), ass = assuranceDe(dette);
      E.operations.push({ id: uid(), date, compte: rec.compte, montant: -arrondi(credit + ass), libelle: rec.libelle, categorie: 'credit',
        occurrence: occ, programmeeId: rec.id, detteId: dette.id, ...(ass ? { assurance: ass } : {}) });
      n++; continue;
    }
    E.operations.push({
      id: uid(), date, compte: rec.compte, montant: rec.sens === 'ENTREE' ? rec.montant : -rec.montant,
      libelle: rec.libelle, categorie: rec.categorie, occurrence: occ, programmeeId: rec.id,
    });
    n++;
  }
  if (n) sauver();
  return n;
}

function creerVirement(de, vers, montant, date, libelle, extra = {}) {
  const lien = uid();
  E.operations.push(
    { id: uid(), date, compte: de,   montant: -montant, libelle: libelle || `Virement vers ${COMPTES[vers].nom.toLowerCase()}`, categorie: 'virement', virementId: lien, ...extra },
    { id: uid(), date, compte: vers, montant:  montant, libelle: libelle || `Virement depuis ${COMPTES[de].nom.toLowerCase()}`, categorie: 'virement', virementId: lien, ...(extra.occurrence ? { occurrence: extra.occurrence + ':recu' } : {}) },
  );
}

const soldeCompte = (compte, jusquA = '9999-12-31') =>
  E.comptes[compte].soldeInitial + E.operations.filter(o => o.compte === compte && o.date <= jusquA).reduce((s, o) => s + o.montant, 0);
const affecteObjectifs = compte => E.objectifs.filter(o => o.compte === compte).reduce((s, o) => s + o.affecte, 0);
const detteTotale = (jusquA) => E.dettes.reduce((s, d) => s + etatDette(d, jusquA).capital, 0);
const patrimoineNet = (jusquA) => soldeCompte('courant', jusquA) + soldeCompte('invest', jusquA) - detteTotale(jusquA);
const estFlux = o => o.categorie !== 'virement';

/* Occurrences à venir des opérations programmées (hors dettes soldées). */
function echeancesAVenir(jours = 30) {
  const fin = decalerJours(AUJ, jours), res = [];
  for (const rec of E.programmees) {
    if (!rec.actif) continue;
    if (rec.detteId) { const d = E.dettes.find(x => x.id === rec.detteId); if (!d || etatDette(d).capital <= 0.005) continue; }
    for (let k = 0; k <= 2; k++) {
      const date = dateDansMois(decalerMois(moisDe(AUJ), k), rec.jour);
      if (date > AUJ && date <= fin && date >= rec.debut) res.push({ rec, date });
    }
  }
  return res.sort((a, b) => a.date.localeCompare(b.date));
}

/* Plan mensuel déclaré : ce que l'utilisateur prévoit de gagner et de dépenser en moyenne. */
function planMensuel() {
  const soldee = r => { const d = r.detteId && E.dettes.find(x => x.id === r.detteId); return d ? etatDette(d).capital <= 0.005 : false; };
  const actives = E.programmees.filter(r => r.actif && !soldee(r));
  const revenus = actives.filter(r => r.sens === 'ENTREE').reduce((s, r) => s + r.montant, 0);
  const fixes = actives.filter(r => r.sens === 'SORTIE' && !r.detteId).reduce((s, r) => s + r.montant, 0);
  const credits = actives.filter(r => r.detteId).reduce((s, r) => s + r.montant, 0);
  const variables = Object.values(E.budgets).reduce((s, v) => s + v, 0);
  const virementInvest = actives.filter(r => r.type === 'VIREMENT' && r.versCompte === 'invest').reduce((s, r) => s + r.montant, 0);
  const capacite = revenus - fixes - credits - variables;
  return { revenus, fixes, credits, variables, capacite, virementInvest };
}

/* Flux réels d'un mois donné. */
function fluxMois(cle) {
  const ops = E.operations.filter(o => moisDe(o.date) === cle);
  const flux = ops.filter(estFlux);
  const entrees = flux.filter(o => o.montant > 0).reduce((s, o) => s + o.montant, 0);
  const sorties = -flux.filter(o => o.montant < 0).reduce((s, o) => s + o.montant, 0);
  const versInvest = ops.filter(o => o.categorie === 'virement' && o.compte === 'invest').reduce((s, o) => s + o.montant, 0);
  const parCat = {};
  flux.forEach(o => { parCat[o.categorie] = (parCat[o.categorie] || 0) + Math.abs(o.montant); });
  const fixes = Math.abs(flux.filter(o => o.montant < 0 && o.programmeeId).reduce((s, o) => s + o.montant, 0));
  return { ops, entrees, sorties, solde: entrees - sorties, versInvest, parCat, fixes };
}

/* Capacité d'épargne réellement constatée sur les N derniers mois complets. */
function capaciteConstatee(n = 3) {
  const debut = moisDe(E.creeLe);
  const mois = [];
  for (let k = 1; k <= n; k++) { const c = decalerMois(moisDe(AUJ), -k); if (c >= debut) mois.push(c); }
  if (!mois.length) return null;
  return { moyenne: mois.reduce((s, c) => s + fluxMois(c).solde, 0) / mois.length, nb: mois.length };
}

      : l === 'fixes' ? { libelle: '', categorie: 'divers', montant: '', jour: 1 }

    const champs = zone.querySelectorAll(l === 'dettes' ? '[data-d="nom"]' : `[data-liste="${l}"][data-cle="libelle"]`);
    champs[champs.length - 1]?.focus();

    const [libelle, categorie, jour] = b.dataset.preset.split('|');

  zone.querySelectorAll('[data-budget]').forEach(el => el.addEventListener('input', () => { B.budgets[el.dataset.budget] = el.value; }));
  [['#solde-courant', 'soldeCourant'], ['#solde-invest', 'soldeInvest'], ['#virement', 'virement'], ['#jour-virement', 'jourVirement']]
    .forEach(([s, k]) => { const el = $(s); if (el) el.addEventListener('input', () => { B[k] = el.value; majApercus(); }); });
}

function calculBrouillon() {
  const revenus = B.revenus.filter(r => lireNombre(r.montant) > 0);
  const fixes = B.fixes.filter(r => lireNombre(r.montant) > 0);
  const dettes = B.sansDette ? [] : B.dettes.map(d => ({ b: d, c: calcDette(d) })).filter(x => x.c.capital > 0);
  const totRev = revenus.reduce((s, r) => s + lireNombre(r.montant), 0);
  const totFixes = fixes.reduce((s, r) => s + lireNombre(r.montant), 0);
  const totCredits = dettes.reduce((s, x) => s + x.c.total, 0);          // assurance comprise
  const variables = Object.values(B.budgets).reduce((s, v) => s + lireNombre(v), 0);
  const capacite = totRev - totFixes - totCredits - variables;
  return {
    revenus, fixes, dettes, totRev, totFixes, totCredits, variables, capacite,
    totalDettes: dettes.reduce((s, x) => s + x.c.capital, 0),
    soldeCourant: lireNombre(B.soldeCourant), soldeInvest: lireNombre(B.soldeInvest), virement: lireNombre(B.virement),
    precaution: Math.round((totFixes + totCredits + variables) * 6 / 100) * 100,   // six mois de dépenses
  };
}

function validerEtape() {
  const p = calculBrouillon();
  if (etapeCourante === 0 && !p.revenus.length) return 'Indiquez au moins un revenu mensuel, même approximatif.';
  if (etapeCourante === 0 && p.revenus.some(r => !String(r.libelle).trim())) return 'Donnez un libellé à chaque revenu.';
  if (etapeCourante === 1 && p.fixes.some(r => !String(r.libelle).trim())) return 'Donnez un libellé à chaque charge fixe.';
  if (etapeCourante === 2 && !B.sansDette) {
    if (!B.dettes.length) return 'Ajoutez vos crédits ou cochez « Je n\'ai aucun crédit en cours ».';
    for (const d of B.dettes) {
      if (!String(d.nom).trim()) return 'Donnez un nom à chaque crédit.';
      const c = calcDette(d);
      if (c.erreur) return `${d.nom.trim()} : ${c.erreur}`;
    }
  }
  if (etapeCourante === 3 && (lireNombre(B.soldeCourant) < 0 || lireNombre(B.soldeInvest) < 0 || lireNombre(B.virement) < 0))
    return 'Les montants doivent être positifs. Un découvert se saisit comme une dette.';
  return null;
}

function ajouterDette({ nom, type, capital, taux, mensualite, jour, echeance, assurance }, debut) {
  const d = { id: uid(), nom, type, capitalDepart: capital, taux, mensualite, jour, echeance, assurance: assurance || null, dateDepart: debut };
  E.dettes.push(d);
  E.programmees.push({ id: uid(), libelle: `Échéance ${nom}`, sens: 'SORTIE', categorie: 'credit', compte: 'courant', montant: arrondi(mensualite + assuranceDe(d)), jour, debut, actif: true, detteId: d.id });
  return d;
}
/* Une échéance de crédit importée a pu être programmée comme une simple dépense.
   Quand l'utilisateur crée ensuite le crédit correspondant, les deux se cumuleraient
   dans le plan mensuel : on repère la programmation jumelle pour proposer de la retirer. */
function programmeeJumelle(mensualite, jour, nom) {
  const motsNom = new Set(normaliserTiers(nom).split(' ').filter(m => m.length > 3));
  return E.programmees.find(r => {
    if (r.detteId || !r.actif || r.sens !== 'SORTIE' || r.type === 'VIREMENT') return false;
    const ecartMontant = Math.abs(r.montant - mensualite) / Math.max(mensualite, 1);
    const ecartJour = Math.abs(r.jour - jour);
    if (ecartMontant > 0.05 || ecartJour > 3) return false;
    // Montant et jour qui coïncident : c'est déjà un indice fort. La catégorie
    // « crédit » ou un mot commun avec le nom du prêt lève le doute.
    if (r.categorie === 'credit') return true;
    return normaliserTiers(r.libelle).split(' ').some(m => m.length > 3 && motsNom.has(m));
  }) || null;
}

/* Majuscules sans accents : comparaison de libellés entre une dette et une programmation. */
function normaliserTiers(t) {
  return (t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^A-Za-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim().toUpperCase();
}

/* Dettes créées avant l'ajout de la maturité et de l'assurance : on déduit la dernière échéance du rythme actuel. */
function migrerDette(d) {
  if (d.assurance === undefined) d.assurance = null;
  if (!d.echeance) {
    const p = projeter(etatDette(d).capital, d.taux, d.mensualite);
    d.echeance = decalerMois(prochainMois(d.jour), p.impossible ? 119 : Math.max(0, p.mois - 1));
  }
}

/* ── Saisie d'un crédit (assistant et tiroir) : maturité → mensualité calculée, modifiable ── */
const OPTIONS_ASSURANCE = [['aucune', 'Sans assurance'], ['euros', 'Montant fixe par mois'], ['pct', 'Taux annuel sur le capital emprunté']];
function calcDette(b, permettreZero = false) {
  const capital = lireNombre(b.capital), taux = lireNombre(b.taux);
  const n = b.echeance ? echeancesRestantes(b.echeance, +b.jour) : 0;
  const calc = capital > 0 && n >= 1 ? arrondi(mensualiteAnnuite(capital, taux, n)) : null;
  const mensualite = b.manuelle ? arrondi(lireNombre(b.mensualite)) : (calc || 0);
  const assurance = b.assMode === 'aucune' ? null : { mode: b.assMode, valeur: lireNombre(b.assValeur), base: lireNombre(b.assBase) || capital };
  const ass = arrondi(assuranceMensuelle(assurance));
  let erreur = null;
  if (capital < 0 || (!capital && !permettreZero)) erreur = 'indiquez le capital restant dû.';
  else if (taux < 0 || taux > 30) erreur = 'le taux doit être compris entre 0 et 30 %.';
  else if (capital > 0 && !b.echeance) erreur = 'indiquez le mois de la dernière échéance.';
  else if (capital > 0 && n < 1) erreur = 'la dernière échéance doit tomber après la prochaine date de prélèvement.';
  else if (capital > 0 && mensualite <= capital * tauxMensuel(taux)) erreur = `une mensualité de ${argent(mensualite)} ne couvre pas les ${argent(capital * tauxMensuel(taux))} d'intérêts du mois.`;
  else if (assurance && !assurance.valeur) erreur = 'indiquez le montant ou le taux de l\'assurance, ou choisissez « Sans assurance ».';
  const proj = erreur || !capital ? null : projeter(capital, taux, mensualite);
  return { capital, taux, n, calc, mensualite, assurance, ass, total: arrondi(mensualite + ass), proj, erreur };
}

/* Relie les champs d'un formulaire de crédit à l'objet `b` ; `rerendre` est appelé quand la structure change. */
function brancherDette(racine, b, rerendre, permettreZero = false) {
  const maj = () => {
    const c = calcDette(b, permettreZero), mens = racine.querySelector('[data-d="mensualite"]');
    if (!b.manuelle) { b.mensualite = c.calc != null ? String(c.calc).replace('.', ',') : ''; mens.value = b.mensualite; }
    racine.querySelector('[data-mode-mens]').innerHTML = b.manuelle
      ? `Saisie manuelle${c.calc != null ? ` · <button type="button" class="btn-lien" data-recalc>recalculer (${argent(c.calc)})</button>` : ''}`
      : 'Calculée d\'après la dernière échéance';
    const r = racine.querySelector('[data-recalc]'); if (r) r.onclick = () => { b.manuelle = false; maj(); };
    let texte;
    if (c.erreur) texte = `<span class="perte">${c.erreur.charAt(0).toUpperCase() + c.erreur.slice(1)}</span>`;
    else if (!c.capital) texte = 'Crédit soldé : le prélèvement sera arrêté.';
    else {
      const finReelle = c.proj.mois, decalage = finReelle - c.n;
      texte = `${finReelle} mensualité${finReelle > 1 ? 's' : ''} restante${finReelle > 1 ? 's' : ''}, ${argent0(c.proj.interets)} d'intérêts${c.ass ? ` et ${argent0(c.ass * finReelle)} d'assurance` : ''}. Prélevé chaque mois : <strong>${argent(c.total)}</strong>${c.ass ? ` dont ${argent(c.ass)} d'assurance` : ''}.`
        + (b.manuelle && Math.abs(decalage) >= 1 ? `<br>Avec cette mensualité, le crédit se termine en ${libelleMois(decalerMois(prochainMois(+b.jour), finReelle - 1))}, ${dureeTexte(Math.abs(decalage))} ${decalage > 0 ? 'après' : 'avant'} l'échéance indiquée.` : '');
    }
    racine.querySelector('[data-resume]').innerHTML = texte;
  };
  racine.querySelectorAll('[data-d]').forEach(el => el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => {
    b[el.dataset.d] = el.value;
    if (el.dataset.d === 'mensualite') b.manuelle = true;
    if (el.dataset.d === 'assMode') return rerendre();
    maj(); if (racine.onmaj) racine.onmaj();
  }));
  maj();
}

/* Valeur courante d'une variable CSS : les graphiques sont dessinés sur un canevas
   et ne suivent pas la feuille de style, il faut leur passer la couleur du moment. */
const couleurTheme = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim() || '#5B6A61';
/* Fonction et non constante : la couleur de grille suit le thème en cours, qui peut

/* ════════════════════════════════════════════════════════════════════════
   SIMULATEUR D'INTÉRÊTS COMPOSÉS
   Versements en fin de mois, intérêts capitalisés mensuellement. Le taux saisi
   est annuel : on utilise son équivalent mensuel géométrique (1+t)^(1/12)-1,
   pour qu'un taux de 5 % produise réellement 5 % sur douze mois.
   ════════════════════════════════════════════════════════════════════════ */
let sim = null;   // initialisé à la première ouverture, à partir des comptes réels

function simDefauts() {
  const plan = planMensuel();
  const mensuel = plan.virementInvest || Math.max(0, Math.round(plan.capacite / 2 / 10) * 10);
  return {
    initial: Math.round(soldeCompte('invest')), mensuel, annees: 20, taux: 5, inflation: 2, reel: false,
  };
}

function projeterEpargne({ initial, mensuel, annees, taux }) {
  const r = Math.pow(1 + taux / 100, 1 / 12) - 1, n = Math.round(annees * 12);
  const serie = [{ mois: 0, verse: initial, total: initial }];
  let total = initial, verse = initial;
  for (let k = 1; k <= n; k++) {
    total = total * (1 + r) + mensuel;
    verse += mensuel;
    if (k % 12 === 0 || k === n) serie.push({ mois: k, verse: arrondi(verse), total: arrondi(total) });
  }
  return { serie, verse: arrondi(verse), total: arrondi(total), interets: arrondi(total - verse), r, n };
}

function afficherObjectifs(plan, constatee) {
  const zone = $('#liste-objectifs');
  if (!E.objectifs.length) {
    zone.innerHTML = `<div class="vide"><p>Un objectif transforme votre capacité d'épargne en un montant à réserver chaque mois.</p><button class="btn" onclick="tiroirObjectif()">Créer un objectif</button></div>`;
    return;
  }
  // Capacité pour les objectifs, tous comptes confondus : la plus prudente entre épargne prévue et constatée
  const capacite = Math.min(plan.capacite, constatee ? constatee.moyenne : Infinity);
  const besoins = E.objectifs.map(o => {
    const reste = Math.max(0, o.cible - o.affecte), mois = Math.max(1, ecartMois(moisDe(AUJ), o.echeance));
    return { o, reste, mois, parMois: reste / mois };
  });
  const totalBesoin = besoins.reduce((s, b) => s + b.parMois, 0);
  zone.innerHTML = besoins.map(({ o, reste, mois, parMois }) => {
    const part = o.affecte / o.cible * 100;
    const statut = reste <= 0 ? ['fini', 'Atteint']
      : o.echeance < moisDe(AUJ) ? ['ko', 'Échéance passée']
      : totalBesoin <= capacite ? ['ok', 'En bonne voie']
      : parMois <= capacite ? ['serre', 'Serré'] : ['ko', 'Hors de portée'];
    return `<div class="objectif">
      <div><span class="titre">${echap(o.nom)}</span> <span class="etiquette ${o.compte}">${COMPTES[o.compte].court}</span></div>
      <div style="display:flex;gap:8px;align-items:center"><span class="statut ${statut[0]}">${statut[1]}</span>
        <button class="mini-btn" data-reserver="${o.id}">Réserver</button><button class="mini-btn" data-modif-obj="${o.id}">Modifier</button></div>
      <div class="progres"><i style="width:${Math.min(100, part)}%"></i></div>
      <div class="detail"><span>${argent0(o.affecte)} sur ${argent0(o.cible)} (${pct(part, 0)})</span>
        <span>${reste > 0 ? `${argent0(parMois)} / mois pendant ${dureeTexte(mois)}, jusqu'en ${libelleMois(o.echeance)}` : 'Objectif atteint'}</span></div>
    </div>`;
  }).join('') + `<p class="note ${totalBesoin > capacite ? 'alerte' : ''}" style="margin:12px 0 0">
      Vos objectifs demandent ${argent0(totalBesoin)} par mois, pour une capacité d'épargne de ${argent0(capacite)}${capacite < plan.capacite ? ' (la plus prudente entre prévue et constatée)' : ''}.
      ${totalBesoin > capacite ? `Il manque ${argent0(totalBesoin - capacite)} : repousser une échéance ou réduire un budget rééquilibre le plan.` : `Il reste ${argent0(capacite - totalBesoin)} de marge.`}</p>`;
  zone.querySelectorAll('[data-reserver]').forEach(b => b.onclick = () => tiroirReserver(b.dataset.reserver));
  zone.querySelectorAll('[data-modif-obj]').forEach(b => b.onclick = () => tiroirObjectif(b.dataset.modifObj));
}

      <h2>Le coût d'attendre</h2>
      <p class="sous-titre">Même versement, même rendement, en commençant plus tard.</p>
      <div class="defile"><table>
        <thead><tr><th>Si vous commencez</th><th class="num">Durée</th><th class="num">Versé</th><th class="num">Capital final</th><th class="num">Écart</th></tr></thead>
        <tbody>${[0, 2, 5, 10].filter(d => sim.annees - d >= 1).map(retard => {
          const q = projeterEpargne({ ...sim, annees: sim.annees - retard });
          return `<tr><td>${retard === 0 ? 'maintenant' : `dans ${retard} an${retard > 1 ? 's' : ''}`}</td>
            <td class="num">${sim.annees - retard} ans</td><td class="num discret">${aff(q.verse)}</td>
            <td class="num">${aff(q.total)}</td>
            <td class="num ${retard ? 'perte' : ''}">${retard ? argent0(-(p.total - q.total) / (sim.reel ? deflateur : 1)) : '—'}</td></tr>`;
        }).join('')}</tbody></table></div>
    </div>`;

  const relire = () => {
    sim.initial = Math.max(0, lireNombre($('#si-initial').value));
    sim.mensuel = Math.max(0, lireNombre($('#si-mensuel').value));
    sim.annees = +$('#si-annees').value; sim.taux = +$('#si-taux').value;
    sim.inflation = +$('#si-inflation').value; sim.reel = $('#si-reel').checked;
    vueSimulateur();
  };
  ['#si-initial', '#si-mensuel'].forEach(id => $(id).addEventListener('change', relire));
  ['#si-annees', '#si-taux', '#si-inflation', '#si-reel'].forEach(id => $(id).addEventListener('input', relire));
  vue.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => {
    sim.taux = { prudent: 3, equilibre: 5, actions: 7 }[b.dataset.preset]; vueSimulateur();
  });

  graphique('c-simu', {
    type: 'line',
    data: { labels: p.serie.map(x => x.mois / 12 + ' ans'), datasets: [
      { label: 'Vos versements', data: p.serie.map(x => arrondi(x.verse / (sim.reel ? deflateur : 1))), borderColor: '#4F9A74', backgroundColor: '#9CC5A955', fill: 'origin', pointRadius: 0, borderWidth: 2, tension: .2 },
      { label: 'Avec les intérêts', data: p.serie.map(x => arrondi(x.total / (sim.reel ? deflateur : 1))), borderColor: '#2B5680', backgroundColor: '#2B568033', fill: '-1', pointRadius: 0, borderWidth: 2, tension: .2 },
    ] },
    options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } }, tooltip: { callbacks: { label: c => `${c.dataset.label} : ${argent(c.parsed.y)}` } } },
      scales: { x: { grid: { display: false }, ticks: { maxTicksLimit: 9 } }, y: { ...axeEuros(), beginAtZero: true } } },
  });
}

/* Une phrase qui dit ce que le graphique montre, calculée et non décorative. */
function phraseSimu(p, d) {
  if (d.mensuel <= 0 && d.initial <= 0) return 'Indiquez un capital de départ ou un versement mensuel pour voir l\'effet.';
  if (d.taux <= 0) return 'À rendement nul, l\'argent ne fait que s\'accumuler : le capital final est exactement la somme versée. C\'est la situation d\'un compte courant, inflation en plus.';
  const anneesEffort = d.mensuel > 0 ? p.interets / (d.mensuel * 12) : null;
  return `Sur ${d.annees} ans, les intérêts rapportent ${argent0(p.interets)}, soit ${pct(p.interets / Math.max(p.verse, 1) * 100, 0)} de ce que vous avez versé`
    + (anneesEffort ? ` — l'équivalent de ${nombre(anneesEffort, 1)} années de versements obtenues sans rien verser.` : '.')
    + ` Un euro placé aujourd'hui en vaut ${nombre(Math.pow(1 + d.taux / 100, d.annees), 2)} au terme ; le même euro versé la dernière année n'a pas le temps de travailler. C'est la durée, plus que le montant, qui fait le résultat.`;
}

/* ═════════════ Onglet 2 : Comptes ═════════════ */
function vueComptes() {
  const vue = $('[data-vue="comptes"]');
  const ops = E.operations.filter(o => o.compte === compteVu).sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  // Solde après chaque opération (calculé du plus ancien au plus récent)
  let courant = E.comptes[compteVu].soldeInitial; const soldeApres = {};
  [...ops].reverse().forEach(o => { courant += o.montant; soldeApres[o.id] = courant; });

  const f = filtre;

    (f.mois === 'tous' || moisDe(o.date) === f.mois) &&

    (!f.texte || o.libelle.toLowerCase().includes(f.texte.toLowerCase())));

  const totS = visibles.filter(o => o.montant < 0).reduce((s, o) => s + o.montant, 0);

    <div class="filtres" style="justify-content:space-between">

      </div>
      <div style="display:flex;gap:8px"><button class="btn btn-sec" data-virer-ici>Faire un virement</button><button class="btn" data-ajout-ici>Ajouter une opération</button></div>
    </div>
    ${compteVu === 'invest' ? `<p class="note" style="margin:0 0 18px">Ce solde correspond aux liquidités que vous destinez au portefeuille. À l'étape suivante, il alimentera les espèces du compte-titres : chaque virement ici deviendra un dépôt là-bas.</p>` : ''}

      <div class="tete-panneau"><div><h2>Évolution du solde</h2><p class="sous-titre">Solde en fin de journée, sur les 120 derniers jours.</p></div>
        <div style="text-align:right"><div class="discret">Solde actuel</div><div style="font-size:22px;font-weight:500">${argent(soldeCompte(compteVu))}</div></div></div>
      <div class="courbe"><canvas id="c-solde"></canvas></div>
    </div>
    <div class="panneau">
      <div class="tete-panneau"><div><h2>Opérations programmées</h2><p class="sous-titre">Enregistrées automatiquement chaque mois au jour indiqué.</p></div>
        <button class="mini-btn" id="btn-prog">Programmer une opération</button></div>
      <div class="defile">${progs.length ? `<table><thead><tr><th>Libellé</th><th>Catégorie</th><th>Jour</th><th class="num">Montant</th><th></th></tr></thead><tbody>
        ${progs.map(r => {
          const signe = r.type === 'VIREMENT' ? (r.versCompte === compteVu ? 1 : -1) : r.sens === 'ENTREE' ? 1 : -1;
          const solde = r.detteId && !r.actif;
          return `<tr><td>${echap(r.libelle)}${solde ? ' <span class="etiquette">prêt soldé</span>' : !r.actif ? ' <span class="etiquette">suspendue</span>' : ''}</td>
          <td>${CATEGORIES[r.categorie].nom}</td><td>le ${r.jour}</td>
          <td class="num ${signe > 0 ? 'gain' : ''}">${signe > 0 ? '+' : '−'}${argent(r.montant)}</td>
          <td class="num">${r.detteId ? '<span class="discret">géré dans Dettes</span>' : `<button class="mini-btn" data-modif-prog="${r.id}">Modifier</button>`}</td></tr>`;
        }).join('')}</tbody></table>` : '<div class="vide"><p>Aucune opération programmée sur ce compte.</p></div>'}</div>
    </div>
    <div class="panneau">
      <h2>Opérations</h2>
      <div class="filtres" style="margin-top:10px">
        <select class="saisie" id="f-mois" aria-label="Mois"><option value="tous">Tous les mois</option>${moisDispo.map(c => `<option value="${c}" ${c === f.mois ? 'selected' : ''}>${libelleMois(c)}</option>`).join('')}</select>
        <div class="segments" role="group" aria-label="Sens">
          ${[['tous', 'Tout'], ['entrees', 'Entrées'], ['sorties', 'Sorties']].map(([v, t]) => `<button data-sens="${v}" aria-pressed="${f.sens === v}">${t}</button>`).join('')}
        </div>
        <select class="saisie" id="f-cat" aria-label="Catégorie"><option value="">Toutes catégories</option>${Object.entries(CATEGORIES).map(([k, c]) => `<option value="${k}" ${k === f.categorie ? 'selected' : ''}>${c.nom}</option>`).join('')}</select>
        <input class="saisie" id="f-texte" type="search" placeholder="Rechercher un libellé" value="${echap(f.texte)}" style="flex:1;min-width:160px">
      </div>
      <p class="discret" style="margin:0 0 8px">${visibles.length} opération${visibles.length > 1 ? 's' : ''} · entrées <span class="gain">${argent(totE, true)}</span> · sorties ${argent(totS)}</p>
      <div class="defile">${visibles.length ? `<table>
        <thead><tr><th>Date</th><th>Libellé</th><th>Catégorie</th><th class="num">Montant</th><th class="num">Solde</th><th></th></tr></thead>
        <tbody>${visibles.slice(0, limiteOps).map((o, i, l) => `${i === 0 || moisDe(l[i - 1].date) !== moisDe(o.date) ? `<tr><td colspan="6" style="background:var(--papier);font-weight:500;text-transform:capitalize;padding:6px 10px">${libelleMois(moisDe(o.date))}</td></tr>` : ''}<tr>
          <td style="white-space:nowrap">${dateCourte(o.date)}</td>
          <td>${echap(o.libelle)} ${o.programmeeId ? '<span class="etiquette auto" title="Opération programmée">auto</span>' : ''}${o.anticipe ? ' <span class="etiquette">anticipé</span>' : ''}</td>
          <td>${o.categorie === 'virement' || o.detteId ? `<span class="discret">${CATEGORIES[o.categorie].nom}</span>` :
              `<select class="cat-inline" data-recat="${o.id}" aria-label="Catégorie">${(o.montant > 0 ? CATS_ENTREE : CATS_SORTIE.filter(c => c !== 'credit')).map(c => `<option value="${c}" ${c === o.categorie ? 'selected' : ''}>${CATEGORIES[c].nom}</option>`).join('')}</select>`}</td>
          <td class="num ${o.montant > 0 ? 'gain' : ''}">${argent(o.montant, true)}</td>
          <td class="num discret">${argent(soldeApres[o.id])}</td>
          <td class="num"><button class="mini-btn" data-modif="${o.id}">Modifier</button></td></tr>`).join('')}</tbody></table>
        ${visibles.length > limiteOps ? `<div style="text-align:center;margin-top:12px"><button class="btn btn-sec" id="plus-ops">Afficher les ${Math.min(80, visibles.length - limiteOps)} suivantes</button></div>` : ''}`
        : `<div class="vide"><p>${ops.length ? 'Aucune opération ne correspond à ces filtres.' : 'Aucune opération sur ce compte pour l\'instant.'}</p>${ops.length ? '<button class="btn btn-sec" id="f-raz">Effacer les filtres</button>' : ''}</div>`}</div>
    </div>`;

  vue.querySelectorAll('[data-compte]').forEach(b => b.onclick = () => { compteVu = b.dataset.compte; filtre = { mois: 'tous', sens: 'tous', texte: '', categorie: '' }; vueComptes(); });

  if ($('#f-raz')) $('#f-raz').onclick = () => { filtre = { mois: 'tous', sens: 'tous', texte: '', categorie: '' }; vueComptes(); };
  vue.querySelector('[data-ajout-ici]').onclick = () => tiroirOperation({ compte: compteVu });
  vue.querySelector('[data-virer-ici]').onclick = () => tiroirOperation({ type: 'VIREMENT', compte: compteVu });
  vue.querySelectorAll('[data-modif]').forEach(b => b.onclick = () => tiroirOperation({ id: b.dataset.modif }));
  vue.querySelectorAll('[data-recat]').forEach(s => s.onchange = () => { E.operations.find(o => o.id === s.dataset.recat).categorie = s.value; sauver(); toast('Catégorie modifiée'); });
  vue.querySelectorAll('[data-modif-prog]').forEach(b => b.onclick = () => tiroirProgrammee(b.dataset.modifProg));
  $('#btn-prog').onclick = () => tiroirProgrammee();

  // Courbe du solde
  const debut = [decalerJours(AUJ, -120), E.creeLe].sort().pop(), jours = [], soldes = [];
  let s = soldeCompte(compteVu, decalerJours(debut, -1));
  const parJour = {}; E.operations.filter(o => o.compte === compteVu && o.date >= debut).forEach(o => parJour[o.date] = (parJour[o.date] || 0) + o.montant);

  graphique('c-solde', {

      <div><div class="nom">${formule('Solde du mois',

${argent0(F.entrees)} − ${argent0(F.sorties)} = ${argent0(F.solde, true)}`)}</div><div class="valeur ${classe(F.solde)}">${argent0(F.solde, true)}</div><div class="aide">${F.versInvest ? `dont ${argent0(F.versInvest)} placés sur l'investissement` : 'rien placé sur l\'investissement'}</div></div>
      <div><div class="nom">${formule("Taux d'épargne",

  const mois6 = Array.from({ length: 6 }, (_, k) => decalerMois(moisDe(AUJ), k - 5)).filter(c => c >= premier);

      scales: { x: { grid: { display: false } }, y: axeEuros() } },
  });
}

/* Camembert d'une répartition par catégorie, avec sa légende chiffrée.
   Au-delà de six postes, la queue est regroupée : un camembert à douze parts ne se lit pas. */
function camembert(idCanvas, idLegende, parts, messageVide) {
  const zone = $('#' + idLegende), total = parts.reduce((s, p) => s + p.v, 0);
  graphiques[idCanvas]?.destroy();
  if (!parts.length || total <= 0) {
    document.getElementById(idCanvas).closest('.donut').innerHTML = `<div class="vide" style="padding:40px 0">${messageVide}</div>`;
    zone.innerHTML = ''; return;
  }
  const tri = [...parts].sort((a, b) => b.v - a.v);
  const tete = tri.slice(0, 6).map(p => ({ nom: CATEGORIES[p.cle].nom, v: p.v, couleur: CATEGORIES[p.cle].couleur }));
  const reste = tri.slice(6).reduce((s, p) => s + p.v, 0);
  if (reste > 0) tete.push({ nom: `Autres (${tri.length - 6})`, v: reste, couleur: '#C3CCC5' });
  graphique(idCanvas, {
    type: 'doughnut',
    data: { labels: tete.map(p => p.nom), datasets: [{ data: tete.map(p => arrondi(p.v)), backgroundColor: tete.map(p => p.couleur), borderColor: '#FFFFFF', borderWidth: 2, hoverOffset: 6 }] },
    options: { maintainAspectRatio: false, cutout: '58%',
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `${argent(c.parsed)} · ${pct(c.parsed / total * 100, 0)}` } } } },
  });
  const partTexte = v => v / total * 100 < 0.5 ? '< 1 %' : pct(v / total * 100, 0);
  zone.innerHTML = tete.map(p => `<div><i class="pastille" style="background:${p.couleur}"></i><span>${echap(p.nom)}</span><span class="part">${partTexte(p.v)} · ${argent0(p.v)}</span></div>`).join('');
}

/* Diagramme de flux en trois colonnes : entrées → mois → destinations. */
function dessinerSankey(F, entreesCat) {
  const zone = $('#sankey');
  if (F.entrees <= 0 && F.sorties <= 0) { zone.innerHTML = '<div class="vide"><p>Aucun mouvement ce mois-ci.</p></div>'; return; }
  const sources = entreesCat.map(l => ({ nom: CATEGORIES[l.c].nom, v: l.v, couleur: CATEGORIES[l.c].couleur }));
  if (F.solde < 0) sources.push({ nom: 'Puisé dans l\'épargne', v: -F.solde, couleur: '#B23A2E' });
  const destinations = CATS_SORTIE.filter(c => F.parCat[c] > 0).map(c => ({ nom: CATEGORIES[c].nom, v: F.parCat[c], couleur: CATEGORIES[c].couleur })).sort((a, b) => b.v - a.v);
  if (F.solde > 0) {
    const place = Math.min(Math.max(F.versInvest, 0), F.solde);
    if (place > 0) destinations.push({ nom: 'Placé sur l\'investissement', v: place, couleur: '#2B5680' });
    if (F.solde - place > 0.5) destinations.push({ nom: 'Resté sur le courant', v: F.solde - place, couleur: '#1D7A4B' });
  }
  const total = Math.max(sources.reduce((s, n) => s + n.v, 0), destinations.reduce((s, n) => s + n.v, 0));
  const L = 1000, ecart = 8, n = Math.max(sources.length, destinations.length);
  const H = Math.max(280, n * 44), utile = H - ecart * (n - 1);
  const X = { g: 230, m: 430, d: 630 }, larg = 12, k = utile / total;
  const empiler = noeuds => { let y = (H - (noeuds.reduce((s, x) => s + x.v * k, 0) + ecart * (noeuds.length - 1))) / 2; noeuds.forEach(x => { x.y = y; x.h = Math.max(2, x.v * k); y += x.h + ecart; }); };
  empiler(sources); empiler(destinations);
  const mH = total * k, mY = (H - mH) / 2;
  const bande = (x1, y1, x2, y2, h, couleur, titre) => {
    const cx = (x1 + x2) / 2;
    return `<path d="M${x1},${y1} C${cx},${y1} ${cx},${y2} ${x2},${y2} L${x2},${y2 + h} C${cx},${y2 + h} ${cx},${y1 + h} ${x1},${y1 + h} Z" fill="${couleur}"><title>${echap(titre)}</title></path>`;
  };
  let svg = '', yM = mY;
  sources.forEach(s => { svg += bande(X.g + larg, s.y, X.m, yM, s.h, s.couleur, `${s.nom} : ${argent(s.v)}`); yM += s.h; });
  yM = mY;
  destinations.forEach(d => { svg += bande(X.m + larg, yM, X.d, d.y, d.h, d.couleur, `${d.nom} : ${argent(d.v)} (${pct(d.v / total * 100, 0)})`); yM += d.h; });
  /* Les libellés sont tronqués d'après la place réellement disponible de leur côté :
     sans cela, « Remboursements de crédit » dépasse du cadre et se coupe n'importe où.
     Le nom complet reste accessible au survol, et la légende des camemberts le redonne. */
  const place = ancre => (ancre === 'end' ? X.g - 12 : L - X.d - larg - 12) / (0.55 * 16);
  const couper = (nom, ancre) => {
    const max = Math.floor(place(ancre));
    return nom.length <= max ? echap(nom) : echap(nom.slice(0, Math.max(3, max - 1)).trimEnd()) + '…';
  };
  const etiquette = (x, y, h, noeud, ancre) => {
    const titre = `<title>${echap(noeud.nom)} : ${argent(noeud.v)}</title>`;
    if (h >= 32) return `<text x="${x}" y="${y + h / 2 - 8}" text-anchor="${ancre}" dominant-baseline="middle">${couper(noeud.nom, ancre)}${titre}</text><text class="m" x="${x}" y="${y + h / 2 + 9}" text-anchor="${ancre}" dominant-baseline="middle">${argent0(noeud.v)}</text>`;
    if (h >= 12) return `<text x="${x}" y="${y + h / 2}" text-anchor="${ancre}" dominant-baseline="middle">${couper(noeud.nom, ancre)} <tspan class="m">${argent0(noeud.v)}</tspan>${titre}</text>`;
    return '';
  };
  sources.forEach(s => { svg += `<rect x="${X.g}" y="${s.y}" width="${larg}" height="${s.h}" rx="2" fill="${s.couleur}"/>` + etiquette(X.g - 8, s.y, s.h, s, 'end'); });
  destinations.forEach(d => { svg += `<rect x="${X.d}" y="${d.y}" width="${larg}" height="${d.h}" rx="2" fill="${d.couleur}"/>` + etiquette(X.d + larg + 8, d.y, d.h, d, 'start'); });
  svg += `<rect x="${X.m}" y="${mY}" width="${larg}" height="${mH}" rx="2" fill="#15261D"/>`;
  zone.innerHTML = `<svg class="sankey" viewBox="0 0 ${L} ${H + 22}" role="img" aria-label="Flux du mois : ${argent0(F.entrees)} d'entrées, ${argent0(F.sorties)} de sorties">${svg}</svg>`;
}

/* Situation d'un crédit aujourd'hui et projection au rythme actuel. */
function ligneDette(d) {
  const etat = etatDette(d), ass = assuranceDe(d), proj = projeter(etat.capital, d.taux, d.mensualite);
  const premier = prochainMois(d.jour);
  const fin = proj.impossible || etat.capital <= 0.005 ? null : decalerMois(premier, proj.mois - 1);
  return {
    d, etat, ass, proj, fin, total: arrondi(d.mensualite + ass),
    coutAss: proj.impossible ? 0 : ass * proj.mois,
    ecartContrat: fin && d.echeance ? ecartMois(d.echeance, fin) : 0,     // > 0 : fin plus tardive que le contrat
    part: d.capitalDepart ? Math.max(0, 1 - etat.capital / d.capitalDepart) : 1,
  };
}

function afficherSimulateur() {
  const zone = $('#bloc-simu');
  const d = E.dettes.find(x => x.id === simu.detteId);
  if (!d) { zone.innerHTML = '<h2>Rembourser plus vite</h2><div class="vide"><p>Tous vos crédits sont soldés.</p></div>'; return; }
  const etat = etatDette(d), ass = assuranceDe(d);
  const base = projeter(etat.capital, d.taux, d.mensualite);
  const apres = projeter(Math.max(0, etat.capital - simu.anticipe), d.taux, d.mensualite, simu.extra);
  const gainMois = base.impossible || apres.impossible ? null : base.mois - apres.mois;
  const gainInt = base.impossible || apres.impossible ? null : base.interets - apres.interets;
  const gainAss = gainMois ? ass * gainMois : 0;   // l'assurance cesse avec le crédit
  // Indemnités de remboursement anticipé (plafonds légaux français)
  let ira = 0, noteIra = '';
  if (simu.anticipe > 0) {
    if (d.type === 'immobilier') { ira = Math.min(simu.anticipe * d.taux / 100 / 2, etat.capital * 0.03); noteIra = 'Prêt immobilier : indemnités plafonnées à six mois d\'intérêts sur la somme remboursée et à 3 % du capital restant, sauf clause plus favorable.'; }
    else if (d.type !== 'renouvelable' && simu.anticipe > 10000) { ira = simu.anticipe * (base.mois > 12 ? 0.01 : 0.005); noteIra = 'Crédit à la consommation : indemnités de 1 % au plus (0,5 % s\'il reste moins d\'un an), jamais dues sous 10 000 € remboursés sur douze mois.'; }
    else noteIra = 'Pas d\'indemnité due pour ce montant sur ce type de crédit.';
  }
  const dispo = soldeCompte('courant') - affecteObjectifs('courant');
  zone.innerHTML = `
    <h2>Rembourser plus vite</h2>
    <p class="sous-titre">Mensualité augmentée, somme versée en une fois, ou les deux.</p>
    <div class="champ"><label for="s-dette">Crédit</label><select id="s-dette">${E.dettes.filter(x => etatDette(x).capital > 0.005).map(x => `<option value="${x.id}" ${x.id === d.id ? 'selected' : ''}>${echap(x.nom)} · ${argent0(etatDette(x).capital)} à ${pct(x.taux, 2)}</option>`).join('')}</select></div>
    <div class="deux-col">
      <div class="champ"><label for="s-extra">En plus chaque mois</label><input id="s-extra" inputmode="decimal" value="${simu.extra}"></div>
      <div class="champ"><label for="s-anticipe">Versement unique</label><input id="s-anticipe" inputmode="decimal" value="${simu.anticipe}"></div>
    </div>
