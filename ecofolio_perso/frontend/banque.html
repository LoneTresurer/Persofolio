      <div><span>Fin du crédit</span><strong>${apres.impossible ? '—' : dureeTexte(apres.mois)}</strong><span>${gainMois ? `${dureeTexte(gainMois)} plus tôt` : 'inchangée'}</span></div>
      <div><span>Économie nette</span><strong class="gain">${gainInt == null ? '—' : argent0(gainInt + gainAss - ira)}</strong><span>${argent0(gainInt || 0)} d'intérêts${gainAss ? ` et ${argent0(gainAss)} d'assurance` : ''}${ira ? `, moins ${argent0(ira)} d'indemnités` : ''}</span></div>
      <div><span>Rendement équivalent</span><strong>${pct(d.taux, 2)}</strong><span>garanti et sans risque</span></div>
    </div>
    ${noteIra ? `<p class="discret" style="margin:12px 0 0">${noteIra}</p>` : ''}
    <p class="note" style="margin:12px 0 0">Chaque euro remboursé rapporte le taux du crédit, sans risque. Un placement ne fait mieux qu'en espérance, et avec de la volatilité : au-dessus de 4 à 5 %, rembourser est presque toujours le meilleur « investissement ».${ass && d.assurance?.mode === 'pct' ? ' L\'assurance calculée sur le capital emprunté ne baisse pas quand le capital restant baisse : seul le raccourcissement de la durée la réduit.' : ''}</p>
    ${simu.anticipe > 0 ? `<div class="actions-tiroir" style="margin-top:14px"><button class="btn" id="s-appliquer" ${simu.anticipe > dispo ? 'disabled' : ''}>Enregistrer le versement de ${argent0(simu.anticipe)}</button></div>
      ${simu.anticipe > dispo ? `<p class="discret">Le compte courant n'a que ${argent0(dispo)} disponibles hors objectifs.</p>` : ''}` : ''}`;
  $('#s-dette').onchange = e => { simu.detteId = e.target.value; afficherSimulateur(); };
  const brancher = (id, cle) => $(id).addEventListener('change', e => { simu[cle] = Math.max(0, lireNombre(e.target.value)); afficherSimulateur(); });
  brancher('#s-extra', 'extra'); brancher('#s-anticipe', 'anticipe');
  if ($('#s-appliquer')) $('#s-appliquer').onclick = () => {
    const montant = Math.min(simu.anticipe, etat.capital);
    E.operations.push({ id: uid(), date: AUJ, compte: 'courant', montant: -montant, libelle: `Remboursement anticipé ${d.nom}`, categorie: 'credit', detteId: d.id, anticipe: true });
    if (ira > 0) E.operations.push({ id: uid(), date: AUJ, compte: 'courant', montant: -arrondi(ira), libelle: `Indemnités de remboursement anticipé ${d.nom}`, categorie: 'credit' });
    if (etatDette(d).capital <= 0.005) E.programmees.filter(r => r.detteId === d.id).forEach(r => r.actif = false);
    simu.anticipe = 0; sauver(); rafraichir(); toast('Remboursement anticipé enregistré');
  };
}

/* Avalanche (taux le plus élevé d'abord) contre boule de neige (plus petit capital d'abord).
   Avec report, la mensualité et l'assurance d'un crédit soldé sont reversées sur le suivant. */
function simulerStrategie(lignes, extra, ordre, report = true) {
  const etats = lignes.map(l => ({ nom: l.d.nom, c: l.etat.capital, r: tauxMensuel(l.d.taux), m: l.d.mensualite, ass: l.ass, taux: l.d.taux, fin: null }));
  const trier = ordre === 'avalanche' ? (a, b) => b.taux - a.taux : (a, b) => a.c - b.c;
  let mois = 0, interets = 0, assurance = 0; const ordreFin = [];
  while (etats.some(e => e.c > 0.005) && mois < 720) {
    mois++;
    let reserve = extra;
    etats.forEach(e => {
      if (e.c <= 0.005) { if (report) reserve += e.m + e.ass; return; }
      const i = e.c * e.r; interets += i; assurance += e.ass;
      const p = Math.min(e.m, e.c + i); e.c = e.c + i - p;
      if (e.c <= 0.005 && !e.fin) { e.fin = mois; ordreFin.push(e.nom); }
    });
    for (const e of etats.filter(x => x.c > 0.005).sort(trier)) {
      const p = Math.min(reserve, e.c); e.c -= p; reserve -= p;
      if (e.c <= 0.005 && !e.fin) { e.fin = mois; ordreFin.push(e.nom); }
      if (reserve <= 0) break;
    }
  }
  return { mois, interets, assurance, cout: interets + assurance, ordreFin, impossible: mois >= 720 };
}

function afficherStrategie(enCours) {
  const zone = $('#bloc-strategie');
  if (enCours.length < 2) {
    zone.innerHTML = `<h2>Par où commencer</h2><p class="sous-titre">Avec plusieurs crédits, ce bloc compare deux méthodes pour affecter un surplus mensuel.</p><div class="vide"><p>${enCours.length ? 'Un seul crédit en cours : tout surplus va naturellement sur celui-ci.' : 'Aucun crédit en cours.'}</p></div>`;
    return;
  }
  const base = simulerStrategie(enCours, 0, 'avalanche', false);
  const av = simulerStrategie(enCours, strategieExtra, 'avalanche'), bn = simulerStrategie(enCours, strategieExtra, 'boule');
  const ligne = (nom, s, aide) => `<tr><td><strong style="font-weight:500">${nom}</strong><span class="sous">${aide}</span></td>
    <td class="num">${s.impossible ? '—' : dureeTexte(s.mois)}</td><td class="num perte">${argent0(s.cout)}</td><td class="num gain">${argent0(base.cout - s.cout)}</td></tr>`;
  zone.innerHTML = `
    <h2>Par où commencer</h2>
    <p class="sous-titre">Un surplus mensuel fixe ; la mensualité d'un crédit soldé est reportée sur le suivant.</p>
    <div class="champ" style="max-width:220px"><label for="st-extra">Surplus mensuel consacré aux dettes</label><input id="st-extra" inputmode="decimal" value="${strategieExtra}"></div>
    <div class="defile"><table><thead><tr><th>Méthode</th><th class="num">Durée totale</th><th class="num">Coût restant</th><th class="num">Économie</th></tr></thead><tbody>
      ${ligne('Rythme actuel', base, 'mensualités actuelles, sans report')}
      ${ligne('Avalanche', av, 'le taux le plus élevé d\'abord : ' + av.ordreFin.map(echap).join(', '))}
      ${ligne('Boule de neige', bn, 'le plus petit capital d\'abord : ' + bn.ordreFin.map(echap).join(', '))}
    </tbody></table></div>
    <p class="discret" style="margin:12px 0 0">Coût restant : intérêts et assurance. ${av.cout <= bn.cout - 1
      ? `L'avalanche coûte ${argent0(bn.cout - av.cout)} de moins. La boule de neige solde plus vite un premier crédit, ce qui libère une mensualité et aide à tenir l'effort.`
      : 'Les deux méthodes reviennent au même ici : choisissez celle qui vous motive le plus.'}</p>`;
  $('#st-extra').addEventListener('change', e => { strategieExtra = Math.max(0, lireNombre(e.target.value)); afficherStrategie(enCours); });
}

/* ════════════════════════════════════════════════════════════════════════
   IMPORT DE RELEVÉS BANCAIRES
   Le serveur lit les PDF et renvoie ce qu'il a compris ; rien n'est enregistré
   avant que l'utilisateur ait relu. On relit par tiers et non par ligne : trois
   cents opérations tiennent en une quinzaine de commerçants qui pèsent
   l'essentiel des euros.
   ════════════════════════════════════════════════════════════════════════ */
let IMP = null;           // proposition en cours de relecture
let retourImport = 'assistant';

function ouvrirImport(contexte) {
  retourImport = contexte;
  IMP = null;
  $('#assistant').classList.add('cache'); $('#app').classList.add('cache');
  $('#ecran-etat').classList.add('cache'); $('#import').classList.remove('cache');
  rendreImport();
  window.scrollTo(0, 0);
}

function fermerImport() {
  $('#import').classList.add('cache');
  if (retourImport === 'app' && E) { $('#app').classList.remove('cache'); rafraichir(); }
  else { $('#assistant').classList.remove('cache'); etapeCourante = -1; afficherEtape(); }
}

/* ── Envoi des fichiers ─────────────────────────────────────────────────── */
async function envoyerReleves(fichiers) {
  if (!fichiers.length) return;
  const zone = $('#imp-corps');
  zone.innerHTML = `<div class="panneau"><div class="vide"><p>Lecture de ${fichiers.length} relevé${fichiers.length > 1 ? 's' : ''}…</p></div></div>`;
  const form = new FormData();
  [...fichiers].forEach(f => form.append('fichiers', f));
  // Ce que l'utilisateur a déjà classé : inutile de le lui redemander à chaque relevé.
  form.append('regles', JSON.stringify((E && E.regles) || {}));
  try {
    const rep = await fetch(API + '/banque/releves', {
      method: 'POST', headers: { Authorization: 'Bearer ' + JETON }, body: form,
    });
    if (rep.status === 401) return deconnecter();
    const data = await rep.json();
    if (!rep.ok) throw new Error(typeof data.detail === 'string' ? data.detail : 'Lecture impossible');
    if (!data.proposition) {
      zone.innerHTML = `<div class="panneau"><p class="note danger">Aucune opération exploitable.
        ${data.fichiers.map(f => `<br>${echap(f.nom)} : ${echap(f.erreur || (f.anomalies || []).join(', ') || 'relevé déséquilibré')}`).join('')}</p>
        <p class="discret" style="margin-top:12px">Si vos relevés sont des images scannées, le texte n'est pas lisible : téléchargez-les depuis l'espace client de votre banque plutôt que de les photographier.</p></div>`;
      return;
    }
    const p = data.proposition;
    IMP = {
      fichiers: data.fichiers, p,
      // Affectation par compte du relevé : le plus fourni devient le compte courant.
      affectation: {}, cats: {}, garder: {}, manuelles: {}, budgets: {},
      solde: null, correction: 'ajustement',
    };
    let principal = null, maxOps = -1;
    data.fichiers.forEach(f => (f.comptes || []).forEach(c => {
      if (!c.equilibre) return;
      if (c.nb_operations > maxOps) { maxOps = c.nb_operations; principal = c.numero; }
      IMP.affectation[c.numero] = 'ignorer';
    }));
    if (principal !== null) IMP.affectation[principal] = 'courant';
    p.tiers.forEach(t => { IMP.cats[t.cle] = t.categorie; });
    p.recurrences.forEach(r => { IMP.garder[r.cle] = r.reguliere; IMP.manuelles[r.cle] = false; });
    IMP.budgets = budgetsImport();
    // Solde proposé : la clôture du relevé le plus récent du compte retenu.
    IMP.solde = soldeProposeImport();
    rendreImport();
  } catch (e) {
    zone.innerHTML = `<div class="panneau"><p class="note danger">${echap(e.message)}</p></div>`;
  }
}

function comptesImport() {
  const liste = [];
  (IMP?.fichiers || []).forEach(f => (f.comptes || []).forEach(c => liste.push({ ...c, banque: f.banque, fichier: f.nom })));
  return liste;
}

function soldeProposeImport() {
  // Compte déjà configuré : le solde du jour est celui de l'application, et l'écart
  // avec la clôture du dernier relevé est précisément ce qu'il faut montrer.
  if (E && retourImport === 'app') return arrondi(soldeCompte('courant'));
  const retenus = comptesImport().filter(c => IMP.affectation[c.numero] === 'courant' && c.equilibre);
  if (!retenus.length) return 0;
  const dernier = retenus.sort((a, b) => (a.fin || '').localeCompare(b.fin || '')).pop();
  return dernier.solde_cloture ?? 0;
}

/* Récurrences : celles que la détection a trouvées, plus celles que l'utilisateur
   ajoute lui-même depuis la liste des commerçants. Même forme pour les deux. */
function recurrencesImport() {
  const auto = (IMP.p.recurrences || []).map(r => ({ ...r, manuelle: false }));
  const vues = new Set(auto.map(r => r.cle));
  const ajoutees = IMP.p.tiers
    .filter(t => IMP.manuelles[t.cle] && !vues.has(t.cle))
    .map(t => ({
      cle: t.cle, libelle: t.libelle, categorie: IMP.cats[t.cle] || t.categorie, sens: t.sens,
      montant: t.montant_type, jour: t.jour_type, occurrences: t.occurrences, mois: t.mois,
      reguliere: t.stabilite <= 0.12 && t.ecart_jour <= 4, stabilite: t.stabilite,
      ecart_jour: t.ecart_jour, manuelle: true,
    }));
  return [...auto, ...ajoutees].sort((a, b) => b.montant - a.montant);
}

/* Tiers qui deviendront des opérations programmées : exclus des budgets, sinon
   la même dépense serait comptée deux fois dans le plan mensuel. */
function clesProgrammees() {
  return new Set(recurrencesImport().filter(r => IMP.garder[r.cle]).map(r => r.cle));
}

/* Moyenne mensuelle par catégorie, recalculée à chaque reclassement.
   Même formule que le serveur : seuls les mois civils entièrement couverts comptent. */
function budgetsImport() {
  const mois = new Set(IMP.p.mois_complets);
  if (!mois.size) return {};
  const exclus = clesProgrammees(), cumul = {};
  let inconnus = 0;
  IMP.p.operations.forEach(o => {
    if (o.montant >= 0 || !mois.has(o.date.slice(0, 7)) || exclus.has(o.tiers)) return;
    const cat = IMP.cats[o.tiers] || 'inconnu';
    if (cat === 'inconnu') { inconnus += Math.abs(o.montant); return; }
    cumul[cat] = (cumul[cat] || 0) + Math.abs(o.montant);
  });
  const n = mois.size, res = {};
  Object.keys(cumul).sort().forEach(c => { res[c] = arrondi(cumul[c] / n); });
  res.__inconnus = arrondi(inconnus / n);      // montré à part, jamais enregistré comme budget
  return res;
}

/* Opérations retenues, avec la catégorie décidée par l'utilisateur. */
function opsImport() {
  const parCompte = {};
  comptesImport().forEach(c => { parCompte[c.numero] = IMP.affectation[c.numero]; });
  const vues = new Set(), ops = [];
  comptesImport().forEach(c => {
    const dest = parCompte[c.numero];
    if (!c.equilibre || !dest || dest === 'ignorer') return;
    c.operations.forEach(o => {
      // Deux relevés qui se chevauchent contiennent deux fois la même opération.
      const cle = `${dest}|${o.date}|${o.montant}|${o.libelle.slice(0, 40)}`;
      if (vues.has(cle)) return;
      vues.add(cle);
      const t = IMP.p.operations.find(x => x.date === o.date && x.montant === o.montant && x.libelle === o.libelle);
      ops.push({ ...o, compte: dest, tiers: t ? t.tiers : '' });
    });
  });
  return ops.sort((a, b) => a.date.localeCompare(b.date));
}

/* ── Affichage ──────────────────────────────────────────────────────────── */
function rendreImport() {
  const zone = $('#imp-corps');
  if (!IMP) {
    zone.innerHTML = `
      <div class="panneau">
        <h2>Vos relevés, pour partir de vos vraies dépenses</h2>
        <p class="sous-titre">Deux ou trois mois suffisent. Vos catégories, vos charges fixes et vos budgets
          en sont déduits — vous n'avez plus qu'à relire.</p>
        <label class="depot" id="depot">
          <input type="file" id="imp-fichiers" accept="application/pdf,.pdf" multiple hidden>
          <strong>Déposez vos relevés PDF ici</strong>
          <span>ou cliquez pour les choisir · jusqu'à 24 fichiers</span>
        </label>
        <p class="discret" style="margin-top:14px">Téléchargez-les depuis l'espace client de votre banque, au format PDF.
          Une photo ou un scan ne contient pas de texte et ne peut pas être lu. Les fichiers sont lus par le serveur
          puis effacés : seules les opérations que vous validez sont enregistrées.</p>
      </div>`;
    const input = $('#imp-fichiers'), depot = $('#depot');
    input.onchange = () => envoyerReleves(input.files);
    depot.ondragover = e => { e.preventDefault(); depot.classList.add('survol'); };
    depot.ondragleave = () => depot.classList.remove('survol');
    depot.ondrop = e => { e.preventDefault(); depot.classList.remove('survol'); envoyerReleves(e.dataTransfer.files); };
    return;
  }

  const p = IMP.p, comptes = comptesImport();
  const ops = opsImport();
  const total = ops.reduce((s, o) => s + o.montant, 0);
  const inconnus = p.tiers.filter(t => IMP.cats[t.cle] === 'inconnu');
  const eurosInconnus = inconnus.reduce((s, t) => s + Math.abs(t.total), 0);
  const eurosTotal = p.tiers.reduce((s, t) => s + Math.abs(t.total), 0) || 1;

  zone.innerHTML = `
    ${blocFichiers(comptes)}
    ${blocAffectation(comptes)}
    ${ops.length ? `
    ${blocTiers(p, inconnus, eurosInconnus, eurosTotal)}
    ${blocRecurrences(p)}
    ${blocBudgets(p)}
    ${blocSolde(ops, total)}` : '<div class="panneau"><p class="note alerte">Aucun relevé retenu : choisissez au moins un compte à importer.</p></div>'}`;

  brancherImport();
}

function blocFichiers(comptes) {
  const lignes = [];
  IMP.fichiers.forEach(f => {
    if (f.erreur) { lignes.push(`<tr><td>${echap(f.nom)}</td><td colspan="4" class="perte">${echap(f.erreur)}</td></tr>`); return; }
    (f.comptes || []).forEach(c => lignes.push(`<tr>
      <td>${echap(f.nom.slice(0, 28))}<span class="sous">${echap(f.banque || 'banque non reconnue')}${c.libelle ? ' · ' + echap(c.libelle) : ''}</span></td>
      <td style="white-space:nowrap">${c.debut ? dateCourte(c.debut) : '?'} → ${c.fin ? dateCourte(c.fin) : '?'}</td>
      <td class="num">${c.nb_operations}</td>
      <td class="num discret">${argent(c.solde_ouverture)} ${argent(c.mouvements, true)}</td>
      <td class="num">${c.equilibre
        ? `<span class="statut ok">${argent(c.solde_cloture)}</span>`
        : `<span class="statut ko">écart ${argent(c.ecart)}</span>`}</td></tr>`));
    (f.anomalies || []).forEach(a => lignes.push(`<tr><td colspan="5" class="discret">${echap(f.nom.slice(0, 28))} : ${echap(a)}</td></tr>`));
  });
  const casses = comptes.filter(c => !c.equilibre).length;
  return `<div class="panneau">
    <div class="tete-panneau"><div><h2>Relevés lus</h2>
      <p class="sous-titre">Pour chaque compte : solde d'ouverture, somme des mouvements, solde de clôture.
        S'ils ne se recalculent pas au centime, la lecture est fausse et le relevé est écarté.</p></div>
      <button class="mini-btn" id="imp-autres">Ajouter des relevés</button></div>
    <div class="defile"><table><thead><tr><th>Fichier</th><th>Période</th><th class="num">Opérations</th>
      <th class="num">Ouverture + mouvements</th><th class="num">= clôture</th></tr></thead>
      <tbody>${lignes.join('')}</tbody></table></div>
    ${casses ? `<p class="note danger" style="margin-top:12px">${casses} compte${casses > 1 ? 's' : ''} écarté${casses > 1 ? 's' : ''} :
      le total ne retombe pas sur le solde annoncé. Plutôt que d'importer des chiffres faux, envoyez-nous le fichier :
      c'est une mise en page que le lecteur ne connaît pas encore.</p>` : ''}</div>`;
}

function blocAffectation(comptes) {
  // Un même compte apparaît dans chaque relevé mensuel : on le regroupe par numéro,
  // sinon l'utilisateur voit six lignes pour deux comptes.
  const parNumero = {};
  comptes.filter(c => c.equilibre && c.nb_operations).forEach(c => {
    const u = parNumero[c.numero] || (parNumero[c.numero] = {
      numero: c.numero, libelle: c.libelle, banque: c.banque, nb_operations: 0,
      debut: c.debut, fin: c.fin, solde_cloture: c.solde_cloture,
    });
    u.nb_operations += c.nb_operations;
    u.libelle = u.libelle || c.libelle;
    if (c.debut && (!u.debut || c.debut < u.debut)) u.debut = c.debut;
    if (c.fin && (!u.fin || c.fin > u.fin)) { u.fin = c.fin; u.solde_cloture = c.solde_cloture; }
  });
  const utiles = Object.values(parNumero);
  if (utiles.length < 2) return '';
  return `<div class="panneau">
    <h2>Quel compte est lequel ?</h2>
    <p class="sous-titre">Un même PDF contient souvent plusieurs comptes : compte courant, livret, prêt.</p>
    <div class="defile"><table><tbody>${utiles.map(c => `<tr>
      <td>${echap(c.libelle || c.numero)}<span class="sous">${echap(c.banque || '')}${c.banque ? ' · ' : ''}${c.nb_operations} opérations · ${c.debut ? dateCourte(c.debut) : ''} → ${c.fin ? dateCourte(c.fin) : ''}</span></td>
      <td class="num">${argent(c.solde_cloture)}</td>
      <td class="num"><select class="saisie" data-affect="${echap(c.numero)}" style="width:auto">
        ${[['courant', COMPTES.courant.nom], ['invest', COMPTES.invest.nom], ['ignorer', 'Ne pas importer']]
          .map(([v, l]) => `<option value="${v}" ${IMP.affectation[c.numero] === v ? 'selected' : ''}>${l}</option>`).join('')}
      </select></td></tr>`).join('')}</tbody></table></div></div>`;
}

function blocTiers(p, inconnus, eurosInconnus, eurosTotal) {
  const auto = new Set((p.recurrences || []).map(r => r.cle));
  const tri = [...p.tiers].sort((a, b) => {
    const ia = IMP.cats[a.cle] === 'inconnu', ib = IMP.cats[b.cle] === 'inconnu';
    return ia !== ib ? (ia ? -1 : 1) : Math.abs(b.total) - Math.abs(a.total);
  });
  const partConnue = 100 - eurosInconnus / eurosTotal * 100;
  return `<div class="panneau">
    <div class="tete-panneau"><div><h2>Classer vos dépenses</h2>
      <p class="sous-titre">Une ligne par commerçant, la plus lourde d'abord. Classer un commerçant classe
        toutes ses opérations, passées et à venir.</p></div>
      <div style="text-align:right"><div class="discret">Euros reconnus</div>
        <div style="font-size:22px;font-weight:500" id="imp-part">${pct(partConnue, 0)}</div></div></div>

/* Dernier relevé retenu pour le compte courant : c'est lui qui borne l'historique. */
function dernierReleveCourant() {
  const comptes = comptesImport().filter(c => IMP.affectation[c.numero] === 'courant' && c.equilibre);
  return [...comptes].sort((a, b) => (a.fin || '').localeCompare(b.fin || '')).pop() || null;
}

/* Ce qui manque entre la clôture du dernier relevé et le solde d'aujourd'hui.
   Les opérations déjà enregistrées après cette date expliquent une partie de l'écart :
   sans les déduire, un deuxième import recréerait un ajustement déjà posé. */
function ecartImport() {
  const dernier = dernierReleveCourant();
  if (!dernier || !dernier.fin) return 0;
  const apres = E ? E.operations
    .filter(o => o.compte === 'courant' && o.date > dernier.fin)
    .reduce((s, o) => s + o.montant, 0) : 0;
  const solde = IMP.solde == null ? dernier.solde_cloture : IMP.solde;
  return arrondi(solde - dernier.solde_cloture - apres);
}

function blocSolde(ops, total) {
  const dernier = dernierReleveCourant();
  const fin = dernier ? dernier.fin : null, cloture = dernier ? dernier.solde_cloture : 0;
  const solde = IMP.solde == null ? cloture : IMP.solde;
  const ecart = ecartImport();
  const jours = fin ? Math.round((versDate(AUJ) - versDate(fin)) / 86400000) : 0;
  return `<div class="panneau">
    <h2>Et aujourd'hui ?</h2>
    <p class="sous-titre">${fin ? `Vos relevés s'arrêtent au ${dateLongue(fin)}, sur un solde de ${argent(cloture)}.` : ''}
      ${E && retourImport === 'app'
        ? 'Votre compte courant affiche aujourd\'hui ' + argent(soldeCompte('courant')) + ' dans EcoFolio. L\'historique importé vient se placer derrière ce solde, qui ne bouge pas.'
        : 'Indiquez le solde réel de votre compte courant aujourd\'hui : c\'est lui qui fait foi, l\'historique se cale dessus.'}</p>
    <div class="deux-col" style="max-width:520px">
      <div class="champ"><label for="imp-solde">Solde du compte courant aujourd'hui</label>
        <input id="imp-solde" inputmode="decimal" value="${nombre(solde, 2)}" ${E && retourImport === 'app' ? 'disabled' : ''}></div>
      <div class="champ"><label>Opérations importées</label>
        <div style="padding:9px 0">${ops.length} opérations · ${argent(total, true)}</div></div>
    </div>
    ${Math.abs(ecart) >= 0.01 ? `
      <p class="note alerte" style="margin-top:4px">Entre le ${dateCourte(fin)} et aujourd'hui${jours > 0 ? ` (${jours} jour${jours > 1 ? 's' : ''})` : ''},
        <strong>${argent(Math.abs(ecart))}</strong> ${ecart < 0 ? 'ont quitté le compte' : 'sont arrivés sur le compte'} sans être expliqués par vos relevés.</p>
      <div class="types" style="grid-template-columns:1fr 1fr;max-width:520px" id="imp-correction">
        <button type="button" data-corr="releve" aria-pressed="${IMP.correction === 'releve'}">J'ajoute le relevé manquant</button>
        <button type="button" data-corr="ajustement" aria-pressed="${IMP.correction === 'ajustement'}">Enregistrer un ajustement</button>
      </div>
      <p class="discret">${IMP.correction === 'releve'
        ? `Ajoutez le relevé du ${dateCourte(decalerJours(fin, 1))} à aujourd'hui, puis revenez ici : l'écart devrait tomber à zéro.`
        : `Une ligne « Opérations non importées » de ${argent(ecart, true)} sera créée au ${dateCourte(decalerJours(fin, 1))}, en « Non catégorisé ».
           Votre solde restera juste, et ce trou restera visible dans les graphiques au lieu d'être noyé dans vos moyennes.`}</p>`
      : fin ? '<p class="discret">Le solde annoncé correspond exactement à la clôture du dernier relevé : rien ne manque.</p>' : ''}
    <div class="actions-tiroir" style="margin-top:18px">
      <button class="btn" id="imp-valider" style="flex:0 0 auto">${retourImport === 'app' ? 'Importer dans mes comptes' : 'Créer mes comptes avec cet historique'}</button>
      <button class="btn btn-sec" id="imp-annuler">Annuler</button>
    </div>
    <div id="imp-erreur" class="erreur cache" style="margin-top:12px"></div></div>`;
}

function brancherImport() {
  const z = $('#imp-corps');
  if ($('#imp-autres')) $('#imp-autres').onclick = () => { IMP = null; rendreImport(); };
  z.querySelectorAll('[data-affect]').forEach(s => s.onchange = () => {
    IMP.affectation[s.dataset.affect] = s.value; IMP.solde = soldeProposeImport(); rendreImport();
  });
  z.querySelectorAll('[data-cat-tiers]').forEach(s => s.onchange = () => {
    IMP.cats[s.dataset.catTiers] = s.value; IMP.budgets = budgetsImport(); rendreImport();
  });
  z.querySelectorAll('[data-manuel]').forEach(c => c.onchange = () => {
    IMP.manuelles[c.dataset.manuel] = c.checked;
    IMP.garder[c.dataset.manuel] = c.checked;      // ajoutée à la main = cochée d'office
    IMP.budgets = budgetsImport(); rendreImport();
  });
  z.querySelectorAll('[data-rec]').forEach(c => c.onchange = () => {
    IMP.garder[c.dataset.rec] = c.checked; IMP.budgets = budgetsImport(); rendreImport();
  });
  z.querySelectorAll('[data-budgetImp], [data-budget-imp]').forEach(el => el.onchange = () => {
    IMP.budgets[el.dataset.budgetImp] = lireNombre(el.value);
  });
  if ($('#imp-solde')) $('#imp-solde').onchange = e => { IMP.solde = lireNombre(e.target.value); rendreImport(); };
  if ($('#imp-correction')) $('#imp-correction').querySelectorAll('button').forEach(b => b.onclick = () => {
    IMP.correction = b.dataset.corr; rendreImport();
  });
  if ($('#imp-annuler')) $('#imp-annuler').onclick = fermerImport;
  if ($('#imp-valider')) $('#imp-valider').onclick = appliquerImport;
}

/* ── Application à l'état du module ─────────────────────────────────────── */
function appliquerImport() {
  const ops = opsImport();
  if (!ops.length) { const z = $('#imp-erreur'); z.textContent = 'Aucune opération à importer.'; z.classList.remove('cache'); return; }

  const neuf = !E;
  if (neuf) {
    E = {
      version: 1, creeLe: ops[0].date, utilisateur: UTILISATEUR,
      comptes: { courant: { soldeInitial: 0 }, invest: { soldeInitial: 0 } },
      operations: [], programmees: [], dettes: [], objectifs: [], budgets: {}, regles: {}, ignorees: [],
    };
  }
  E.regles = E.regles || {};
  E.creeLe = [E.creeLe, ops[0].date].filter(Boolean).sort()[0];

  // 1. Les corrections de catégorie deviennent des règles : elles vaudront aussi pour l'avenir.
  // « inconnu » n'est pas une décision : l'enregistrer comme règle figerait ces tiers
  // et les empêcherait d'être reconnus plus tard, dictionnaire enrichi.
  Object.entries(IMP.cats).forEach(([cle, cat]) => { if (cle && cat && cat !== 'inconnu') E.regles[cle] = cat; });

  // 2. Les opérations, dédoublonnées contre ce qui est déjà en base.
  const connues = new Set(E.operations.map(o => `${o.compte}|${o.date}|${arrondi(o.montant)}|${(o.libelle || '').slice(0, 40)}`));
  let ajoutees = 0, somme = 0;
  ops.forEach(o => {
    const cle = `${o.compte}|${o.date}|${arrondi(o.montant)}|${o.libelle.slice(0, 40)}`;
    if (connues.has(cle)) return;
    connues.add(cle);
    E.operations.push({
      id: uid(), date: o.date, compte: o.compte, montant: arrondi(o.montant),
      libelle: o.libelle.slice(0, 120), categorie: IMP.cats[o.tiers] || 'inconnu',
      tiers: o.tiers, importe: true,
    });
    ajoutees++; somme += o.montant;
  });

  // 3. L'écart entre le dernier relevé et aujourd'hui, rendu visible plutôt qu'absorbé.
  const dernier = dernierReleveCourant();
  const solde = IMP.solde == null ? (dernier ? dernier.solde_cloture : 0) : IMP.solde;
  const ecart = ecartImport();
  if (dernier && Math.abs(ecart) >= 0.01 && IMP.correction === 'ajustement') {
    E.operations.push({
      id: uid(), date: decalerJours(dernier.fin, 1), compte: 'courant', montant: ecart,
      libelle: 'Opérations non importées', categorie: 'inconnu', ajustement: true,
    });
    somme += ecart;
  }

  // 4. Le solde initial se déduit du solde d'aujourd'hui : le relevé donne l'histoire,
  //    l'utilisateur donne le point d'arrivée.
  if (neuf) E.comptes.courant.soldeInitial = arrondi(solde - somme);
  else E.comptes.courant.soldeInitial = arrondi(E.comptes.courant.soldeInitial - somme);

  // 5. Les récurrences cochées deviennent des opérations programmées, à partir de demain :
  //    les mois passés sont déjà dans l'historique importé, il ne faut pas les recréer.
  let programmees = 0;
  recurrencesImport().forEach(r => {
    if (!IMP.garder[r.cle]) return;
    const cat = IMP.cats[r.cle] || 'inconnu';
    E.programmees.push({
      id: uid(), libelle: r.libelle.slice(0, 60) || r.cle, sens: r.sens,
      categorie: cat, compte: 'courant', montant: arrondi(r.montant), jour: r.jour,
      debut: decalerJours(AUJ, 1), actif: true,
    });
    programmees++;
  });

  // 6. Budgets : seulement pour les catégories qui ne sont pas déjà programmées.
  const catsProg = new Set(E.programmees.map(r => r.categorie));
  Object.entries(IMP.budgets).forEach(([c, v]) => {
    if (c === '__inconnus') return;
    if (v > 0 && CATEGORIES[c] && !catsProg.has(c)) E.budgets[c] = arrondi(v);
  });

  sauver();
  IMP = null;
  if (retourImport === 'app') {
    $('#import').classList.add('cache'); $('#app').classList.remove('cache');
    posterEcheances(); rafraichir();
  } else {
    $('#import').classList.add('cache');
    demarrer();
  }
  toast(`${ajoutees} opérations importées${programmees ? `, ${programmees} opérations programmées` : ''}`);
}

/* ════════════════════════════════════════════════════════════════════════
   TIROIRS DE SAISIE
   ════════════════════════════════════════════════════════════════════════ */
function ouvrirTiroir(html) {
  const t = $('#tiroir'); t.innerHTML = html;
  $('#voile').classList.remove('cache'); t.classList.add('ouvert'); t.setAttribute('aria-hidden', 'false');
  t.querySelector('[data-fermer]').onclick = fermerTiroir;
  setTimeout(() => t.querySelector('input:not([type=hidden]), select')?.focus(), 60);
}
function fermerTiroir() { $('#tiroir').classList.remove('ouvert'); $('#tiroir').setAttribute('aria-hidden', 'true'); $('#voile').classList.add('cache'); }
$('#voile').onclick = fermerTiroir;
document.addEventListener('keydown', e => { if (e.key === 'Escape') fermerTiroir(); });
const enteteTiroir = titre => `<div class="entete"><h2>${titre}</h2><button class="mini-btn" data-fermer aria-label="Fermer">Fermer</button></div>`;
function erreurTiroir(msg) { const z = $('#t-erreur'); z.textContent = msg; z.classList.remove('cache'); }
const optionsComptes = sel => Object.entries(COMPTES).map(([k, c]) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${c.nom}</option>`).join('');

/* Opération ponctuelle : dépense, revenu ou virement. */
function tiroirOperation({ id, type, compte } = {}) {
  const op = id ? E.operations.find(o => o.id === id) : null;
  let t = op ? (op.categorie === 'virement' ? 'VIREMENT' : op.montant > 0 ? 'REVENU' : 'DEPENSE') : (type || 'DEPENSE');
  let de = compte || 'courant';
  if (op?.virementId) de = E.operations.find(o => o.virementId === op.virementId && o.montant < 0).compte;
  const verrou = op && (op.detteId || op.programmeeId);   // échéances : suppression seulement
  const rendre = () => {
    ouvrirTiroir(`${enteteTiroir(op ? 'Modifier l\'opération' : 'Nouvelle opération')}
      ${op ? '' : `<div class="types" id="t-types">${[['DEPENSE', 'Dépense'], ['REVENU', 'Revenu'], ['VIREMENT', 'Virement']].map(([v, l]) => `<button data-t="${v}" aria-pressed="${v === t}">${l}</button>`).join('')}</div>`}
      ${verrou ? `<p class="note" style="margin:0 0 14px">Opération ${op.detteId ? 'liée à un crédit' : 'programmée'} : vous pouvez corriger sa catégorie${op.detteId ? '' : ' ou son montant'}, ou la supprimer.</p>` : ''}
      <div id="t-erreur" class="erreur cache"></div>
      <form id="t-form">
        ${t === 'VIREMENT'
          ? `<div class="deux-col"><div class="champ"><label for="t-de">Depuis</label><select id="t-de">${optionsComptes(de)}</select></div>
             <div class="champ"><label for="t-vers">Vers</label><select id="t-vers">${optionsComptes(de === 'courant' ? 'invest' : 'courant')}</select></div></div>`
          : `<div class="champ"><label for="t-compte">Compte</label><select id="t-compte" ${op ? 'disabled' : ''}>${optionsComptes(op?.compte || de)}</select></div>`}
        <div class="deux-col">
          <div class="champ"><label for="t-montant">Montant (€)</label><input id="t-montant" inputmode="decimal" required value="${op ? Math.abs(op.montant) : ''}" ${op?.detteId ? 'disabled' : ''}></div>
          <div class="champ"><label for="t-date">Date</label><input id="t-date" type="date" max="${AUJ}" value="${op?.date || AUJ}" ${verrou ? 'disabled' : ''}></div>
        </div>
        <div class="champ"><label for="t-libelle">Libellé</label><input id="t-libelle" maxlength="80" value="${echap(op?.libelle || '')}" placeholder="${t === 'REVENU' ? 'Prime, remboursement…' : t === 'VIREMENT' ? 'Facultatif' : 'Commerçant ou description'}" ${op?.detteId ? 'disabled' : ''}></div>
        ${t === 'VIREMENT' ? '' : `<div class="champ"><label for="t-cat">Catégorie</label><select id="t-cat" ${op?.detteId ? 'disabled' : ''}>${(t === 'REVENU' ? CATS_ENTREE : CATS_SORTIE.filter(c => c !== 'credit' || op?.categorie === 'credit')).map(c => `<option value="${c}" ${c === (op?.categorie || (t === 'REVENU' ? 'complement' : 'courses')) ? 'selected' : ''}>${CATEGORIES[c].nom}</option>`).join('')}</select></div>`}
        <div class="actions-tiroir"><button class="btn" type="submit">${op ? 'Enregistrer' : t === 'VIREMENT' ? 'Effectuer le virement' : t === 'REVENU' ? 'Ajouter le revenu' : 'Ajouter la dépense'}</button>
          ${op ? '<button class="btn btn-danger" type="button" id="t-suppr">Supprimer</button>' : ''}</div>
      </form>`);
    $('#t-types')?.querySelectorAll('button').forEach(b => b.onclick = () => { t = b.dataset.t; rendre(); });
    if ($('#t-de')) $('#t-de').onchange = e => { $('#t-vers').value = e.target.value === 'courant' ? 'invest' : 'courant'; };
    $('#t-form').onsubmit = e => {
      e.preventDefault();
      const montant = arrondi(lireNombre($('#t-montant').value)), date = $('#t-date').value, libelle = $('#t-libelle').value.trim();
      if (montant <= 0) return erreurTiroir('Indiquez un montant supérieur à zéro.');
      if (!date || date > AUJ) return erreurTiroir('La date doit être aujourd\'hui ou dans le passé. Pour une opération future, programmez-la.');
      if (t === 'VIREMENT') {
        const a = $('#t-de').value, b = $('#t-vers').value;
        if (a === b) return erreurTiroir('Choisissez deux comptes différents.');
        let garde = {};
        if (op) {
          const envoi = E.operations.find(o => o.virementId === op.virementId && o.montant < 0);
          if (envoi?.occurrence) garde = { occurrence: envoi.occurrence, programmeeId: envoi.programmeeId };
          E.operations = E.operations.filter(o => o.virementId !== op.virementId);
        }
        creerVirement(a, b, montant, garde.occurrence ? op.date : date, libelle || null, garde);
      } else if (op) {
        if (!op.detteId) { op.montant = t === 'REVENU' ? montant : -montant; op.libelle = libelle || op.libelle; op.date = op.programmeeId ? op.date : date; }
        op.categorie = $('#t-cat').value;
      } else {
        if (!libelle) return erreurTiroir('Ajoutez un libellé pour retrouver cette opération.');
        E.operations.push({ id: uid(), date, compte: $('#t-compte').value, montant: t === 'REVENU' ? montant : -montant, libelle, categorie: $('#t-cat').value });
      }
      sauver(); fermerTiroir(); rafraichir();
      toast(op ? 'Opération modifiée' : t === 'VIREMENT' ? 'Virement effectué' : t === 'REVENU' ? 'Revenu ajouté' : 'Dépense ajoutée');
    };
    if ($('#t-suppr')) $('#t-suppr').onclick = () => {
      if (op.programmeeId && !confirm('Cette échéance programmée ne sera pas recréée ce mois-ci. Supprimer ?')) return;
      // L'occurrence supprimée est mémorisée pour ne pas être re-postée au prochain chargement
      const occ = op.virementId ? E.operations.find(o => o.virementId === op.virementId && o.montant < 0)?.occurrence : op.occurrence;
      if (occ) (E.ignorees = E.ignorees || []).push(occ);
      E.operations = E.operations.filter(o => op.virementId ? o.virementId !== op.virementId : o.id !== op.id);
      sauver(); fermerTiroir(); rafraichir(); toast('Opération supprimée');
    };
  };
  rendre();
}

function tiroirProgrammee(id) {
  const r = id ? E.programmees.find(x => x.id === id) : null;
  let t = r ? (r.type === 'VIREMENT' ? 'VIREMENT' : r.sens === 'ENTREE' ? 'REVENU' : 'DEPENSE') : 'DEPENSE';
  const rendre = () => {
    ouvrirTiroir(`${enteteTiroir(r ? 'Opération programmée' : 'Programmer une opération')}
      ${r ? '' : `<div class="types" id="p-types">${[['DEPENSE', 'Prélèvement'], ['REVENU', 'Revenu'], ['VIREMENT', 'Virement']].map(([v, l]) => `<button data-t="${v}" aria-pressed="${v === t}">${l}</button>`).join('')}</div>`}
      <div id="t-erreur" class="erreur cache"></div>
      <form id="p-form">
        <div class="champ"><label for="p-libelle">Libellé</label><input id="p-libelle" maxlength="80" value="${echap(r?.libelle || '')}"></div>
        ${t === 'VIREMENT' ? `<div class="deux-col"><div class="champ"><label for="p-de">Depuis</label><select id="p-de">${optionsComptes(r?.compte || 'courant')}</select></div>
            <div class="champ"><label for="p-vers">Vers</label><select id="p-vers">${optionsComptes(r?.versCompte || 'invest')}</select></div></div>`
          : `<div class="champ"><label for="p-compte">Compte</label><select id="p-compte">${optionsComptes(r?.compte || compteVu)}</select></div>
             <div class="champ"><label for="p-cat">Catégorie</label><select id="p-cat">${(t === 'REVENU' ? CATS_ENTREE : CATS_SORTIE.filter(c => c !== 'credit')).map(c => `<option value="${c}" ${c === r?.categorie ? 'selected' : ''}>${CATEGORIES[c].nom}</option>`).join('')}</select></div>`}
        <div class="deux-col">
          <div class="champ"><label for="p-montant">Montant mensuel (€)</label><input id="p-montant" inputmode="decimal" value="${r?.montant ?? ''}"></div>
          <div class="champ"><label for="p-jour">Chaque mois</label><select id="p-jour">${OPTIONS_JOUR.map(([v, l]) => `<option value="${v}" ${v === (r?.jour || 1) ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
        </div>
        ${r ? `<label class="case"><input type="checkbox" id="p-actif" ${r.actif ? 'checked' : ''}> Active</label>` : '<p class="discret">Première exécution à partir de demain. Les opérations passées ne sont pas recréées.</p>'}
        <div class="actions-tiroir"><button class="btn" type="submit">${r ? 'Enregistrer' : 'Programmer'}</button>${r ? '<button class="btn btn-danger" type="button" id="p-suppr">Supprimer</button>' : ''}</div>
      </form>`);
    $('#p-types')?.querySelectorAll('button').forEach(b => b.onclick = () => { t = b.dataset.t; rendre(); });
    $('#p-form').onsubmit = e => {
      e.preventDefault();
      const libelle = $('#p-libelle').value.trim(), montant = arrondi(lireNombre($('#p-montant').value)), jour = +$('#p-jour').value;
      if (!libelle) return erreurTiroir('Ajoutez un libellé.');
      if (montant <= 0) return erreurTiroir('Indiquez un montant supérieur à zéro.');
      const champs = t === 'VIREMENT'
        ? { type: 'VIREMENT', sens: 'INTERNE', categorie: 'virement', compte: $('#p-de').value, versCompte: $('#p-vers').value }
        : { sens: t === 'REVENU' ? 'ENTREE' : 'SORTIE', categorie: $('#p-cat').value, compte: $('#p-compte').value };
      if (champs.versCompte && champs.versCompte === champs.compte) return erreurTiroir('Choisissez deux comptes différents.');
      if (r) {
        const reactive = !r.actif && $('#p-actif').checked;
        Object.assign(r, champs, { libelle, montant, jour, actif: $('#p-actif').checked });
        if (reactive) r.debut = decalerJours(AUJ, 1);         // pas de rattrapage des mois suspendus
      } else E.programmees.push({ id: uid(), libelle, montant, jour, debut: decalerJours(AUJ, 1), actif: true, ...champs });
      sauver(); fermerTiroir(); rafraichir(); toast(r ? 'Opération programmée modifiée' : 'Opération programmée');
    };
    if ($('#p-suppr')) $('#p-suppr').onclick = () => {
      if (!confirm('Supprimer cette opération programmée ? Les opérations déjà passées restent dans l\'historique.')) return;
      E.programmees = E.programmees.filter(x => x.id !== r.id); sauver(); fermerTiroir(); rafraichir(); toast('Opération programmée supprimée');
    };
  };
  rendre();
}

function tiroirObjectif(id) {
  const o = id ? E.objectifs.find(x => x.id === id) : null;
  const plan = planMensuel();
  ouvrirTiroir(`${enteteTiroir(o ? 'Modifier l\'objectif' : 'Nouvel objectif')}
    <div id="t-erreur" class="erreur cache"></div>
    <form id="o-form">
      <div class="champ"><label for="o-nom">Nom</label><input id="o-nom" maxlength="60" value="${echap(o?.nom || '')}" placeholder="Voyage, apport, voiture…"></div>
      <div class="deux-col">
        <div class="champ"><label for="o-cible">Montant visé (€)</label><input id="o-cible" inputmode="decimal" value="${o?.cible ?? ''}"></div>
        <div class="champ"><label for="o-echeance">À atteindre en</label><input id="o-echeance" type="month" min="${decalerMois(moisDe(AUJ), 1)}" value="${o?.echeance || decalerMois(moisDe(AUJ), 12)}"></div>
      </div>
      <div class="champ"><label for="o-compte">Sur le compte</label><select id="o-compte">${optionsComptes(o?.compte || 'courant')}</select></div>
      <p class="discret" style="margin-top:-6px">Horizon court ou argent qu'on ne peut pas risquer : compte courant. Au-delà de cinq ans : le compte investissement se justifie.</p>
      <div class="note" id="o-calcul" style="margin-bottom:14px"></div>
      <div class="actions-tiroir"><button class="btn" type="submit">${o ? 'Enregistrer' : 'Créer l\'objectif'}</button>${o ? '<button class="btn btn-danger" type="button" id="o-suppr">Supprimer</button>' : ''}</div>
    </form>`);
  const calcul = () => {
    const cible = lireNombre($('#o-cible').value), ech = $('#o-echeance').value;
    if (!cible || !ech) { $('#o-calcul').textContent = 'Indiquez un montant et une échéance pour voir l\'effort mensuel.'; return; }
    const mois = Math.max(1, ecartMois(moisDe(AUJ), ech)), besoin = Math.max(0, cible - (o?.affecte || 0)) / mois;
    const autres = E.objectifs.filter(x => x.id !== o?.id).reduce((s, x) => s + Math.max(0, x.cible - x.affecte) / Math.max(1, ecartMois(moisDe(AUJ), x.echeance)), 0);
    $('#o-calcul').innerHTML = `${argent0(besoin)} à réserver par mois pendant ${dureeTexte(mois)}. Avec vos autres objectifs (${argent0(autres)} / mois), cela représente <strong>${pct((besoin + autres) / Math.max(plan.capacite, 1) * 100, 0)}</strong> de votre capacité d'épargne de ${argent0(plan.capacite)}.`;
  };
  $('#o-cible').oninput = calcul; $('#o-echeance').oninput = calcul; calcul();
  $('#o-form').onsubmit = e => {
    e.preventDefault();
    const nom = $('#o-nom').value.trim(), cible = arrondi(lireNombre($('#o-cible').value)), echeance = $('#o-echeance').value, compte = $('#o-compte').value;
    if (!nom) return erreurTiroir('Donnez un nom à l\'objectif.');
    if (cible <= 0) return erreurTiroir('Indiquez le montant visé.');
    if (!echeance || echeance <= moisDe(AUJ)) return erreurTiroir('L\'échéance doit être dans un mois futur.');
    if (o) {
      if (o.compte !== compte && o.affecte > soldeCompte(compte) - affecteObjectifs(compte)) return erreurTiroir(`Le ${COMPTES[compte].nom.toLowerCase()} n'a pas assez de disponible pour accueillir les ${argent0(o.affecte)} déjà réservés.`);
      Object.assign(o, { nom, cible, echeance, compte, affecte: Math.min(o.affecte, cible) });
    } else E.objectifs.push({ id: uid(), nom, cible, echeance, compte, affecte: 0 });
    sauver(); fermerTiroir(); rafraichir(); toast(o ? 'Objectif modifié' : 'Objectif créé');
  };
  if ($('#o-suppr')) $('#o-suppr').onclick = () => {
    if (!confirm('Supprimer cet objectif ? L\'argent réservé redevient disponible, rien n\'est débité.')) return;
    E.objectifs = E.objectifs.filter(x => x.id !== o.id); sauver(); fermerTiroir(); rafraichir(); toast('Objectif supprimé');
  };
}

function tiroirReserver(id) {
  const o = E.objectifs.find(x => x.id === id);
  const dispo = soldeCompte(o.compte) - affecteObjectifs(o.compte);
  const suggestion = Math.min(Math.max(0, dispo), Math.ceil(Math.max(0, o.cible - o.affecte) / Math.max(1, ecartMois(moisDe(AUJ), o.echeance))));
  ouvrirTiroir(`${enteteTiroir(echap(o.nom))}
    <p class="discret" style="margin-top:-8px">Réserver ne déplace pas d'argent : le montant reste sur le ${COMPTES[o.compte].nom.toLowerCase()} mais n'est plus compté comme disponible.</p>
    <div class="resultat" style="margin-bottom:16px">
      <div><span>Déjà réservé</span><strong>${argent0(o.affecte)}</strong></div>
      <div><span>Disponible sur le compte</span><strong>${argent0(dispo)}</strong></div>
    </div>
    <div id="t-erreur" class="erreur cache"></div>
    <form id="r-form">
      <div class="types" style="grid-template-columns:1fr 1fr" id="r-sens"><button type="button" data-s="1" aria-pressed="true">Réserver</button><button type="button" data-s="-1" aria-pressed="false">Libérer</button></div>
      <div class="champ"><label for="r-montant">Montant (€)</label><input id="r-montant" inputmode="decimal" value="${suggestion || ''}"></div>
      <div class="actions-tiroir"><button class="btn" type="submit" id="r-ok">Réserver</button></div>
    </form>`);
  let sens = 1;
  $('#r-sens').querySelectorAll('button').forEach(b => b.onclick = () => { sens = +b.dataset.s; $('#r-sens').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); $('#r-ok').textContent = sens > 0 ? 'Réserver' : 'Libérer'; });
  $('#r-form').onsubmit = e => {
    e.preventDefault();
    const m = arrondi(lireNombre($('#r-montant').value));
    if (m <= 0) return erreurTiroir('Indiquez un montant supérieur à zéro.');
    if (sens > 0 && m > dispo + 0.004) return erreurTiroir(`Seuls ${argent(dispo)} sont disponibles sur ce compte. Faites d'abord un virement, ou libérez un autre objectif.`);
    if (sens < 0 && m > o.affecte + 0.004) return erreurTiroir(`Seuls ${argent(o.affecte)} sont réservés pour cet objectif.`);
    o.affecte = arrondi(Math.min(o.cible, o.affecte + sens * m));
    sauver(); fermerTiroir(); rafraichir(); toast(sens > 0 ? `${argent0(m)} réservés` : `${argent0(m)} libérés`);
  };
}

function tiroirDette(id, brouillon) {
  const d = id ? E.dettes.find(x => x.id === id) : null;
  const b = brouillon || (d ? {
    nom: d.nom, type: d.type, capital: String(etatDette(d).capital).replace('.', ','), taux: String(d.taux).replace('.', ','),
    echeance: d.echeance, jour: d.jour, mensualite: String(d.mensualite).replace('.', ','), manuelle: true,
    assMode: d.assurance?.mode || 'aucune', assValeur: d.assurance ? String(d.assurance.valeur).replace('.', ',') : '',
    assBase: d.assurance?.base ? String(d.assurance.base).replace('.', ',') : '',
  } : nouveauCredit());
  ouvrirTiroir(`${enteteTiroir(d ? 'Modifier le crédit' : 'Ajouter un crédit')}
    <div id="t-erreur" class="erreur cache"></div>
    <form id="d-form">
      ${champsDette(b)}
      <p class="discret" style="margin:12px 0 14px">${d ? 'Corriger le capital restant recale le suivi à aujourd\'hui ; l\'historique des échéances passées est conservé. Un capital de 0 marque le crédit comme soldé.' : 'La première mensualité sera prélevée sur le compte courant au prochain jour indiqué.'}</p>
      <div class="actions-tiroir"><button class="btn" type="submit">${d ? 'Enregistrer' : 'Ajouter le crédit'}</button>${d ? '<button class="btn btn-danger" type="button" id="d-suppr">Supprimer</button>' : ''}</div>
    </form>`);
  brancherDette($('#d-form'), b, () => tiroirDette(id, b), !!d);
  $('#d-form').onsubmit = e => {
    e.preventDefault();
    const nom = String(b.nom).trim(), c = calcDette(b, !!d);
    if (!nom) return erreurTiroir('Donnez un nom au crédit.');
    if (c.erreur) return erreurTiroir(c.erreur.charAt(0).toUpperCase() + c.erreur.slice(1));
    if (d) {
      // Recalage daté d'aujourd'hui : l'historique des échéances passées reste intact
      if (Math.abs(etatDette(d).capital - c.capital) > 0.005) (d.recalages = d.recalages || []).push({ date: AUJ, capital: c.capital });
      Object.assign(d, { nom, type: b.type, taux: c.taux, mensualite: c.mensualite, jour: +b.jour, echeance: b.echeance || d.echeance, assurance: c.assurance });
      E.programmees.filter(r => r.detteId === d.id).forEach(r => Object.assign(r, { libelle: `Échéance ${nom}`, montant: c.total, jour: +b.jour, actif: c.capital > 0.005 }));
    } else {
      const jumelle = programmeeJumelle(c.total, +b.jour, nom);
      if (jumelle && confirm(`L'opération programmée « ${jumelle.libelle} » de ${argent(jumelle.montant)} le ${jumelle.jour} ressemble à l'échéance de ce crédit.\n\n`
          + `La garder en plus du crédit compterait la même dépense deux fois. La supprimer ?`)) {
        E.programmees = E.programmees.filter(r => r.id !== jumelle.id);
      }
      ajouterDette({ nom, type: b.type, capital: c.capital, taux: c.taux, mensualite: c.mensualite, jour: +b.jour, echeance: b.echeance, assurance: c.assurance }, decalerJours(AUJ, 1));
    }
    sauver(); fermerTiroir(); rafraichir(); toast(d ? 'Crédit modifié' : 'Crédit ajouté');
  };
  if ($('#d-suppr')) $('#d-suppr').onclick = () => {
    if (!confirm('Supprimer ce crédit et son prélèvement programmé ? Les échéances passées restent dans l\'historique du compte courant.')) return;
    E.dettes = E.dettes.filter(x => x.id !== d.id);
    E.programmees = E.programmees.filter(r => r.detteId !== d.id);
    E.operations.forEach(op => { if (op.detteId === d.id) delete op.detteId; });
    sauver(); fermerTiroir(); rafraichir(); toast('Crédit supprimé');
  };
}

function tiroirBudgets() {
  const moyenne = c => { const m = [1, 2, 3].map(k => decalerMois(moisDe(AUJ), -k)).filter(x => x >= moisDe(E.creeLe)); return m.length ? m.reduce((s, x) => s + (fluxMois(x).parCat[c] || 0), 0) / m.length : null; };
  ouvrirTiroir(`${enteteTiroir('Budgets mensuels')}
    <p class="discret" style="margin-top:-8px">Pour les dépenses courantes. Les charges programmées et les crédits sont déjà comptés à leur montant réel.</p>
    <form id="b-form">
      ${CATS_VARIABLES.map(c => { const moy = moyenne(c); return `<div class="champ"><label for="b-${c}">${CATEGORIES[c].nom}${moy != null ? ` · moyenne récente ${argent0(moy)}` : ''}</label><input id="b-${c}" data-b="${c}" inputmode="decimal" value="${E.budgets[c] || ''}" placeholder="0"></div>`; }).join('')}
      <div class="actions-tiroir"><button class="btn" type="submit">Enregistrer les budgets</button></div>
    </form>`);
  $('#b-form').onsubmit = e => {
    e.preventDefault();
    document.querySelectorAll('[data-b]').forEach(el => { const v = lireNombre(el.value); if (v > 0) E.budgets[el.dataset.b] = arrondi(v); else delete E.budgets[el.dataset.b]; });
    sauver(); fermerTiroir(); rafraichir(); toast('Budgets enregistrés');
  };
}

/* ── Boutons d'en-tête ─────────────────────────────────── */
$('#btn-operation').onclick = () => tiroirOperation({ compte: ongletActif === 'comptes' ? compteVu : 'courant' });
$('#btn-import').onclick = () => ouvrirImport('app');
$('#imp-fermer').onclick = fermerImport;
$('#btn-reinit').onclick = async () => {
  if (!confirm('Effacer toutes les données du module Budget et comptes et relancer la configuration ? Le compte-titres n\'est pas concerné.')) return;
  try {
    clearTimeout(minuterie); enAttente = false; if (envoiEnCours) await envoiEnCours;
    await api('/banque/etat', { method: 'DELETE' });
    E = null; VERSION = 0; ongletActif = 'synthese'; ouvrirAssistant();
  } catch (ex) { toast(ex.message); }
};
$('#btn-deconnexion').onclick = async () => { if (enAttente) await envoyer(); enAttente = false; deconnecter(); };

/* ── Démarrage ─────────────────────────────────────────── */
function ecranEtat(titre, texte, actions = '') {
  ['#app', '#assistant', '#import'].forEach(s => $(s).classList.add('cache')); $('#ecran-etat').classList.remove('cache');
  $('#etat-titre').textContent = titre; $('#etat-texte').textContent = texte; $('#etat-actions').innerHTML = actions;
}
async function lancer() {
  if (!JETON) return;
  ecranEtat('Chargement de vos comptes…', '');
  try {
    await charger();
    $('#ecran-etat').classList.add('cache');
    if (E) demarrer(); else ouvrirAssistant();
  } catch (ex) {
    if (/Session expirée/.test(ex.message)) return;
    ecranEtat('Impossible de charger vos comptes', ex.message, '<button class="btn" id="etat-reessayer">Réessayer</button>');
    $('#etat-reessayer').onclick = lancer;
  }
}
lancer();
</script>
</body>
</html>
