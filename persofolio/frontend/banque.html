<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PersoFolio · Budget et comptes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500&display=swap" rel="stylesheet">
<script src="vendor/chart.umd.min.js"></script>
<style>
  /* Même système visuel que portefeuille.html (compte-titres) */
  :root {
    --papier: #F2F4F1;
    --carte: #FFFFFF;
    --encre: #15261D;
    --encre-2: #5B6A61;
    --filet: #D8DED8;
    --filet-2: #EDF0EC;
    --foret: #1E6A48;
    --foret-clair: #E3EFE7;
    --invest: #2B5680;
    --invest-clair: #E6EEF7;
    --gain: #1D7A4B;
    --perte: #B23A2E;
    --perte-clair: #F7E6E3;
    --ambre: #8A5412;
    --ambre-clair: #FBEEDC;
    --champ: #FFFFFF;
    --rayon: 10px;
    /* Infobulles des formules : leurs propres couleurs, parce que --encre
       s'éclaircit en mode sombre et qu'un texte blanc dessus devenait illisible. */
    --bulle-fond: #15261D;
    --bulle-texte: #FFFFFF;
    --bulle-filet: transparent;
  }
  /* Mode sombre, repris du compte-titres pour que les deux modules se ressemblent :
     les verts sont éclaircis pour rester lisibles sur fond foncé, et gains et pertes
     restent distinguables l'un de l'autre sans dépendre de la seule teinte. */
  html[data-theme="sombre"] {
    --papier: #121714;
    --carte: #1A211C;
    --encre: #E8EDE9;
    --encre-2: #9DAAA1;
    --filet: #2C3630;
    --filet-2: #232C26;
    --foret: #5FBC8C;
    --foret-clair: #1E3328;
    --invest: #7FA7CB;
    --invest-clair: #1C2A38;
    --gain: #5FBC8C;
    --perte: #E2796B;
    --perte-clair: #3A221F;
    --ambre: #D9A441;
    --ambre-clair: #2E2719;
    --champ: #222A25;
    --bulle-fond: #2A352E;
    --bulle-texte: #EEF2EF;
    --bulle-filet: #3D4A42;
  }
  html { color-scheme: light; }
  html[data-theme="sombre"] { color-scheme: dark; }

  /* Interrupteur de thème, identique à celui du compte-titres. */
  .bascule-theme { position: relative; display: inline-flex; align-items: center;
    width: 46px; height: 26px; border-radius: 999px; border: 1px solid var(--filet);
    background: var(--papier); cursor: pointer; padding: 0; flex: none; transition: background .2s; }
  .bascule-theme::after { content: ""; position: absolute; left: 2px; top: 1px;
    width: 20px; height: 20px; border-radius: 50%; background: var(--carte);
    box-shadow: 0 1px 2px rgba(21, 38, 29, .15); transition: transform .2s; }
  html[data-theme="sombre"] .bascule-theme { background: var(--foret-clair); border-color: var(--foret); }
  html[data-theme="sombre"] .bascule-theme::after { transform: translateX(20px); }
  .bascule-theme span { position: absolute; font-size: 11px; line-height: 1; top: 7px; }
  .bascule-theme .clair { left: 6px; opacity: 0; }
  .bascule-theme .sombre { right: 6px; opacity: .85; }
  html[data-theme="sombre"] .bascule-theme .clair { opacity: .85; }
  html[data-theme="sombre"] .bascule-theme .sombre { opacity: 0; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--papier); color: var(--encre);
    font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.5;
    font-variant-numeric: tabular-nums;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--foret); outline-offset: 2px; }
  .cache { display: none !important; }
  .num { text-align: right; white-space: nowrap; }
  .gain { color: var(--gain); }
  .perte { color: var(--perte); }
  .discret { color: var(--encre-2); font-size: 13px; }
  h1, h2, h3 { margin: 0; }

  .champ { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; min-width: 0; }
  .champ label, .champ .lib { font-size: 13px; color: var(--encre-2); }
  .champ > label { display: flex; flex-direction: column; gap: 6px; }
  .champ input, .champ select { font-size: 15px; color: var(--encre); }
  .bloc-dette { background: var(--carte); border: 1px solid var(--filet); border-radius: var(--rayon); padding: 14px 16px; margin-bottom: 12px; }
  .bloc-dette .tete-panneau { margin-bottom: 10px; }
  .champ input, .champ select, .saisie {
    background: var(--champ); border: 1px solid var(--filet); border-radius: 8px; padding: 9px 11px; width: 100%; min-width: 0;
  }
  .champ input:focus, .champ select:focus, .saisie:focus { border-color: var(--foret); outline: none; }
  .btn { border: 1px solid var(--foret); background: var(--foret); color: #fff; border-radius: 8px; padding: 10px 18px; font-weight: 500; white-space: nowrap; }
  .btn:hover { background: #185a3c; }
  .btn-sec { background: transparent; color: var(--foret); }
  .btn-sec:hover { background: var(--foret-clair); }
  .btn-lien { background: none; border: none; color: var(--foret); padding: 0; text-decoration: underline; }
  .btn-danger { border-color: var(--perte); background: transparent; color: var(--perte); }
  .btn-danger:hover { background: var(--perte-clair); }
  .btn:disabled, .mini-btn:disabled { opacity: .55; cursor: progress; }
  .mini-btn { border: 1px solid var(--filet); background: var(--carte); border-radius: 6px; padding: 4px 10px; font-size: 13px; white-space: nowrap; text-decoration: none; }
  .mini-btn:hover { border-color: var(--foret); color: var(--foret); }
  .mini-btn.danger:hover { border-color: var(--perte); color: var(--perte); }
  .erreur { background: var(--perte-clair); color: var(--perte); border-radius: 8px; padding: 10px 12px; font-size: 14px; margin-bottom: 14px; }
  .note { background: var(--papier); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; color: var(--encre-2); }
  .note.alerte { background: var(--ambre-clair); color: var(--ambre); }
  .note.danger { background: var(--perte-clair); color: var(--perte); }

  /* ── En-tête ───────────────────────────────────────────── */
  header { border-bottom: 1px solid var(--filet); background: var(--carte); }
  .barre { max-width: 1240px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 12px; }
  .fleche-retour { background: none; border: 1px solid var(--filet); color: var(--encre);
    border-radius: 8px; width: 30px; height: 30px; font-size: 17px; line-height: 1;
    cursor: pointer; padding: 0; margin-right: 10px; flex: 0 0 auto; }
  .fleche-retour:hover { background: var(--papier); }
  /* Sur l'assistant, la carte est centrée : sans cela la flèche se retrouverait au
     milieu de l'écran. On l'épingle au coin supérieur gauche de la page, là où on la
     cherche. */
  #btn-retour-assistant { position: fixed; top: 16px; left: 16px; z-index: 20;
    background: var(--carte); }
  .marque { font-weight: 600; letter-spacing: .01em; }
  .marque span { color: var(--foret); }
  .module { color: var(--encre-2); font-size: 14px; padding-left: 12px; border-left: 1px solid var(--filet); }
  .barre .espace { flex: 1; }
  .sauvegarde { font-size: 13px; color: var(--encre-2); white-space: nowrap; }
  .sauvegarde.erreur-svg { color: var(--perte); }
  .sauvegarde button { font-size: 13px; }
  .utilisateur { color: var(--encre-2); font-size: 14px; }
  main { max-width: 1240px; margin: 0 auto; padding: 28px 24px 60px; }

  /* ── Relevé permanent : patrimoine net et ses composantes ─ */
  .releve { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 22px 48px; margin-bottom: 26px; }
  .releve .libelle { color: var(--encre-2); font-size: 14px; }
  .releve .montant { font-family: 'IBM Plex Serif', serif; font-size: clamp(38px, 6vw, 54px); line-height: 1.05; }
  .releve .evol { font-size: 15px; margin-top: 6px; }
  .chiffres { display: grid; grid-template-columns: repeat(3, auto); gap: 10px 36px; }
  .chiffres > div > span { display: flex; align-items: center; gap: 7px; color: var(--encre-2); font-size: 13px; }
  .chiffres strong { font-size: 18px; font-weight: 500; }
  .pastille { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; display: inline-block; }

  nav.onglets { display: flex; gap: 4px; border-bottom: 1px solid var(--filet); margin-bottom: 22px; overflow-x: auto; }
  nav.onglets button { background: none; border: none; border-bottom: 2px solid transparent; padding: 10px 14px; color: var(--encre-2); font-weight: 500; white-space: nowrap; }
  nav.onglets button[aria-selected="true"] { color: var(--encre); border-bottom-color: var(--foret); }

  .panneau { background: var(--carte); border: 1px solid var(--filet); border-radius: var(--rayon); padding: 18px 20px; margin-bottom: 18px; min-width: 0; }
  .panneau h2 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
  .panneau .sous-titre { color: var(--encre-2); font-size: 13px; margin: 0 0 14px; }
  .tete-panneau { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .grille-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 18px; margin-bottom: 18px; }
  .grille-2 > .panneau { margin-bottom: 0; }
  .grille-large { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; }
  /* minmax(0, 1fr) et non 1fr : « 1fr » laisse la colonne s'élargir à la taille d'un
     tableau large, et la page déborde sur téléphone au lieu de faire défiler le tableau. */
  @media (max-width: 960px) { .grille-large { grid-template-columns: minmax(0, 1fr); } }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-weight: 500; color: var(--encre-2); font-size: 12.5px; padding: 8px 10px; border-bottom: 1px solid var(--filet); white-space: nowrap; }
  th.num { text-align: right; }
  td { padding: 9px 10px; border-bottom: 1px solid var(--filet-2); vertical-align: middle; }
  tr.cliquable:hover td, .cat-ligne.cliquable:hover td { background: var(--foret-clair); }
  tbody tr:last-child td { border-bottom: none; }
  .defile { overflow-x: auto; }
  .sous { display: block; font-size: 12px; color: var(--encre-2); }
  .etiquette { display: inline-block; border-radius: 4px; padding: 1px 7px; font-size: 12px; font-weight: 500; background: var(--filet-2); white-space: nowrap; }
  .etiquette.courant { background: var(--foret-clair); color: var(--foret); }
  .etiquette.invest { background: var(--invest-clair); color: var(--invest); }
  .etiquette.auto { background: var(--papier); color: var(--encre-2); font-weight: 400; }
  .vide { text-align: center; padding: 30px 16px; color: var(--encre-2); }
  .vide p { margin: 0 0 14px; }
  .courbe { position: relative; height: 280px; }
  .donut { position: relative; height: 190px; }

  /* Flux du mois : diagramme de flux + deux camemberts côte à côte */
  .grille-flux { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 1080px) {
    .grille-flux { grid-template-columns: 1fr; }
    .sankey { min-width: 520px; }          /* empilé : on retrouve la largeur, et le défilement */
    #sankey { overflow-x: auto; }
  }
  .bloc-part h3 { font-size: 14px; font-weight: 600; margin: 0 0 2px; }
  .bloc-part .sous-titre { margin-bottom: 8px; }
  .legende-part { font-size: 13px; margin-top: 10px; }
  .legende-part div { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; padding: 2px 0; }
  .legende-part .part { color: var(--encre-2); font-variant-numeric: tabular-nums; }

  /* Simulateur d'intérêts composés */
  .grille-simu { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 26px; align-items: start; }
  @media (max-width: 860px) { .grille-simu { grid-template-columns: 1fr; } }
  .grille-simu input[type=range] { width: 100%; accent-color: var(--foret); padding: 0; border: none; background: none; }
  .grille-simu .champ label { display: flex; flex-direction: row; justify-content: space-between; gap: 10px; align-items: baseline; }
  .grille-simu .champ label strong { color: var(--encre); font-weight: 600; }

  /* Accroche du simulateur sur la synthèse */
  .accroche { display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 18px; align-items: center; }
  @media (max-width: 720px) { .accroche { grid-template-columns: 1fr; } }
  .accroche .chiffre { font-family: 'IBM Plex Serif', serif; font-size: 30px; line-height: 1.1; color: var(--invest); }
  .accroche .mini { height: 92px; }

  /* ── Synthèse : les deux comptes ───────────────────────── */
  .comptes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 18px; margin-bottom: 18px; }
  .compte { background: var(--carte); border: 1px solid var(--filet); border-radius: var(--rayon); padding: 18px 20px; border-top: 4px solid var(--foret); display: flex; flex-direction: column; gap: 10px; }
  .compte.invest { border-top-color: var(--invest); }
  .compte .nom { font-weight: 600; }
  .compte .role { color: var(--encre-2); font-size: 13px; }
  .compte .solde { font-family: 'IBM Plex Serif', serif; font-size: 34px; line-height: 1.1; }
  .compte .lignes { display: grid; grid-template-columns: 1fr auto; gap: 3px 16px; font-size: 13.5px; border-top: 1px solid var(--filet-2); padding-top: 10px; }
  .compte .lignes span:nth-child(odd) { color: var(--encre-2); }
  .compte .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }

  /* Barre de répartition : où est l'argent, et ce qui est dû */
  .repartition { margin-bottom: 18px; }
  .rep-barre { display: flex; height: 36px; border-radius: 6px; overflow: hidden; background: var(--filet-2); }
  .rep-barre > div { min-width: 2px; display: flex; align-items: center; padding: 0 10px; color: #fff; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; }
  .rep-barre.dette { height: 14px; margin-top: 8px; background: transparent; }
  .rep-legende { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13px; color: var(--encre-2); margin-top: 10px; }
  .rep-legende span { display: inline-flex; align-items: center; gap: 7px; }

  /* Pas d'overflow:hidden : les infobulles de formule débordent des tuiles. */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); border: 1px solid var(--filet); border-radius: var(--rayon); background: var(--carte); margin-bottom: 18px; }
  .kpis > div:first-child { border-top-left-radius: var(--rayon); }
  .kpis > div:last-child { border-bottom-right-radius: var(--rayon); border-right: none; }

  /* Formule d'un indicateur, au survol de son intitulé. */
  .formule { position: relative; border-bottom: 1px dotted var(--encre-2); cursor: help; }
  .formule::after {
    content: attr(data-formule);
    position: absolute; left: 0; top: calc(100% + 7px); z-index: 40;
    width: max-content; max-width: 300px;
    background: var(--bulle-fond); color: var(--bulle-texte); border: 1px solid var(--bulle-filet);
    border-radius: 8px; padding: 9px 11px;
    font-size: 12.5px; font-weight: 400; line-height: 1.5; white-space: pre-line;
    display: none; pointer-events: none;
    box-shadow: 0 6px 20px rgba(21, 38, 29, .22);
  }
  /* Absente tant qu'on ne la survole pas : invisible mais présente, elle élargissait
     la page sur téléphone près du bord droit. */
  .formule:hover::after, .formule:focus-visible::after { display: block; }
  /* Près du bord droit, l'infobulle s'aligne par la droite pour rester dans la page. */
  .formule.droite::after { left: auto; right: 0; }
  @media (hover: none) { .formule::after { display: none; } }
  .kpis > div { padding: 14px 18px; border-right: 1px solid var(--filet-2); border-bottom: 1px solid var(--filet-2); }
  .kpis .nom { font-size: 13px; color: var(--encre-2); }
  .kpis .valeur { font-size: 22px; font-weight: 500; margin: 2px 0; }
  .kpis .aide { font-size: 12.5px; color: var(--encre-2); line-height: 1.4; }

  .progres { position: relative; height: 8px; background: var(--filet-2); border-radius: 4px; overflow: hidden; }
  .progres > i { position: absolute; inset: 0 auto 0 0; background: var(--foret); border-radius: 4px; }
  .progres > i.depasse { background: var(--perte); }
  .progres > i.proche { background: #C08A3E; }
  .progres > b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--encre); opacity: .55; }

  .objectif { padding: 12px 0; border-bottom: 1px solid var(--filet-2); display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; align-items: center; }
  .objectif:last-child { border-bottom: none; }
  .objectif .titre { font-weight: 500; }
  .objectif .rang { display: inline-grid; place-items: center; width: 20px; height: 20px; margin-right: 8px;
    border-radius: 50%; background: var(--papier); border: 1px solid var(--filet);
    font-size: 11.5px; color: var(--encre-2); vertical-align: 1px; }
  .objectif .progres { grid-column: 1 / -1; }
  .objectif .detail { grid-column: 1 / -1; font-size: 13px; color: var(--encre-2); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .statut { font-size: 12px; font-weight: 500; border-radius: 4px; padding: 1px 7px; }
  .statut.ok { background: var(--foret-clair); color: var(--foret); }
  .statut.serre { background: var(--ambre-clair); color: var(--ambre); }
  .statut.ko { background: var(--perte-clair); color: var(--perte); }
  .statut.fini { background: var(--invest-clair); color: var(--invest); }

  .echeance { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--filet-2); align-items: center; font-size: 14px; }
  .echeance:last-child { border-bottom: none; }
  .echeance .jour { text-align: center; line-height: 1.1; }
  .echeance .jour strong { display: block; font-size: 18px; font-weight: 500; }
  .echeance .jour small { color: var(--encre-2); font-size: 12px; }

  /* ── Outils de filtre ──────────────────────────────────── */
  .filtres { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .filtres .saisie { width: auto; padding: 7px 10px; font-size: 14px; }
  .segments { display: inline-flex; background: var(--papier); padding: 3px; border-radius: 8px; gap: 2px; }
  .segments button { border: none; background: none; border-radius: 6px; padding: 6px 12px; font-size: 13.5px; color: var(--encre-2); }
  .segments button[aria-pressed="true"] { background: var(--carte); color: var(--encre); box-shadow: 0 1px 2px rgba(0,0,0,.08); font-weight: 500; }
  .nav-mois { display: inline-flex; align-items: center; gap: 6px; }
  /* Sélecteur Mois / Dépenses historiques / Recettes historiques */
  .segments { display: inline-flex; border: 1px solid var(--filet); border-radius: 8px; overflow: hidden; background: var(--carte); }
  .segments button { border: 0; background: transparent; color: var(--encre-2); padding: 7px 12px; font: inherit; font-size: 13.5px; cursor: pointer; }
  .segments button + button { border-left: 1px solid var(--filet); }
  .segments button[aria-pressed="true"] { background: var(--foret-clair); color: var(--foret); font-weight: 500; }
  .tableau-histo td, .tableau-histo th { white-space: nowrap; }
  .tete-moyennes { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin: 6px 0 12px; }
  .tete-moyennes h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .ligne-question { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 0; border-top: 1px solid var(--filet); }
  .ligne-question .choix { margin: 0; }
  .tete-moyennes .sous-titre { margin: 2px 0 0; }
  /* « Vous connaissez : capital restant dû | capital emprunté » : pleine largeur, libellés sur deux lignes au besoin */
  .segments.large { display: flex; width: 100%; }
  .segments.large button { flex: 1 1 0; white-space: normal; line-height: 1.3; padding: 9px 10px; }
  .choix-credit .lib { display: block; margin-bottom: 6px; }
  .tableau-histo .pastille { margin-right: 8px; }
  .tableau-histo td.cliquable:hover { background: var(--foret-clair); cursor: pointer; }
  .nav-mois strong { min-width: 150px; text-align: center; font-weight: 500; text-transform: capitalize; }
  select.cat-inline { border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 3px 4px; font-size: 13.5px; max-width: 190px; }
  select.cat-inline:hover, select.cat-inline:focus { border-color: var(--filet); background: var(--carte); }

  /* ── Flux du mois (Sankey) ─────────────────────────────── */
  /* Le diagramme s'ajuste à la largeur de sa colonne : une barre de défilement
     sous le graphique le désaligne des camemberts posés à côté. */
  .sankey { width: 100%; display: block; }
  /* Tailles exprimées dans le viewBox : le SVG étant réduit pour tenir dans sa
     colonne, elles sont choisies plus grandes qu'à l'écran. */
  .sankey text { font-size: 16px; fill: var(--encre); }
  .sankey text.m { fill: var(--encre-2); font-size: 14px; }
  .sankey path { opacity: .32; transition: opacity .15s; }

<script>
/* ════════════════════════════════════════════════════════════════════════
   PersoFolio · Budget et comptes
   Lecture seule : tout vient des relevés bancaires importés. L'état est un
   document JSON par utilisateur, stocké par le serveur (/banque/etat).
   ════════════════════════════════════════════════════════════════════════ */
const $ = s => document.querySelector(s);
/* Même compte que le compte-titres : jeton délivré par l'API à la connexion (index.html). */
/* Servie par l'API : on lui parle sur sa propre adresse, quel que soit le port.
     L'exécutable Windows prend le premier port libre, qui n'est pas toujours 8000.
     Page ouverte en double-clic (file://) : on tente le port habituel. */
  const API = location.protocol.startsWith('http') ? location.origin : 'http://localhost:8000';
const JETON = localStorage.getItem('persofolio_jeton');
let UTILISATEUR = localStorage.getItem('persofolio_user') || '';
if (!JETON) location.replace('index.html');
/* ── Référentiels ──────────────────────────────────────── */
const CATEGORIES = {
  // Sorties
  logement:    { nom: 'Logement',                 sens: 'SORTIE', couleur: '#1E6A48' },
  factures:    { nom: 'Énergie et télécoms',      sens: 'SORTIE', couleur: '#4F9A74' },
  courses:     { nom: 'Courses',                  sens: 'SORTIE', couleur: '#9CC5A9' },
  transport:   { nom: 'Transport',                sens: 'SORTIE', couleur: '#7FA7CB' },
  sorties:     { nom: 'Restaurants et sorties',   sens: 'SORTIE', couleur: '#C08A3E' },
  abonnements: { nom: 'Abonnements',              sens: 'SORTIE', couleur: '#8E6BA8' },
  sante:       { nom: 'Santé',                    sens: 'SORTIE', couleur: '#D98C7A' },
  shopping:    { nom: 'Shopping',                 sens: 'SORTIE', couleur: '#D5C9A1' },
  loisirs:     { nom: 'Loisirs et voyages',       sens: 'SORTIE', couleur: '#5F8F8B' },
  credit:      { nom: 'Remboursements d\'emprunt', sens: 'SORTIE', couleur: '#C4826F' },
  impots:      { nom: 'Impôts et taxes',          sens: 'SORTIE', couleur: '#6B7A70' },
  frais:       { nom: 'Frais bancaires',          sens: 'SORTIE', couleur: '#8A5412' },
  especes:     { nom: 'Retraits d\'espèces',       sens: 'SORTIE', couleur: '#B7A98C' },
  divers:      { nom: 'Divers',                   sens: 'SORTIE', couleur: '#A8B2AB' },
  // Entrées
  salaire:     { nom: 'Salaire',                  sens: 'ENTREE', couleur: '#1D7A4B' },
  complement:  { nom: 'Revenus complémentaires',  sens: 'ENTREE', couleur: '#4F9A74' },
  aides:       { nom: 'Aides et allocations',     sens: 'ENTREE', couleur: '#7FA7CB' },
  rembours:    { nom: 'Remboursements reçus',     sens: 'ENTREE', couleur: '#9CC5A9' },
  autre_rev:   { nom: 'Autres revenus',           sens: 'ENTREE', couleur: '#A8B2AB' },
  // Mouvement interne, jamais compté comme revenu ou dépense
  virement:    { nom: 'Virement entre comptes',   sens: 'INTERNE', couleur: '#2B5680' },
  // Écart entre le solde suivi et le solde réel, rattrapé à la main. Ni revenu ni
  // dépense : une erreur de suivi corrigée n'est pas de l'argent gagné ou perdu.
  correction:  { nom: 'Correction de solde',      sens: 'INTERNE', couleur: '#8A9690' },
  // Différence entre la clôture d'un relevé et l'ouverture du suivant : un relevé
  // manque. Lue sur deux relevés, jamais inventée ; ni revenu ni dépense.
  ecart:       { nom: 'Écart entre relevés',      sens: 'INTERNE', couleur: '#C9A86A' },
  // Ce que la lecture des relevés n'a pas su classer : visible, jamais deviné.
  inconnu:     { nom: 'Non catégorisé',           sens: 'TOUS',    couleur: '#C3CCC5' },
};
const CATS_SORTIE = Object.keys(CATEGORIES).filter(k => ['SORTIE', 'TOUS'].includes(CATEGORIES[k].sens));
const CATS_ENTREE = Object.keys(CATEGORIES).filter(k => ['ENTREE', 'TOUS'].includes(CATEGORIES[k].sens));
const TYPES_DETTE = {
  immobilier: 'Prêt immobilier', conso: 'Crédit à la consommation', auto: 'Crédit auto',
  etudiant: 'Prêt étudiant', renouvelable: 'Crédit renouvelable', autre: 'Autre emprunt',
};
const SEUIL_ENDETTEMENT = 35; // % des revenus nets, norme HCSF (assurance comprise)

/* ── Thème clair / sombre ───────────────────────────────
   Le réglage est partagé avec le compte-titres (même clé de stockage) : choisi d'un
   côté, il s'applique de l'autre. */
function appliquerTheme(nom, redessiner = false) {
  document.documentElement.dataset.theme = nom;
  const bouton = $('#btn-theme');
  if (bouton) bouton.setAttribute('aria-checked', nom === 'sombre' ? 'true' : 'false');
  try { localStorage.setItem('persofolio_theme', nom); } catch {}
  // Les graphiques sont tracés sur un canevas : ils ne suivent pas la feuille de style
  // et doivent être redessinés. Jamais au premier appel, avant tout affichage.
  if (redessiner && E) rafraichir();
}
appliquerTheme((() => { try { return localStorage.getItem('persofolio_theme'); } catch { return null; } })()
  || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'sombre' : 'clair'));
/* Retour à la page précédente. history.length vaut 1 quand l'onglet n'a pas
   d'historique — page ouverte directement, ou premier écran d'un nouvel onglet :
   on renvoie alors vers l'accueil plutôt que de laisser un bouton sans effet. */
document.addEventListener('DOMContentLoaded', () => {
  const revenir = () => {
    if (history.length > 1) history.back();
    else location.href = 'index.html';
  };
  // Une flèche dans l'en-tête du module, une autre sur l'assistant de configuration :
  // l'en-tête vit dans #app, masqué tant que le module n'est pas configuré, et c'est
  // précisément pendant l'assistant qu'on peut vouloir ressortir.
  for (const id of ['#btn-retour', '#btn-retour-assistant']) {
    const b = $(id);
    if (b) b.onclick = revenir;
  }
});

document.addEventListener('DOMContentLoaded', () => {
  const bouton = $('#btn-theme');
  if (!bouton) return;
  bouton.setAttribute('aria-checked', document.documentElement.dataset.theme === 'sombre' ? 'true' : 'false');
  bouton.onclick = () => appliquerTheme(
    document.documentElement.dataset.theme === 'sombre' ? 'clair' : 'sombre', true);
});

/* ── Formats ───────────────────────────────────────────── */
const nombre = (v, d = 2) => (v == null || isNaN(v)) ? '—' : new Intl.NumberFormat('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d }).format(v);
function argent(v, signe = false, d = 2) {
  if (v == null || isNaN(v)) return '—';
  return new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', minimumFractionDigits: d, maximumFractionDigits: d, signDisplay: signe ? 'exceptZero' : 'auto' }).format(v);
}
const argent0 = (v, signe) => argent(v, signe, 0);
const pct = (v, d = 1) => (v == null || !isFinite(v)) ? '—' : nombre(v, d) + ' %';
const classe = v => v > 0.004 ? 'gain' : v < -0.004 ? 'perte' : '';
const echap = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lireNombre = v => { const n = parseFloat(String(v ?? '').replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : 0; };
const arrondi = v => Math.round(v * 100) / 100;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ── Dates (toujours en chaînes locales AAAA-MM-JJ) ─────── */
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const versDate = s => new Date(s + 'T12:00:00');
const AUJ = iso(new Date());
const moisDe = s => s.slice(0, 7);
const joursDansMois = (a, m) => new Date(a, m, 0).getDate();           // m = 1..12
function decalerMois(cleMois, n) {
  const [a, m] = cleMois.split('-').map(Number);
  const d = new Date(a, m - 1 + n, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}
function decalerJours(s, n) { const d = versDate(s); d.setDate(d.getDate() + n); return iso(d); }
function dateDansMois(cleMois, jour) {
  const [a, m] = cleMois.split('-').map(Number);
  return `${cleMois}-${String(Math.min(jour, joursDansMois(a, m))).padStart(2, '0')}`;
}
const libelleMois = (cle, court = false) => versDate(cle + '-01').toLocaleDateString('fr-FR', court ? { month: 'short' } : { month: 'long', year: 'numeric' });
const dateCourte = s => versDate(s).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
const dateLongue = s => versDate(s).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
const ecartMois = (de, a) => { const [a1, m1] = de.split('-').map(Number), [a2, m2] = a.split('-').map(Number); return (a2 - a1) * 12 + (m2 - m1); };
function dureeTexte(mois) {
  if (mois == null || !isFinite(mois)) return '—';
  const a = Math.floor(mois / 12), m = mois % 12;
  return [a ? `${a} an${a > 1 ? 's' : ''}` : '', m ? `${m} mois` : ''].filter(Boolean).join(' ') || '0 mois';
}

/* Intitulé d'indicateur portant sa formule, visible au survol ou au clavier.
   On y met le calcul *et* les nombres du moment : une formule abstraite se vérifie mal. */
function formule(nom, calcul, droite = false) {
  return `<span class="formule${droite ? ' droite' : ''}" tabindex="0" data-formule="${echap(calcul)}">${nom}</span>`;
}

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}

/* ════════════════════════════════════════════════════════════════════════
   ÉTAT ET PERSISTANCE
   ════════════════════════════════════════════════════════════════════════ */
let E = null;          // état complet du module
let VERSION = 0;       // version serveur sur laquelle E est fondé (contrôle de concurrence)

async function api(chemin, options = {}) {
  let rep;
  try {
    rep = await fetch(API + chemin, { ...options, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + JETON, ...(options.headers || {}) } });
  } catch {
    const e = new Error('Le serveur ne répond pas. Dans le dossier backend, lancez « python -m uvicorn main:app --reload », puis ouvrez http://localhost:8000.');
    e.reseau = true; throw e;
  }
  const data = await rep.json().catch(() => ({}));
  if (rep.status === 401) { deconnecter(); throw new Error('Session expirée.'); }
  if (!rep.ok) {
    const d = data.detail, e = new Error(typeof d === 'string' ? d : d?.message || (Array.isArray(d) ? d.map(x => x.msg).join(' ; ') : `Erreur ${rep.status}`));
    e.status = rep.status; e.detail = d; throw e;
  }
  return data;
}

function deconnecter() {
  fetch(API + '/auth/deconnexion', { method: 'POST', headers: { Authorization: 'Bearer ' + JETON } }).catch(() => {});
  localStorage.removeItem('persofolio_jeton'); localStorage.removeItem('persofolio_user');
  location.replace('index.html');
}

/* ── Le compte investissement, c'est le compte-titres ───────────────────────
   Il n'a plus de solde à lui : ses espèces et ses titres sont ceux du
   compte-titres, vus d'ici.

   Deux natures de chiffres, et c'est ce qui décide de l'affichage. Les espèces
   et le prix de revient se déduisent des seules opérations enregistrées : ils
   sont exacts, et disponibles sans connexion. La valeur de marché des titres,
   elle, demande des cours. Hors ligne, on montre donc le prix de revient en le
   disant, plutôt qu'un chiffre périmé qu'on ferait passer pour la valeur du
   jour. */
let INV = null;              // null tant que le compte-titres n'a pas répondu

const investEspeces = () => INV ? INV.cash_eur : 0;
const investTitres  = () => INV ? (INV.titres_valeur_eur != null ? INV.titres_valeur_eur
                                                                 : INV.titres_cout_eur) : 0;
const investAuCout  = () => !!INV && INV.titres_valeur_eur == null && INV.titres_cout_eur > 0.005;

async function chargerInvestissement() {
  try {
    INV = await api('/banque/investissement');
  } catch {
    INV = null;                       // compte-titres pas encore ouvert : on n'invente rien
    return;
  }
  // La valeur de marché est un supplément : son absence ne doit jamais empêcher
  // le reste de s'afficher.
  INV.titres_valeur_eur = null; INV.valeur_le = null;
  // Les espèces viennent du même calcul que l'en-tête du compte-titres, portefeuille
  // par portefeuille : le « Solde espèces » de là-bas est donc celui d'ici. Quand le
  // compte-titres répond, on prend ses chiffres tels qu'il les affiche ; sinon, le
  // calcul hors ligne de /banque/investissement, qui est le même.
  const ids = INV.portefeuilles?.length ? INV.portefeuilles : [null];
  try {
    let titres = 0, especes = 0;
    for (const id of ids) {
      const s = await api('/compte/synthese', id == null ? {} : { headers: { 'X-Portefeuille': String(id) } });
      const t = s?.totaux?.titres_eur, c = s?.totaux?.cash_eur;
      if (typeof t !== 'number' || !isFinite(t) || typeof c !== 'number' || !isFinite(c)) return;
      titres += t; especes += c;
    }
    if (Math.abs(especes - INV.cash_eur) > 0.005)
      console.warn(`Solde espèces : ${especes} au compte-titres, ${INV.cash_eur} hors ligne`);
    INV.cash_eur = arrondi(especes);
    if (INV.titres_cout_eur > 0.005) { INV.titres_valeur_eur = arrondi(titres); INV.valeur_le = AUJ; }
  } catch { /* hors ligne, ou cours indisponibles : prix de revient et espèces calculées ici font foi */ }
}

/* Enregistrement sur le serveur : regroupé (300 ms), une requête à la fois, jamais silencieux en cas d'échec. */
let enAttente = false, envoiEnCours = null, minuterie = null;
function sauver() { enAttente = true; indiquerSauvegarde('en-cours'); clearTimeout(minuterie); minuterie = setTimeout(envoyer, 300); }
async function envoyer() {
  if (envoiEnCours) await envoiEnCours;
  if (!enAttente || !E) return;
  enAttente = false;
  envoiEnCours = (async () => {
    try {
      const r = await api('/banque/etat', { method: 'PUT', body: JSON.stringify({ etat: E, version: VERSION }) });
      VERSION = r.version;
      indiquerSauvegarde(enAttente ? 'en-cours' : 'ok');
    } catch (ex) {
      if (ex.status === 409) {
        // Modifié ailleurs : on recharge la version du serveur plutôt que de l'écraser
        await charger(); if (E) rafraichir(); else ouvrirImport();
        indiquerSauvegarde('ok');
        toast('Modification non enregistrée : vos comptes avaient changé dans un autre onglet ou appareil. Version à jour rechargée, refaites la modification.');
      } else { enAttente = true; indiquerSauvegarde('erreur', ex.message); }
    } finally { envoiEnCours = null; }
  })();
  return envoiEnCours;
}

/* Vide la file avant une écriture qui porte sa propre version. Un virement
   envoie l'état complet : si un enregistrement ordinaire partait en même temps,
   l'un des deux travaillerait sur une version périmée. */
async function attendreEnvois() {
  clearTimeout(minuterie);
  if (enAttente) await envoyer();
  if (envoiEnCours) await envoiEnCours;
}
function indiquerSauvegarde(etat, message) {
  const z = $('#sauvegarde'); if (!z) return;
  z.classList.toggle('erreur-svg', etat === 'erreur');
  z.innerHTML = etat === 'ok' ? 'Enregistré' : etat === 'en-cours' ? 'Enregistrement…'
    : `Non enregistré <button class="btn-lien" id="svg-reessayer" title="${echap(message || '')}">Réessayer</button>`;
  if (etat === 'erreur') $('#svg-reessayer').onclick = () => { indiquerSauvegarde('en-cours'); envoyer(); };
}
window.addEventListener('beforeunload', e => {
  if (!enAttente) return;
  // Dernière chance : envoi maintenu même si la page se ferme
  fetch(API + '/banque/etat', { method: 'PUT', keepalive: true, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + JETON }, body: JSON.stringify({ etat: E, version: VERSION }) });
  e.preventDefault(); e.returnValue = '';
});

/* ════════════════════════════════════════════════════════════════════════
   MOTEUR : opérations programmées, soldes, dettes
   ════════════════════════════════════════════════════════════════════════ */

/* Taux mensuel équivalent au TAEG annuel saisi (convention bancaire française : taux proportionnel). */
const tauxMensuel = tauxAnnuelPct => tauxAnnuelPct / 100 / 12;

/* Mensualité constante hors assurance qui solde `capital` en `n` échéances (formule d'annuité). */
function mensualiteAnnuite(capital, tauxAnnuel, n) {
  if (n < 1) return null;
  const r = tauxMensuel(tauxAnnuel);
  return r === 0 ? capital / n : capital * r / (1 - Math.pow(1 + r, -n));
}
/* Mois de la prochaine échéance : la première date « jour » strictement après `apres`. */
function prochainMois(jour, apres = AUJ) {
  const m = moisDe(apres);
  return dateDansMois(m, jour) > apres ? m : decalerMois(m, 1);
}
/* Nombre d'échéances restantes, de la prochaine (à partir de `debut` inclus) au mois de la dernière inclus. */
const echeancesRestantes = (echeance, jour, debut = decalerJours(AUJ, 1)) => ecartMois(prochainMois(jour, decalerJours(debut, -1)), echeance) + 1;
/* Assurance emprunteur : montant fixe, ou taux annuel appliqué au capital emprunté à l'origine (usage en France). */
const assuranceMensuelle = a => !a || !a.valeur ? 0 : a.mode === 'pct' ? a.valeur / 100 * (a.base || 0) / 12 : a.valeur;
const assuranceDe = d => arrondi(assuranceMensuelle(d.assurance));

/* ── Calendrier contractuel : première échéance et différé ─────────────────
   `premiere` (AAAA-MM) est le mois de la première échéance du contrat ; les
   `differe.mois` premières échéances sont en différé :
   - partiel : on ne paie que les intérêts du mois (et l'assurance) ;
   - total : on ne paie rien (sauf l'assurance), les intérêts s'ajoutent au capital.
   Les crédits saisis avant ces champs n'en ont pas : aucun différé. */
const dateEcheance = (d, k) => dateDansMois(decalerMois(d.premiere, k), d.jour);
function phaseDiffere(d, date) {
  if (!d.premiere || !d.differe || !(d.differe.mois > 0)) return null;
  const k = ecartMois(d.premiere, moisDe(date));
  return k >= 0 && k < d.differe.mois ? d.differe.type : null;
}
/* Premier mois où une échéance est encore à venir. */
const refDette = d => [DREF, d.capitalLe || ''].sort().pop();
const premierMoisAVenir = d => { const ref = refDette(d); return d.premiere && dateEcheance(d, 0) > ref ? d.premiere : prochainMois(d.jour, ref); };

/* Échéancier complet d'un contrat, de la première échéance à la dernière :
   différé éventuel, puis amortissement à mensualité constante. La mensualité est
   celle du contrat si elle est donnée, sinon celle qui solde le capital (augmenté
   des intérêts capitalisés d'un différé total) en `duree − différé` mois. */
function tableauContrat({ capital, taux, premiere, jour, duree, mensualite, differe, ass = 0 }) {
  const r = tauxMensuel(taux), nd = differe && differe.mois > 0 ? differe.mois : 0, lignes = [];
  let c = capital, mois = premiere;
  for (let k = 0; k < nd; k++) {
    const i = c * r, date = dateDansMois(mois, jour);
    if (differe.type === 'total') { c += i; lignes.push({ date, phase: 'total', credit: 0, interets: arrondi(i), amorti: 0, capitalise: arrondi(i), assurance: ass, restant: arrondi(c) }); }
    else lignes.push({ date, phase: 'partiel', credit: arrondi(i), interets: arrondi(i), amorti: 0, capitalise: 0, assurance: ass, restant: arrondi(c) });
    mois = decalerMois(mois, 1);
  }
  const m = mensualite > 0 ? arrondi(mensualite) : (duree > nd ? arrondi(mensualiteAnnuite(c, taux, duree - nd)) : null);
  if (!m) return { lignes, mensualite: null, erreur: 'indiquez la durée du crédit ou sa mensualité.' };
  if (c > 0.005 && m <= c * r + 0.005) return { lignes, mensualite: m, erreur: `une mensualité de ${argent(m)} ne couvre pas les ${argent(c * r)} d'intérêts du mois.` };
  while (c > 0.005 && lignes.length < 720) {
    const i = c * r, date = dateDansMois(mois, jour);
    let p = Math.min(m - i, c);
    if (dernierReste(c - p, m)) p = c;
    c -= p;
    lignes.push({ date, phase: null, credit: arrondi(p + i), interets: arrondi(i), amorti: arrondi(p), capitalise: 0, assurance: ass, restant: Math.max(0, arrondi(c)) });
    mois = decalerMois(mois, 1);
  }
  return { lignes, mensualite: arrondi(m), erreur: null };
}

/* Tout ce qui fait bouger le capital d'une dette, dans l'ordre :
   - les échéances du compte courant qui lui sont rattachées ;
   - celles d'avant le début du suivi (`historique`), déjà dans le solde de départ
     du compte courant : elles comptent pour la dette, pas pour le compte ;
   - les recalages saisis par l'utilisateur ;
   - les intérêts capitalisés d'un différé total, échus jusqu'à aujourd'hui. */
function evenementsDette(dette) {
  const hist = (dette.historique || []).map(h => ({ date: h.date, montant: -arrondi(h.credit + (h.assurance || 0)),
    assurance: h.assurance || 0, differeTotal: h.differeTotal, avantSuivi: true }));
  const recalages = (dette.recalages || []).map(r => ({ date: r.date, recalage: r.capital }));
  const capit = [];
  if (dette.premiere && dette.differe?.type === 'total')
    for (let k = 0; k < dette.differe.mois; k++) { const date = dateEcheance(dette, k); if (date <= DREF) capit.push({ date, capitalise: true }); }
  const rang = o => o.capitalise ? 0 : o.recalage != null ? 2 : 1;
  return E.operations.filter(o => o.detteId === dette.id && (!dette.capitalLe || o.date > dette.capitalLe)).concat(hist, capit, recalages)
    .sort((a, b) => a.date.localeCompare(b.date) || rang(a) - rang(b));
}

/* Rejoue toutes les échéances d'une dette pour connaître son capital restant dû.
   Chaque échéance normale = intérêts du mois + amortissement ; un remboursement anticipé = 100 % capital. */
function etatDette(dette, jusquA = '9999-12-31') {
  const r = tauxMensuel(dette.taux);
  let capital = dette.capitalDepart, interets = 0, amorti = 0, nb = 0;
  evenementsDette(dette)
    .filter(o => o.date <= jusquA)
    .forEach(o => {
      if (o.recalage != null) { capital = o.recalage; return; }   // capital corrigé par l'utilisateur
      if (o.capitalise) { const i = capital * r; capital += i; interets += i; return; }   // différé total
      if (o.differeTotal) return;                                // pendant un différé total, seule l'assurance est payée
      const paiement = -o.montant - (o.assurance || 0);          // l'assurance n'amortit rien
      if (o.anticipe) { const p = Math.min(paiement, capital); capital -= p; amorti += p; return; }
      const i = capital * r, p = Math.min(Math.max(paiement - i, 0), capital);
      capital -= p; interets += i; amorti += p; nb++;
    });
  return { capital: Math.max(0, arrondi(capital)), interets, amorti, nb };
}

/* Projection d'amortissement à mensualité constante. */
/* Une mensualité arrondie au centime laisse quelques centimes à la fin du
   tableau : comme les banques, on les ajoute à la dernière échéance plutôt que
   d'en créer une de plus. Seuil : 5 % d'une mensualité. */
const dernierReste = (reste, mensualite) => reste > 0.005 && reste < mensualite * 0.05;

function projeter(capital, tauxAnnuel, mensualite, extra = 0) {
  const r = tauxMensuel(tauxAnnuel), paiement = mensualite + extra;
  if (capital <= 0.005) return { mois: 0, interets: 0, serie: [0] };
  if (paiement <= capital * r + 0.005) return { impossible: true };
  let c = capital, interets = 0, mois = 0; const serie = [c];
  while (c > 0.005 && mois < 720) {
    const i = c * r;
    let p = Math.min(paiement, c + i);
    if (dernierReste(c + i - p, paiement)) p = c + i;
    c = c + i - p; interets += i; mois++; serie.push(Math.max(0, c));
  }
  return { mois, interets, serie };
}

/* Le compte courant se rejoue depuis ses opérations ; le compte investissement
   est celui du compte-titres, espèces plus titres. Le premier est une histoire,
   le second un état : on ne peut pas remonter le temps sur la valeur d'un titre
   sans ses cours passés, donc une date demandée ne s'applique qu'au courant. */
const soldeCompte = (compte, jusquA = '9999-12-31') => {
  if (compte === 'invest') return arrondi(investEspeces() + investTitres());
  return E.comptes[compte].soldeInitial
    + E.operations.filter(o => o.compte === compte && o.date <= jusquA).reduce((s, o) => s + o.montant, 0);
};
const detteTotale = (jusquA) => E.dettes.reduce((s, d) => s + etatDette(d, jusquA).capital, 0);
const patrimoineNet = (jusquA) => soldeCompte('courant', jusquA) + soldeCompte('invest', jusquA) - detteTotale(jusquA);
const estFlux = o => CATEGORIES[o.categorie]?.sens !== 'INTERNE';

const OPTIONS_JOUR = Array.from({ length: 28 }, (_, i) => [i + 1, `le ${i + 1}`]);
/* Majuscules sans accents : comparaison de libellés entre une dette et une programmation. */
function normaliserTiers(t) {
  return (t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^A-Za-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim().toUpperCase();
}

/* Différé encore à venir d'un crédit, pour préremplir sa modification. */
function differeRestant(d) {
  if (!d.premiere || !(d.differe?.mois > 0)) return { differeType: 'aucun', differeMois: '' };
  const reste = d.differe.mois - ecartMois(d.premiere, premierMoisAVenir(d));
  return reste > 0 ? { differeType: d.differe.type, differeMois: String(reste) } : { differeType: 'aucun', differeMois: '' };
}

/* ── Saisie d'un crédit (assistant et tiroir) ──────────────────────────────
   Deux façons de décrire un crédit, au choix de l'utilisateur :
   - « restant » : le capital restant dû aujourd'hui et la prochaine échéance ;
     les échéances passées sont déjà dans ce capital, rien n'est rejoué ;
   - « contrat » : le capital emprunté et la première échéance, même lointaine ;
     le tableau d'amortissement est rejoué jusqu'à aujourd'hui, en supposant
     chaque échéance payée à sa date.
   Dans les deux cas : dernière échéance → mensualité calculée, modifiable ;
   différé partiel ou total possible au début du calendrier saisi. */
const OPTIONS_ASSURANCE = [['aucune', 'Sans assurance'], ['euros', 'Montant fixe par mois'], ['pct', 'Taux annuel sur le capital emprunté']];
const OPTIONS_DIFFERE = [['aucun', 'Sans différé'], ['partiel', 'Partiel'], ['total', 'Total']];
const ecartJours = (a, b) => Math.round((versDate(b) - versDate(a)) / 864e5);
/* Mois de départ du calendrier saisi : première échéance du contrat, ou prochaine à venir. */
const debutSaisi = b => b.mode === 'contrat' ? (b.premiere || '') : (b.prochaine || prochainMois(+b.jour));

function calcDette(b, permettreZero = false) {
  const contrat = b.mode === 'contrat';
  const capital = lireNombre(b.capital), taux = lireNombre(b.taux), jour = +b.jour, premiere = debutSaisi(b);
  const nd = b.differeType && b.differeType !== 'aucun' ? Math.round(lireNombre(b.differeMois)) : 0;
  const differe = nd > 0 ? { type: b.differeType, mois: nd } : null;
  const duree = premiere && b.echeance ? ecartMois(premiere, b.echeance) + 1 : 0;
  const assurance = b.assMode === 'aucune' ? null
    : { mode: b.assMode, valeur: lireNombre(b.assValeur), base: contrat ? capital : (lireNombre(b.assBase) || capital) };
  const ass = arrondi(assuranceMensuelle(assurance));
  const base = { capital, taux, premiere, jour, duree, differe, ass };
  const auto = capital > 0 && premiere && duree > nd ? tableauContrat({ ...base, mensualite: null }) : null;
  const calc = auto && !auto.erreur ? auto.mensualite : null;
  const saisie = b.manuelle ? arrondi(lireNombre(b.mensualite)) : 0;
  let erreur = null;
  if (capital < 0 || (!capital && !permettreZero)) erreur = contrat ? 'indiquez le capital emprunté.' : 'indiquez le capital restant dû.';
  else if (taux < 0 || taux > 30) erreur = 'le taux doit être compris entre 0 et 30 %.';
  else if (capital > 0 && !premiere) erreur = 'indiquez le mois de la première échéance.';
  else if (capital > 0 && !contrat && dateDansMois(premiere, jour) <= AUJ)
    erreur = `l'échéance du ${dateLongue(dateDansMois(premiere, jour))} est passée, et le capital restant dû d'aujourd'hui en tient compte : indiquez la suivante.`;
  else if (b.differeType && b.differeType !== 'aucun' && !(nd >= 1 && nd <= 120)) erreur = 'indiquez la durée du différé, entre 1 et 120 mois.';
  else if (capital > 0 && !b.echeance) erreur = 'indiquez le mois de la dernière échéance.';
  else if (capital > 0 && duree <= nd) erreur = differe ? 'la dernière échéance doit tomber après la fin du différé.'
    : `la dernière échéance doit tomber après ${contrat ? 'la première' : 'la prochaine'}.`;
  else if (assurance && !assurance.valeur) erreur = 'indiquez le montant ou le taux de l\'assurance, ou choisissez « Sans assurance ».';
  let tab = null;
  if (!erreur && capital > 0) {
    tab = tableauContrat({ ...base, mensualite: saisie > 0 ? saisie : null });
    if (tab.erreur) erreur = tab.erreur;
    else if (contrat && tab.lignes[tab.lignes.length - 1].date <= AUJ) erreur = 'd\'après ces dates, ce crédit est déjà entièrement remboursé.';
  }
  if (erreur) tab = null;
  const passees = tab ? tab.lignes.filter(l => l.date <= AUJ) : [], futures = tab ? tab.lignes.filter(l => l.date > AUJ) : [];
  const mensualite = tab ? tab.mensualite : (saisie || calc || 0);
  const proj = tab ? { mois: futures.length, interets: futures.reduce((s, l) => s + l.interets, 0), fin: moisDe(futures[futures.length - 1].date) } : null;
  return { contrat, capital, restant: passees.length ? passees[passees.length - 1].restant : capital, taux, premiere, differe, n: duree, calc,
           mensualite, assurance, ass, total: arrondi(mensualite + ass), tab, passees, futures, proj, erreur };
}

function champsDette(b) {
  const opt = (liste, v) => liste.map(([k, l]) => `<option value="${k}" ${String(k) === String(v) ? 'selected' : ''}>${l}</option>`).join('');
  const contrat = b.mode === 'contrat', ed = b.edition, avecDiffere = b.differeType && b.differeType !== 'aucun';
  const champEcheance = `<label class="champ"><span class="lib">Dernière échéance</span><input data-d="echeance" type="month" min="${decalerMois(moisDe(AUJ), 1)}" value="${echap(b.echeance)}"></label>`;
  const champJour = `<label class="champ"><span class="lib">Prélevée</span><select data-d="jour">${opt(OPTIONS_JOUR, b.jour)}</select></label>`;
  return `
    ${ed ? '' : `<div class="champ choix-credit"><span class="lib">Vous connaissez</span>
      <div class="segments large" role="group" aria-label="Vous connaissez">
        <button type="button" data-dmode="restant" aria-pressed="${!contrat}">Le capital restant dû aujourd'hui</button>
        <button type="button" data-dmode="contrat" aria-pressed="${contrat}">Le capital total emprunté</button>
      </div></div>`}
    <div class="deux-col">
      <label class="champ"><span class="lib">Nom</span><input data-d="nom" maxlength="60" value="${echap(b.nom)}" placeholder="Prêt auto"></label>
      <label class="champ"><span class="lib">Type</span><select data-d="type">${opt(Object.entries(TYPES_DETTE), b.type)}</select></label>
    </div>
    <div class="deux-col">
      <label class="champ"><span class="lib">${contrat ? 'Capital emprunté (€)' : 'Capital restant dû (€)'}</span><input data-d="capital" inputmode="decimal" value="${echap(b.capital)}" placeholder="0"></label>
      <label class="champ"><span class="lib">Taux nominal annuel (%)</span><input data-d="taux" inputmode="decimal" value="${echap(b.taux)}" placeholder="0,0" title="Le taux débiteur de votre contrat, hors assurance. Le TAEG, qui inclut l'assurance et les frais, surestimerait les intérêts."></label>
    </div>
    ${ed ? `<div class="deux-col">${champEcheance}${champJour}</div>` : `
    <div class="deux-col">
      ${contrat
        ? `<label class="champ"><span class="lib">Première échéance</span><input data-d="premiere" type="month" value="${echap(b.premiere)}"></label>`
        : `<label class="champ"><span class="lib">Prochaine échéance</span><input data-d="prochaine" type="month" min="${moisDe(AUJ)}" value="${echap(debutSaisi(b))}"></label>`}
      ${champEcheance}
    </div>
    <div class="deux-col">
      ${champJour}
      <label class="champ"><span class="lib">Différé${contrat ? ' au début du crédit' : ' à venir'}</span><select data-d="differeType">${opt(OPTIONS_DIFFERE, b.differeType || 'aucun')}</select></label>
    </div>
    ${avecDiffere ? `<div class="deux-col">
      <label class="champ"><span class="lib">Durée du différé (mois)</span><input data-d="differeMois" inputmode="numeric" value="${echap(b.differeMois)}" placeholder="12"></label>
      <div></div>
    </div>
    <p class="discret" style="margin:-4px 0 14px">À compter de la ${contrat ? 'première' : 'prochaine'} échéance. ${b.differeType === 'total'
        ? 'Vous ne payez rien (hors assurance) ; les intérêts s\'ajoutent au capital.' : 'Vous ne payez que les intérêts (et l\'assurance).'}</p>` : ''}`}
    <div class="deux-col">
      <div class="champ"><label><span class="lib">Mensualité${avecDiffere ? ' après le différé' : ''} hors assurance (€)</span><input class="saisie" data-d="mensualite" inputmode="decimal" value="${echap(b.mensualite)}"></label><span class="discret" data-mode-mens></span></div>
      <label class="champ"><span class="lib">Assurance emprunteur</span><select data-d="assMode">${opt(OPTIONS_ASSURANCE, b.assMode)}</select></label>
    </div>
    ${b.assMode === 'aucune' ? '' : `<div class="deux-col">
      <label class="champ"><span class="lib">${b.assMode === 'pct' ? 'Taux d\'assurance annuel (%)' : 'Assurance par mois (€)'}</span><input data-d="assValeur" inputmode="decimal" value="${echap(b.assValeur)}" placeholder="${b.assMode === 'pct' ? '0,30' : '0'}"></label>
      ${b.assMode === 'pct' && !contrat ? `<label class="champ"><span class="lib">Capital emprunté à l'origine (€)</span><input data-d="assBase" inputmode="decimal" value="${echap(b.assBase)}" placeholder="capital restant par défaut"></label>` : ''}
    </div>`}
    <p class="note" data-resume style="margin:0"></p>`;
}

/* Résumé sous le formulaire. `suiviDepuis` : null dans l'assistant (tout le passé
   est déjà dans les soldes saisis), E.creeLe dans le tiroir. */
function resumeDette(b, c, suiviDepuis) {
  if (c.erreur) return `<span class="perte">${c.erreur.charAt(0).toUpperCase() + c.erreur.slice(1)}</span>`;
  if (!c.capital) return 'Emprunt soldé.';
  const pl = (n, mot) => `${n} ${mot}${n > 1 ? 's' : ''}`;
  const nb = c.proj.mois, lignes = [];
  if (c.contrat) {
    let passe = '';
    if (c.passees.length) {
      const morceaux = [], enTotal = c.passees.filter(l => l.phase === 'total');
      if (enTotal.length) morceaux.push(`${enTotal.length} mois de différé total${c.ass ? ' (assurance seule)' : ', sans paiement'} : ${argent0(enTotal.reduce((s, l) => s + l.capitalise, 0))} d'intérêts ajoutés au capital`);
      const avant = c.passees.filter(l => l.phase !== 'total' && (!suiviDepuis || l.date < suiviDepuis)).length;
      const depuis = suiviDepuis ? rapprocherEcheances(c.passees.filter(l => l.phase !== 'total' && l.date >= suiviDepuis && l.date <= decalerJours(DREF, 5))) : [];
      const lies = depuis.filter(x => x.op).length, ajoutes = depuis.filter(x => !x.op && x.attendu > 0.005).length;
      if (avant) morceaux.push(`${pl(avant, 'échéance')} payée${avant > 1 ? 's' : ''} ${suiviDepuis ? `avant le début du suivi (${dateLongue(suiviDepuis)})` : 'avant aujourd\'hui'} : historique de l'emprunt, ${suiviDepuis ? 'déjà dans le solde de votre compte courant' : 'déjà dans le solde du compte courant que vous indiquerez'}`);
      if (lies) morceaux.push(`${pl(lies, 'échéance')} depuis, retrouvée${lies > 1 ? 's' : ''} dans vos relevés et rattachée${lies > 1 ? 's' : ''} à l'emprunt`);
      if (ajoutes) morceaux.push(`${pl(ajoutes, 'échéance')} depuis le début du suivi${avant ? '' : ` (${dateLongue(suiviDepuis)})`}, introuvable${ajoutes > 1 ? 's' : ''} dans vos relevés : le capital restant dû n'en tiendra compte qu'une fois retrouvée${ajoutes > 1 ? 's' : ''}`);
      passe = ` Déjà passé, en supposant chaque échéance payée à sa date : ${morceaux.join(' ; ')}.`;
    }
    lignes.push(`Capital restant dû aujourd'hui : <strong>${argent(c.restant)}</strong>.${passe}`);
  }
  lignes.push(`${pl(nb, 'échéance')} à venir jusqu'en ${libelleMois(c.proj.fin)}, ${argent0(c.proj.interets)} d'intérêts${c.ass ? ` et ${argent0(c.ass * nb)} d'assurance` : ''}. Prélevé chaque mois : <strong>${argent(c.total)}</strong>${c.ass ? ` dont ${argent(c.ass)} d'assurance` : ''}.`);
  const enDiffere = c.futures.filter(l => l.phase);
  if (enDiffere.length) {
    const f = enDiffere[0], fin = moisDe(enDiffere[enDiffere.length - 1].date);
    lignes.push(f.phase === 'partiel'
      ? `Jusqu'en ${libelleMois(fin)}, différé partiel : ${argent(f.credit + f.assurance)} le premier mois, les intérêts seuls${c.ass ? ' et l\'assurance' : ''}.`
      : `Jusqu'en ${libelleMois(fin)}, différé total : ${c.ass ? `${argent(c.ass)} d'assurance seulement` : 'rien à payer'} ; ${argent0(enDiffere.reduce((s, l) => s + l.capitalise, 0))} d'intérêts s'ajouteront au capital.`);
  }
  const decalage = b.echeance ? ecartMois(b.echeance, c.proj.fin) : 0;
  if (b.manuelle && Math.abs(decalage) >= 1)
    lignes.push(`Avec cette mensualité, le crédit se termine en ${libelleMois(c.proj.fin)}, ${dureeTexte(Math.abs(decalage))} ${decalage > 0 ? 'après' : 'avant'} l'échéance indiquée.`);
  return lignes.join('<br>');
}

/* Relie les champs d'un formulaire de crédit à l'objet `b` ; `rerendre` est appelé quand la structure change. */
function brancherDette(racine, b, rerendre, permettreZero = false, suiviDepuis = null) {
  const maj = () => {
    const c = calcDette(b, permettreZero), mens = racine.querySelector('[data-d="mensualite"]');
    if (!b.manuelle) { b.mensualite = c.calc != null ? String(c.calc).replace('.', ',') : ''; mens.value = b.mensualite; }
    const proch = racine.querySelector('[data-d="prochaine"]'); if (proch && !b.prochaine) proch.value = debutSaisi(b);
    racine.querySelector('[data-mode-mens]').innerHTML = b.manuelle
      ? `Saisie manuelle${c.calc != null ? ` · <button type="button" class="btn-lien" data-recalc>recalculer (${argent(c.calc)})</button>` : ''}`
      : 'Calculée d\'après la dernière échéance';
    const r = racine.querySelector('[data-recalc]'); if (r) r.onclick = () => { b.manuelle = false; maj(); };
    racine.querySelector('[data-resume]').innerHTML = resumeDette(b, c, suiviDepuis);
  };
  racine.querySelectorAll('[data-dmode]').forEach(bt => bt.onclick = () => {
    if (b.mode === bt.dataset.dmode) return;
    b.mode = bt.dataset.dmode; b.manuelle = false; rerendre();
  });
  racine.querySelectorAll('[data-d]').forEach(el => el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => {
    b[el.dataset.d] = el.value;
    if (el.dataset.d === 'mensualite') b.manuelle = true;
    if (el.dataset.d === 'assMode' || el.dataset.d === 'differeType') return rerendre();
    maj(); if (racine.onmaj) racine.onmaj();
  }));
  maj();
}
const nouveauCredit = () => ({ mode: 'restant', nom: '', type: 'conso', capital: '', taux: '', premiere: '', prochaine: '', echeance: decalerMois(moisDe(AUJ), 36), jour: 5,
  mensualite: '', manuelle: false, assMode: 'aucune', assValeur: '', assBase: '', differeType: 'aucun', differeMois: '' });

/* ── Graphiques (Chart.js) ─────────────────────────────── */
function graphique(id, config) {
  if (!window.Chart) return;
  graphiques[id]?.destroy();
  const el = document.getElementById(id); if (!el) return;
  Chart.defaults.font.family = "'IBM Plex Sans', system-ui, sans-serif";
  Chart.defaults.color = couleurTheme('--encre-2');
  graphiques[id] = new Chart(el, config);
}
/* Valeur courante d'une variable CSS : les graphiques sont dessinés sur un canevas
   et ne suivent pas la feuille de style, il faut leur passer la couleur du moment. */
const couleurTheme = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim() || '#5B6A61';
/* Fonction et non constante : la couleur de grille suit le thème en cours, qui peut
   changer entre deux tracés. */
const axeEuros = () => ({ ticks: { callback: v => argent0(v) }, grid: { color: couleurTheme('--filet-2') }, border: { display: false } });

/* ════════════════════════════════════════════════════════════════════════
   SIMULATEUR D'INTÉRÊTS COMPOSÉS
   Versements en fin de mois, intérêts capitalisés mensuellement. Le taux saisi
   est annuel : on utilise son équivalent mensuel géométrique (1+t)^(1/12)-1,
   pour qu'un taux de 5 % produise réellement 5 % sur douze mois.
   ════════════════════════════════════════════════════════════════════════ */
let sim = null;   // initialisé à la première ouverture, à partir des comptes réels

function simDefauts() {
  // Point de départ : la moitié de l'épargne constatée, jamais un plan.
  const c = capaciteConstatee();
  const mensuel = c ? Math.max(0, Math.round(c.moyenne / 2 / 10) * 10) : 100;
  return {
    initial: Math.round(soldeCompte('invest')), mensuel, annees: 20, taux: 5, inflation: 2, reel: false,
  };
}

function projeterEpargne({ initial, mensuel, annees, taux }) {
  const r = Math.pow(1 + taux / 100, 1 / 12) - 1, n = Math.round(annees * 12);
  const serie = [{ mois: 0, verse: initial, total: initial }];
  let total = initial, verse = initial;
  for (let k = 1; k <= n; k++) {
    total = total * (1 + r) + mensuel;
    verse += mensuel;
    if (k % 12 === 0 || k === n) serie.push({ mois: k, verse: arrondi(verse), total: arrondi(total) });
  }
  return { serie, verse: arrondi(verse), total: arrondi(total), interets: arrondi(total - verse), r, n };
}

/* ═════════════ Onglet 5 : Simulateur d'investissement ═════════════ */
function vueSimulateur() {

  if (!sim) sim = simDefauts();
  const p = projeterEpargne(sim);
  // Valeur « en euros d'aujourd'hui » : on retire l'inflation du résultat nominal.
  const deflateur = Math.pow(1 + sim.inflation / 100, sim.annees);
  const aff = v => argent0(sim.reel ? v / deflateur : v);

            <div><span>Versé par vous</span><strong>${aff(p.verse)}</strong><span>${argent0(sim.mensuel)} × ${sim.annees * 12} mois${sim.initial ? ` + ${argent0(sim.initial)}` : ''}</span></div>

${argent0(p.total)} − ${argent0(p.verse)} = ${argent0(p.interets)}
Intérêts calculés chaque mois au taux équivalent (1 + taux annuel)^(1/12) − 1, et réinvestis.`)}</span><strong class="gain">${aff(p.interets)}</strong><span>${pct(partInterets, 0)} du capital final</span></div>
