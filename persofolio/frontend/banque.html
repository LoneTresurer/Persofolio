/* Une phrase qui dit ce que le graphique montre, calculée et non décorative. */
function phraseSimu(p, d) {
  if (d.mensuel <= 0 && d.initial <= 0) return 'Indiquez un capital de départ ou un versement mensuel pour voir l\'effet.';
  if (d.taux <= 0) return 'À rendement nul, l\'argent ne fait que s\'accumuler : le capital final est exactement la somme versée. C\'est la situation d\'un compte courant, inflation en plus.';
  const anneesEffort = d.mensuel > 0 ? p.interets / (d.mensuel * 12) : null;
  return `Sur ${d.annees} ans, les intérêts rapportent ${argent0(p.interets)}, soit ${pct(p.interets / Math.max(p.verse, 1) * 100, 0)} de ce que vous avez versé`
    + (anneesEffort ? ` — l'équivalent de ${nombre(anneesEffort, 1)} années de versements obtenues sans rien verser.` : '.')
    + ` Un euro placé aujourd'hui en vaut ${nombre(Math.pow(1 + d.taux / 100, d.annees), 2)} au terme ; le même euro versé la dernière année n'a pas le temps de travailler. C'est la durée, plus que le montant, qui fait le résultat.`;
}

/* Camembert d'une répartition par catégorie, avec sa légende chiffrée.
   Au-delà de six postes, la queue est regroupée : un camembert à douze parts ne se lit pas. */
function camembert(idCanvas, idLegende, parts, messageVide) {
  const zone = $('#' + idLegende), total = parts.reduce((s, p) => s + p.v, 0);
  graphiques[idCanvas]?.destroy();
  if (!parts.length || total <= 0) {
    document.getElementById(idCanvas).closest('.donut').innerHTML = `<div class="vide" style="padding:40px 0">${messageVide}</div>`;
    zone.innerHTML = ''; return;
  }
  const tri = [...parts].sort((a, b) => b.v - a.v);
  const tete = tri.slice(0, 6).map(p => ({ nom: p.nom || CATEGORIES[p.cle].nom, v: p.v, couleur: p.couleur || CATEGORIES[p.cle].couleur }));
  const reste = tri.slice(6).reduce((s, p) => s + p.v, 0);
  if (reste > 0) tete.push({ nom: `Autres (${tri.length - 6})`, v: reste, couleur: '#C3CCC5' });
  graphique(idCanvas, {
    type: 'doughnut',
    data: { labels: tete.map(p => p.nom), datasets: [{ data: tete.map(p => arrondi(p.v)), backgroundColor: tete.map(p => p.couleur), borderColor: '#FFFFFF', borderWidth: 2, hoverOffset: 6 }] },
    options: { maintainAspectRatio: false, cutout: '58%',
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `${argent(c.parsed)} · ${pct(c.parsed / total * 100, 0)}` } } } },
  });
  const partTexte = v => v / total * 100 < 0.5 ? '< 1 %' : pct(v / total * 100, 0);
  zone.innerHTML = tete.map(p => `<div><i class="pastille" style="background:${p.couleur}"></i><span>${echap(p.nom)}</span><span class="part">${partTexte(p.v)} · ${argent0(p.v)}</span></div>`).join('');
}

/* Diagramme de flux en trois colonnes : entrées → mois → destinations. */
function dessinerSankey(F, entreesCat) {
  const zone = $('#sankey');
  if (F.entrees <= 0 && F.sorties <= 0) { zone.innerHTML = '<div class="vide"><p>Aucun mouvement ce mois-ci.</p></div>'; return; }
  const sources = entreesCat.map(l => ({ nom: CATEGORIES[l.c].nom, v: l.v, couleur: CATEGORIES[l.c].couleur }));
  if (F.solde < 0) sources.push({ nom: 'Puisé dans l\'épargne', v: -F.solde, couleur: '#B23A2E' });
  const destinations = CATS_SORTIE.filter(c => F.debits[c] > 0).map(c => ({ nom: CATEGORIES[c].nom, v: F.debits[c], couleur: CATEGORIES[c].couleur })).sort((a, b) => b.v - a.v);
  if (F.solde > 0.5) destinations.push({ nom: 'Épargne du mois', v: F.solde, couleur: '#5F8FBF' });
  const total = Math.max(sources.reduce((s, n) => s + n.v, 0), destinations.reduce((s, n) => s + n.v, 0));
  const L = 1000, ecart = 8, n = Math.max(sources.length, destinations.length);
  const H = Math.max(280, n * 44), utile = H - ecart * (n - 1);
  const X = { g: 230, m: 430, d: 630 }, larg = 12, k = utile / total;
  const empiler = noeuds => { let y = (H - (noeuds.reduce((s, x) => s + x.v * k, 0) + ecart * (noeuds.length - 1))) / 2; noeuds.forEach(x => { x.y = y; x.h = Math.max(2, x.v * k); y += x.h + ecart; }); };
  empiler(sources); empiler(destinations);
  const mH = total * k, mY = (H - mH) / 2;
  const bande = (x1, y1, x2, y2, h, couleur, titre) => {
    const cx = (x1 + x2) / 2;
    return `<path d="M${x1},${y1} C${cx},${y1} ${cx},${y2} ${x2},${y2} L${x2},${y2 + h} C${cx},${y2 + h} ${cx},${y1 + h} ${x1},${y1 + h} Z" fill="${couleur}"><title>${echap(titre)}</title></path>`;
  };
  let svg = '', yM = mY;
  sources.forEach(s => { svg += bande(X.g + larg, s.y, X.m, yM, s.h, s.couleur, `${s.nom} : ${argent(s.v)}`); yM += s.h; });
  yM = mY;
  destinations.forEach(d => { svg += bande(X.m + larg, yM, X.d, d.y, d.h, d.couleur, `${d.nom} : ${argent(d.v)} (${pct(d.v / total * 100, 0)})`); yM += d.h; });
  /* Les libellés sont tronqués d'après la place réellement disponible de leur côté :
     sans cela, « Remboursements de crédit » dépasse du cadre et se coupe n'importe où.
     Le nom complet reste accessible au survol, et la légende des camemberts le redonne. */
  const place = ancre => (ancre === 'end' ? X.g - 12 : L - X.d - larg - 12) / (0.55 * 16);
  const couper = (nom, ancre) => {
    const max = Math.floor(place(ancre));
    return nom.length <= max ? echap(nom) : echap(nom.slice(0, Math.max(3, max - 1)).trimEnd()) + '…';
  };
  const etiquette = (x, y, h, noeud, ancre) => {
    const titre = `<title>${echap(noeud.nom)} : ${argent(noeud.v)}</title>`;
    if (h >= 32) return `<text x="${x}" y="${y + h / 2 - 8}" text-anchor="${ancre}" dominant-baseline="middle">${couper(noeud.nom, ancre)}${titre}</text><text class="m" x="${x}" y="${y + h / 2 + 9}" text-anchor="${ancre}" dominant-baseline="middle">${argent0(noeud.v)}</text>`;
    if (h >= 12) return `<text x="${x}" y="${y + h / 2}" text-anchor="${ancre}" dominant-baseline="middle">${couper(noeud.nom, ancre)} <tspan class="m">${argent0(noeud.v)}</tspan>${titre}</text>`;
    return '';
  };
  sources.forEach(s => { svg += `<rect x="${X.g}" y="${s.y}" width="${larg}" height="${s.h}" rx="2" fill="${s.couleur}"/>` + etiquette(X.g - 8, s.y, s.h, s, 'end'); });
  destinations.forEach(d => { svg += `<rect x="${X.d}" y="${d.y}" width="${larg}" height="${d.h}" rx="2" fill="${d.couleur}"/>` + etiquette(X.d + larg + 8, d.y, d.h, d, 'start'); });
  svg += `<rect x="${X.m}" y="${mY}" width="${larg}" height="${mH}" rx="2" fill="#15261D"/>`;
  zone.innerHTML = `<svg class="sankey" viewBox="0 0 ${L} ${H + 22}" role="img" aria-label="Flux du mois : ${argent0(F.entrees)} d'entrées, ${argent0(F.sorties)} de sorties">${svg}</svg>`;
}

/* Situation d'un crédit aujourd'hui et projection au rythme actuel. */
/* Projection d'un crédit : celle de projeter(), sauf s'il reste un différé à
   venir, qu'il faut dérouler échéance par échéance. */
function projDette(d, etat = etatDette(d)) {
  const differeAVenir = d.premiere && d.differe?.mois > 0 && dateEcheance(d, d.differe.mois - 1) > refDette(d);
  if (!differeAVenir) return projeter(etat.capital, d.taux, d.mensualite);
  const fut = echeancesFutures(d, 720);
  if (!fut.length || fut[fut.length - 1].restant > 0.005) return { impossible: true };
  return { mois: fut.length, interets: fut.reduce((s, e) => s + e.interets, 0), serie: [etat.capital, ...fut.map(e => e.restant)] };
}

function echeancesPassees(dette) {
  const r = tauxMensuel(dette.taux);
  let capital = dette.capitalDepart;
  const sortie = [];
  evenementsDette(dette)
    .forEach(o => {
      if (o.recalage != null) { capital = o.recalage; return; }
      if (o.capitalise) {
        const i = capital * r; capital += i;
        const deja = sortie.find(x => x.date === o.date && x.differeTotal);
        if (deja) { deja.capitalise = arrondi(i); deja.restant = arrondi(capital); }
        else sortie.push({ date: o.date, anticipe: 0, capital: 0, interets: 0, capitalise: arrondi(i), assurance: 0, restant: arrondi(capital), differeTotal: true });
        return;
      }
      if (o.differeTotal) {
        const deja = sortie.find(x => x.date === o.date && x.differeTotal);
        if (deja) deja.assurance = o.assurance || 0;
        else sortie.push({ date: o.date, anticipe: 0, capital: 0, interets: 0, capitalise: 0, assurance: o.assurance || 0, restant: Math.max(0, arrondi(capital)), differeTotal: true, avantSuivi: o.avantSuivi });
        return;
      }
      const assurance = o.assurance || 0, paiement = -o.montant - assurance;
      if (o.anticipe) {
        const p = Math.min(paiement, capital); capital -= p;
        sortie.push({ date: o.date, anticipe: arrondi(p), capital: 0, interets: 0, capitalise: 0, assurance: 0, restant: Math.max(0, arrondi(capital)) });
        return;
      }
      const i = capital * r, p = Math.min(Math.max(paiement - i, 0), capital);
      capital -= p;
      sortie.push({ date: o.date, anticipe: 0, capital: arrondi(p), interets: arrondi(i), capitalise: 0, assurance: arrondi(assurance), restant: Math.max(0, arrondi(capital)), avantSuivi: o.avantSuivi });
    });
  return sortie;
}

function echeancesFutures(dette, nb) {
  const r = tauxMensuel(dette.taux), ass = assuranceDe(dette), sortie = [];
  let capital = etatDette(dette).capital, mois = premierMoisAVenir(dette);
  while (capital > 0.005 && sortie.length < nb) {
    const date = dateDansMois(mois, dette.jour), phase = phaseDiffere(dette, date), i = capital * r;
    if (phase === 'total') {
      capital += i;
      sortie.push({ date, anticipe: 0, capital: 0, interets: 0, capitalise: arrondi(i), assurance: ass, restant: arrondi(capital), prevue: true, differeTotal: true });
    } else if (phase === 'partiel') {
      sortie.push({ date, anticipe: 0, capital: 0, interets: arrondi(i), capitalise: 0, assurance: ass, restant: arrondi(capital), prevue: true, differePartiel: true });
    } else {
      let p = Math.min(Math.max(dette.mensualite - i, 0), capital);
      if (p <= 0.005) break;                                 // la mensualité ne couvre pas les intérêts
      if (dernierReste(capital - p, dette.mensualite)) p = capital;
      capital -= p;
      sortie.push({ date, anticipe: 0, capital: arrondi(p), interets: arrondi(i), capitalise: 0, assurance: ass, restant: Math.max(0, arrondi(capital)), prevue: true });
    }
    mois = decalerMois(mois, 1);
  }
  return sortie;
}

/* ════════════════════════════════════════════════════════════════════════
   IMPORT DE RELEVÉS BANCAIRES
   Le serveur lit les PDF et renvoie ce qu'il a compris ; rien n'est enregistré
   avant que l'utilisateur ait relu. On relit par tiers et non par ligne : trois
   cents opérations tiennent en une quinzaine de commerçants qui pèsent
   l'essentiel des euros.
   ════════════════════════════════════════════════════════════════════════ */
let IMP = null;           // proposition en cours de relecture
let retourImport = 'assistant';

/* Un compte de relevé est retenu s'il se recalcule au centime (PDF), ou s'il vient
   d'un tableur, qui n'a pas de soldes à contrôler (core/tableur.py). */
const releveAccepte = c => !!(c.equilibre || c.tableur);

function comptesImport() {
  const liste = [];
  (IMP?.fichiers || []).forEach(f => (f.comptes || []).forEach(c => liste.push({ ...c, banque: f.banque, fichier: f.nom })));
  return liste;
}

/* Opérations retenues, avec la catégorie décidée par l'utilisateur. */
function opsImport() {
  const parCompte = {};
  comptesImport().forEach(c => { parCompte[c.numero] = IMP.affectation[c.numero]; });
  // Deux relevés qui se chevauchent contiennent deux fois la même opération ; mais
  // deux cafés identiques le même jour, dans un seul relevé, sont deux opérations.
  // On garde donc, pour chaque opération, le nombre de fois qu'elle apparaît dans le
  // relevé qui en contient le plus — pas une seule, pas la somme des relevés.
  const garde = {}, exemple = {};
  comptesImport().forEach(c => {
    const dest = parCompte[c.numero];
    if (!releveAccepte(c) || !dest || dest === 'ignorer') return;
    const ici = {};
    c.operations.forEach(o => {
      const cle = `${dest}|${o.date}|${o.montant}|${o.libelle.slice(0, 40)}`;
      ici[cle] = (ici[cle] || 0) + 1;
      exemple[cle] = exemple[cle] || { ...o, compte: dest };
    });
    Object.entries(ici).forEach(([cle, n]) => { garde[cle] = Math.max(garde[cle] || 0, n); });
  });
  const ops = [];
  Object.entries(garde).forEach(([cle, n]) => {
    const o = exemple[cle];
    const t = IMP.p.operations.find(x => x.date === o.date && x.montant === o.montant && x.libelle === o.libelle);
    for (let k = 0; k < n; k++) ops.push({ ...o, tiers: t ? t.tiers : '' });
  });
  return ops.sort((a, b) => a.date.localeCompare(b.date));
}

function blocFichiers(comptes) {
  const lignes = [];
  IMP.fichiers.forEach(f => {
    if (f.erreur) { lignes.push(`<tr><td>${echap(f.nom)}</td><td colspan="4" class="perte">${echap(f.erreur)}</td></tr>`); return; }
    (f.comptes || []).forEach(c => lignes.push(`<tr>
      <td>${echap(f.nom.slice(0, 28))}<span class="sous">${echap(f.banque || 'banque non reconnue')}${c.libelle ? ' · ' + echap(c.libelle) : ''}</span></td>
      <td style="white-space:nowrap">${c.debut ? dateCourte(c.debut) : '?'} → ${c.fin ? dateCourte(c.fin) : '?'}</td>
      <td class="num">${c.nb_operations}</td>
      <td class="num discret">${c.tableur ? argent(c.mouvements, true) : `${argent(c.solde_ouverture)} ${argent(c.mouvements, true)}`}</td>
      <td class="num">${c.tableur
        ? '<span class="statut" title="Un export tableur ne donne pas de soldes : le solde demandé plus bas fait foi.">tableur, sans soldes</span>'
        : c.equilibre
          ? `<span class="statut ok">${argent(c.solde_cloture)}</span>`
          : `<span class="statut ko">écart ${argent(c.ecart)}</span>`}</td></tr>`));
    (f.anomalies || []).forEach(a => lignes.push(`<tr><td colspan="5" class="discret">${echap(f.nom.slice(0, 28))} : ${echap(a)}</td></tr>`));
  });
  const casses = comptes.filter(c => !releveAccepte(c)).length;
  return `<div class="panneau">
    <div class="tete-panneau"><div><h2>Relevés lus</h2>
      <p class="sous-titre">Pour chaque compte : solde d'ouverture, somme des mouvements, solde de clôture.
        S'ils ne se recalculent pas au centime, la lecture est fausse et le relevé est écarté.</p></div>
      <button class="mini-btn" id="imp-autres">Ajouter des relevés</button></div>
    <div class="defile"><table><thead><tr><th>Fichier</th><th>Période</th><th class="num">Opérations</th>
      <th class="num">Ouverture + mouvements</th><th class="num">= clôture</th></tr></thead>
      <tbody>${lignes.join('')}</tbody></table></div>
    ${casses ? `<p class="note danger" style="margin-top:12px">${casses} compte${casses > 1 ? 's' : ''} écarté${casses > 1 ? 's' : ''} :
      le total ne retombe pas sur le solde annoncé. Plutôt que d'importer des chiffres faux, envoyez-nous le fichier :
      c'est une mise en page que le lecteur ne connaît pas encore.</p>` : ''}</div>`;
}

function blocAffectation(comptes) {
  // Un même compte apparaît dans chaque relevé mensuel : on le regroupe par numéro,
  // sinon l'utilisateur voit six lignes pour deux comptes.
  const parNumero = {};
  comptes.filter(c => releveAccepte(c) && c.nb_operations).forEach(c => {
    const u = parNumero[c.numero] || (parNumero[c.numero] = {
      numero: c.numero, libelle: c.libelle, banque: c.banque, nb_operations: 0,
      debut: c.debut, fin: c.fin, solde_cloture: c.solde_cloture,
    });
    u.nb_operations += c.nb_operations;
    u.libelle = u.libelle || c.libelle;
    if (c.debut && (!u.debut || c.debut < u.debut)) u.debut = c.debut;
    if (c.fin && (!u.fin || c.fin > u.fin)) { u.fin = c.fin; u.solde_cloture = c.solde_cloture; }
  });
  const utiles = Object.values(parNumero);
  if (utiles.length < 2) return '';
  return `<div class="panneau">
    <h2>Quel compte est lequel ?</h2>
    <p class="sous-titre">Un même PDF contient souvent plusieurs comptes : compte courant, livret, prêt.</p>
    <div class="defile"><table><tbody>${utiles.map(c => `<tr>
      <td>${echap(c.libelle || c.numero)}<span class="sous">${echap(c.banque || '')}${c.banque ? ' · ' : ''}${c.nb_operations} opérations · ${c.debut ? dateCourte(c.debut) : ''} → ${c.fin ? dateCourte(c.fin) : ''}</span></td>
      <td class="num">${argent(c.solde_cloture)}</td>
      <td class="num"><select class="saisie" data-affect="${echap(c.numero)}" style="width:auto">
        ${[['courant', COMPTES.courant.nom], ['ignorer', 'Ne pas importer']]
          .map(([v, l]) => `<option value="${v}" ${IMP.affectation[c.numero] === v ? 'selected' : ''}>${l}</option>`).join('')}
      </select></td></tr>`).join('')}</tbody></table></div></div>`;
}

function blocTiers(p, inconnus, eurosInconnus, eurosTotal) {
  const tri = [...p.tiers].sort((a, b) => {
    const ia = IMP.cats[a.cle] === 'inconnu', ib = IMP.cats[b.cle] === 'inconnu';
    return ia !== ib ? (ia ? -1 : 1) : Math.abs(b.total) - Math.abs(a.total);
  });
  const partConnue = 100 - eurosInconnus / eurosTotal * 100;
  return `<div class="panneau">
    <div class="tete-panneau"><div><h2>Classer vos dépenses</h2>
      <p class="sous-titre">Une ligne par commerçant, la plus lourde d'abord. Classer un commerçant classe
        toutes ses opérations, passées et à venir.</p></div>
      <div style="text-align:right"><div class="discret">Euros reconnus</div>
        <div style="font-size:22px;font-weight:500" id="imp-part">${pct(partConnue, 0)}</div></div></div>
    <div class="progres" style="margin-bottom:14px"><i style="width:${Math.min(100, partConnue)}%"></i></div>
    <p class="note ${inconnus.length ? 'alerte' : ''}" style="margin-bottom:14px" id="imp-reste">
      ${inconnus.length
        ? `${inconnus.length} commerçants non reconnus, ${argent0(eurosInconnus)} au total. Les ${p.mesure.tiers_a_relire_pour_80pct} premiers en expliquent déjà 80 %.`
        : 'Tout est classé.'}</p>
    <div class="defile" style="max-height:460px;overflow-y:auto">
      <table><thead><tr><th>Commerçant ou tiers</th><th class="num">Opérations</th><th class="num">Total</th>
        <th style="width:230px">Catégorie</th></tr></thead>
      <tbody>${tri.map(t => {
        const cats = t.sens === 'ENTREE' ? CATS_ENTREE : CATS_SORTIE;
        const dou = IMP.cats[t.cle] === 'inconnu';
        return `<tr class="${dou ? 'a-classer' : ''}">
          <td>${echap(t.cle || '(sans libellé)')}<span class="sous">${echap(t.libelle.slice(0, 70))}</span></td>
          <td class="num">${t.occurrences}<span class="sous">${t.mois.length} mois</span></td>
          <td class="num ${t.total > 0 ? 'gain' : ''}">${argent(t.total, true)}</td>
          <td><select class="saisie" data-cat-tiers="${echap(t.cle)}">
            ${cats.map(c => `<option value="${c}" ${IMP.cats[t.cle] === c ? 'selected' : ''}>${CATEGORIES[c].nom}</option>`).join('')}
          </select></td></tr>`;
      }).join('')}</tbody></table></div></div>`;
}

/* « ECH PRET IMMO 1234 » → « Pret Immo » : un nom lisible pour le crédit à créer. */
function nomDeCredit(libelle) {
  const mots = normaliserTiers(libelle).split(' ')
    .filter(m => m.length > 2 && !/^(ECH|ECHEANCE|PRLV|PREL|VIR|REMB|MENS|CRED|CAP|CAPITAL|COTIS|MENSUALITE)$/.test(m) && !/^\d+$/.test(m));
  const nom = mots.slice(0, 3).join(' ').toLowerCase();
  return nom ? nom.charAt(0).toUpperCase() + nom.slice(1) : libelle.slice(0, 40);
}

/* ════════════════════════════════════════════════════════════════════════
   TIROIRS DE SAISIE
   ════════════════════════════════════════════════════════════════════════ */
function ouvrirTiroir(html) {

/* ════════════════════════════════════════════════════════════════════════
   TOUT VIENT DES RELEVÉS
   L'application lit, elle ne saisit pas. Chaque opération vient d'un relevé
   importé ; le solde du compte courant est celui que les relevés donnent, à la
   date du dernier d'entre eux. Seuls les emprunts se décrivent à la main —
   leurs paramètres ne figurent sur aucun relevé — et leurs échéances, elles,
   sont retrouvées dans les relevés.
   ════════════════════════════════════════════════════════════════════════ */
const FORMAT = 'releves-1';
const COMPTES = { courant: { nom: 'Compte courant', court: 'Courant', couleur: '#1E6A48' } };
const COULEURS = { courant: '#7FBF9C', invest: '#5F8FBF', dette: '#D9A397' };

/* Date à laquelle valent les chiffres du budget : la fin du dernier relevé. */
let DREF = AUJ;
const dernierReleve = () => (E?.releves || []).map(r => r.fin).filter(Boolean).sort().pop() || null;
function majDateRef() { DREF = (E && (dernierReleve() || E.operations.map(o => o.date).sort().pop())) || AUJ; }

/* État d'avant la refonte : conservé tel quel dans le nouvel état, jamais relu. */
let E_ANCIEN = null;

async function charger() {
  const r = await api('/banque/etat');
  E = r.etat; VERSION = r.version;
  if (E && E.format !== FORMAT) { E_ANCIEN = E; E = null; }
  majDateRef();
  await chargerInvestissement();
  if (E && lierVirementsTitres()) sauver();
}

/* ── Solde : ancré sur le dernier solde connu ────────────────────────────
   Un relevé PDF donne son solde de clôture ; un tableur n'en donne pas, et
   l'utilisateur indique alors celui de la fin du tableur. Le solde de départ
   se déduit de l'ancre la plus récente. */
function recalerSolde() {
  const a = [...(E.ancres || [])].sort((x, y) => x.date.localeCompare(y.date)).pop();
  if (!a) return;
  const somme = E.operations.filter(o => o.compte === 'courant' && o.date <= a.date).reduce((s, o) => s + o.montant, 0);
  E.comptes.courant.soldeInitial = arrondi(a.solde - somme);
}

/* ── Écarts entre relevés ─────────────────────────────────────────────────
   La clôture d'un relevé PDF doit être l'ouverture du suivant. Sinon, un
   relevé manque : l'écart devient une ligne visible, datée, ni revenu ni
   dépense. Son montant est la différence entre deux soldes lus sur des
   relevés — rien n'est inventé. Recalculé entièrement à chaque import. */
function regenererEcarts() {
  E.operations = E.operations.filter(o => !o.ecart);
  const pdf = (E.releves || []).filter(r => r.source === 'pdf' && r.ouverture != null && r.cloture != null && r.debut && r.fin)
    .sort((a, b) => a.debut.localeCompare(b.debut) || a.fin.localeCompare(b.fin));
  for (let k = 1; k < pdf.length; k++) {
    const prec = pdf[k - 1], r = pdf[k];
    if (r.debut < prec.fin) continue;                 // relevés qui se chevauchent : rien à comparer
    const entre = E.operations.filter(o => o.compte === 'courant' && o.date > prec.fin && o.date < r.debut)
      .reduce((s, o) => s + o.montant, 0);
    const ecart = arrondi(r.ouverture - (prec.cloture + entre));
    if (Math.abs(ecart) < 0.01) continue;
    E.operations.push({ id: 'ecart-' + r.debut, date: r.debut, compte: 'courant', montant: ecart, libelle: 'Relevé manquant', categorie: 'ecart',
      ecart: { du: decalerJours(prec.fin, 1), au: decalerJours(r.debut, -1), cloture: prec.cloture, ouverture: r.ouverture } });
  }
}

/* ── Virements vers le compte-titres ──────────────────────────────────────
   Une sortie du courant du même montant qu'un versement du compte-titres, à
   cinq jours près, est ce versement : elle devient un virement entre comptes,
   ni dépense ni revenu. Rien n'est écrit côté compte-titres. */
function lierVirementsTitres() {
  const mvts = INV?.mouvements || [];
  if (!E || !mvts.length) return 0;
  const pris = new Set(E.operations.filter(o => o.lienTitres).map(o => o.lienTitres));
  let n = 0;
  [...mvts].sort((a, b) => a.date.localeCompare(b.date)).forEach(m => {
    if (pris.has(m.operation_id)) return;
    const attendu = m.type === 'DEPOT' ? -m.montant_eur : m.montant_eur;
    const op = E.operations
      .filter(o => o.compte === 'courant' && !o.lienTitres && !o.detteId && !o.ecart
        && Math.abs(o.montant - attendu) < 0.005 && Math.abs(ecartJours(o.date, m.date)) <= 5)
      .sort((a, b) => Math.abs(ecartJours(a.date, m.date)) - Math.abs(ecartJours(b.date, m.date)))[0];
    if (!op) return;
    Object.assign(op, { lienTitres: m.operation_id, categorieAvant: op.categorie, categorie: 'virement' });
    pris.add(m.operation_id); n++;
  });
  return n;
}

/* ════════════════════════════════════════════════════════════════════════
   EMPRUNTS
   Un emprunt se décrit par son contrat ; ses échéances sont cherchées dans les
   relevés (montant à 5 %, date à 5 jours). Le capital restant dû ne baisse
   que des échéances retrouvées : celle qu'aucun relevé ne montre n'est pas
   supposée payée.
   ════════════════════════════════════════════════════════════════════════ */
function ajouterDette({ nom, type, capital, taux, mensualite, jour, echeance, assurance, premiere, differe, historique, depuisOrigine, capitalLe }) {
  const d = { id: uid(), nom, type, capitalDepart: capital, taux, mensualite, jour, echeance, assurance: assurance || null, premiere,
    ...(differe ? { differe } : {}), ...(historique?.length ? { historique } : {}), ...(depuisOrigine ? { depuisOrigine } : {}),
    ...(capitalLe ? { capitalLe } : {}) };
  E.dettes.push(d);
  return d;
}

/* Échéancier contractuel complet d'un emprunt. */
function tableauDette(d) {
  if (!d.premiere || !d.echeance) return [];
  return tableauContrat({ capital: d.capitalDepart, taux: d.taux, premiere: d.premiere, jour: d.jour,
    duree: ecartMois(d.premiere, d.echeance) + 1, mensualite: d.mensualite, differe: d.differe, ass: assuranceDe(d) }).lignes;
}
/* Échéances que les relevés devraient montrer : depuis le début des relevés (ou
   après la date du capital saisi), jusqu'au dernier relevé. */
const echeancesAttendues = d => tableauDette(d).filter(l => l.date >= E.creeLe && (!d.capitalLe || l.date > d.capitalLe)
  && l.date <= DREF && (l.credit + l.assurance) > 0.005);

function rapprocherEcheances(lignes) {
  const prises = new Set();
  return lignes.map(l => {
    const attendu = arrondi(l.credit + l.assurance);
    if (attendu <= 0.005) return { ligne: l, attendu, op: null };
    const op = E.operations
      .filter(o => o.compte === 'courant' && !o.detteId && o.montant < 0 && !o.lienTitres && !o.ecart && !prises.has(o.id)
        && Math.abs(-o.montant - attendu) <= attendu * 0.05 && Math.abs(ecartJours(o.date, l.date)) <= 5)
      .sort((a, b) => Math.abs(ecartJours(a.date, l.date)) - Math.abs(ecartJours(b.date, l.date)) || Math.abs(-a.montant - attendu) - Math.abs(-b.montant - attendu))[0] || null;
    if (op) prises.add(op.id);
    return { ligne: l, attendu, op };
  });
}

/* Rattache aux emprunts les échéances présentes dans les relevés. Rejouable :
   une échéance déjà rattachée n'est pas recherchée une seconde fois. */
function rapprocherDettes() {
  let n = 0;
  E.dettes.forEach(d => {
    const deja = new Set(E.operations.filter(o => o.detteId === d.id && !o.anticipe).map(o => o.echeance));
    const lignes = tableauDette(d).filter(l => l.date >= E.creeLe && (!d.capitalLe || l.date > d.capitalLe)
      && l.date <= decalerJours(DREF, 5) && !deja.has(l.date));
    rapprocherEcheances(lignes).forEach(({ ligne, op }) => {
      if (!op) return;
      Object.assign(op, { categorieAvant: op.categorie, categorie: 'credit', detteId: d.id, echeance: ligne.date,
        ...(ligne.assurance ? { assurance: ligne.assurance } : {}), ...(ligne.phase === 'total' ? { differeTotal: true } : {}) });
      n++;
    });
  });
  return n;
}

function suiviDette(d) {
  const att = echeancesAttendues(d);
  const vues = new Set(E.operations.filter(o => o.detteId === d.id && !o.anticipe).map(o => o.echeance));
  return { attendues: att.length, vues: att.filter(l => vues.has(l.date)).length };
}

/* Enregistre un emprunt saisi. Contrat : les échéances d'avant le premier relevé
   sont supposées payées (historique) ; les suivantes doivent se trouver dans les
   relevés. Capital restant : il vaut au jour de la saisie, seules les échéances
   d'après comptent. */
function creerCredit(b, c) {
  const nom = String(b.nom).trim(), lignes = c.tab.lignes;
  const historique = c.contrat ? lignes.filter(l => l.date < E.creeLe && (l.credit + l.assurance) > 0.005)
    .map(l => ({ date: l.date, credit: l.credit, assurance: l.assurance, ...(l.phase === 'total' ? { differeTotal: true } : {}) })) : [];
  const d = ajouterDette({ nom, type: b.type, capital: c.capital, depuisOrigine: c.contrat, taux: c.taux, mensualite: c.mensualite,
    jour: +b.jour, echeance: moisDe(lignes[lignes.length - 1].date), assurance: c.assurance, premiere: c.premiere, differe: c.differe,
    historique, capitalLe: c.contrat ? null : AUJ });
  const lies = rapprocherDettes();
  return { dette: d, historique: historique.length, lies };
}

/* Prélèvements que la lecture des libellés classe en remboursement d'emprunt,
   sans emprunt configuré pour les recevoir. */
function empruntsReperes() {
  if (!E) return [];
  const ignores = new Set(E.nonEmprunts || []), groupes = {};
  E.operations.filter(o => o.categorie === 'credit' && !o.detteId && o.montant < 0)
    .forEach(o => { const k = o.tiers || o.libelle; if (!ignores.has(k)) (groupes[k] = groupes[k] || []).push(o); });
  return Object.entries(groupes).map(([cle, ops]) => {
    ops.sort((a, b) => a.date.localeCompare(b.date));
    const der = ops[ops.length - 1];
    return { cle, libelle: der.libelle, montant: arrondi(-der.montant), jour: +der.date.slice(8), date: der.date, occurrences: ops.length };
  }).sort((a, b) => b.montant - a.montant);
}

/* « ECH PRET IMMO 1234 » → « Pret immo » : un nom lisible pour l'emprunt à créer. */
const nouveauCreditDepuis = l => ({ ...nouveauCredit(), mode: 'contrat', nom: nomDeCredit(l.libelle), jour: Math.min(28, l.jour),
  mensualite: String(l.montant).replace('.', ','), manuelle: true, cleRepere: l.cle });

function modaleEmprunts(liste) {
  if (!liste.length) return;
  const pl = liste.length > 1, parCle = Object.fromEntries(liste.map(l => [l.cle, l]));
  ouvrirModale(`
    <h2 id="modale-titre">${pl ? 'Des prélèvements ressemblent à des emprunts' : 'Un prélèvement ressemble à un emprunt'}</h2>
    <p>Configuré, un emprunt donne son capital restant dû et son échéancier. Ses paramètres ne figurent pas sur le relevé :
      il faut les reprendre de votre contrat. La lecture se fait sur le libellé ; elle peut se tromper.</p>
    ${liste.map(l => `
      <div class="repere" data-repere="${echap(l.cle)}">
        <div class="ligne"><strong>${echap(l.libelle)}</strong>
          <span class="quand">${argent(-l.montant)} · dernier le ${dateLongue(l.date)}${l.occurrences > 1 ? ` · ${l.occurrences} fois` : ''}</span></div>
        <div class="choix">
          <button class="btn" type="button" data-oui="${echap(l.cle)}">C'est un emprunt : le configurer</button>
          <span class="sinon"><span class="ou">sinon :</span>
            <select data-non="${echap(l.cle)}" aria-label="Reclasser ce prélèvement">
              <option value="">Reclasser en…</option>
              ${CATS_SORTIE.filter(c => c !== 'credit').map(c => `<option value="${c}">${CATEGORIES[c].nom}</option>`).join('')}
            </select></span>
        </div>
      </div>`).join('')}
    <div class="fin"><button class="btn btn-sec" type="button" data-fermer>Plus tard</button></div>`);
  $('#modale').querySelector('[data-fermer]').onclick = fermerModale;
  $('#modale').querySelectorAll('[data-oui]').forEach(b => b.onclick = () => {
    const l = parCle[b.dataset.oui]; fermerModale(); tiroirDette(null, nouveauCreditDepuis(l));
  });
  $('#modale').querySelectorAll('[data-non]').forEach(s => s.onchange = () => {
    const l = parCle[s.dataset.non]; if (!s.value || !l) return;
    pasUnEmprunt(l.cle, s.value);
    s.closest('.repere').innerHTML = `<div class="verdict">✓ ${echap(l.libelle)} : reclassé en « ${CATEGORIES[s.value].nom} ».</div>`;
  });
}

function pasUnEmprunt(cle, cat) {
  E.operations.forEach(o => { if ((o.tiers || o.libelle) === cle && !o.detteId) o.categorie = cat; });
  E.regles = E.regles || {}; E.regles[cle] = cat;
  (E.nonEmprunts = E.nonEmprunts || []).push(cle);
  sauver(); rafraichir();
}

function tiroirDette(id, brouillon) {
  const d = id ? E.dettes.find(x => x.id === id) : null;
  const b = brouillon || (d ? {
    mode: 'restant', edition: true, ...differeRestant(d),
    prochaine: d.premiere && dateEcheance(d, 0) > AUJ ? d.premiere : '',
    nom: d.nom, type: d.type, capital: String(etatDette(d).capital).replace('.', ','), taux: String(d.taux).replace('.', ','),
    echeance: d.echeance, jour: d.jour, mensualite: String(d.mensualite).replace('.', ','), manuelle: true,
    assMode: d.assurance?.mode || 'aucune', assValeur: d.assurance ? String(d.assurance.valeur).replace('.', ',') : '',
    assBase: d.assurance?.base ? String(d.assurance.base).replace('.', ',') : '',
  } : { ...nouveauCredit(), mode: 'contrat' });
  ouvrirTiroir(`${enteteTiroir(d ? 'Modifier l\'emprunt' : 'Ajouter un emprunt')}
    <div id="t-erreur" class="erreur cache"></div>
    <form id="d-form">
      ${champsDette(b)}
      <p class="discret" style="margin:12px 0 14px">${d
        ? 'Corriger le capital restant le recale à aujourd\'hui ; les échéances déjà retrouvées restent rattachées. Un capital de 0 marque l\'emprunt comme soldé.'
        : 'Les paramètres viennent de votre contrat ou de votre espace client. Les échéances, elles, sont cherchées dans vos relevés.'}</p>
      <div class="actions-tiroir"><button class="btn" type="submit">${d ? 'Enregistrer' : 'Ajouter l\'emprunt'}</button>${d ? '<button class="btn btn-danger" type="button" id="d-suppr">Supprimer</button>' : ''}</div>
    </form>`);
  brancherDette($('#d-form'), b, () => tiroirDette(id, b), !!d, E.creeLe);

    const nom = String(b.nom).trim(), c = calcDette(b, !!d);

    if (c.erreur) return erreurTiroir(c.erreur.charAt(0).toUpperCase() + c.erreur.slice(1));
    if (d) {
      if (Math.abs(etatDette(d).capital - c.capital) > 0.005) (d.recalages = d.recalages || []).push({ date: AUJ, capital: c.capital });
      Object.assign(d, { nom, type: b.type, taux: c.taux, mensualite: c.mensualite, jour: +b.jour, echeance: b.echeance || d.echeance, assurance: c.assurance });
      rapprocherDettes(); sauver(); fermerTiroir(); rafraichir(); return toast('Emprunt modifié');
    }
    const r = creerCredit(b, c);
    sauver(); fermerTiroir(); ongletActif = 'dettes'; rafraichir();
    const reste = empruntsReperes();
    toast(`Emprunt ajouté${r.lies ? ` · ${r.lies} échéance${r.lies > 1 ? 's' : ''} retrouvée${r.lies > 1 ? 's' : ''} dans vos relevés` : ''}`);

    E.dettes = E.dettes.filter(x => x.id !== d.id);

    sauver(); fermerTiroir(); rafraichir(); toast('Emprunt supprimé');
  };
}

/* Une sortie du relevé rattachée à un emprunt comme remboursement anticipé :

/* ════════════════════════════════════════════════════════════════════════
   FLUX ET MOIS
   ════════════════════════════════════════════════════════════════════════ */
function fluxMois(cle) {
  const ops = E.operations.filter(o => moisDe(o.date) === cle);
  const flux = ops.filter(estFlux);
  const entrees = flux.filter(o => o.montant > 0).reduce((s, o) => s + o.montant, 0);
  const sorties = -flux.filter(o => o.montant < 0).reduce((s, o) => s + o.montant, 0);
  const parCat = {}, credits = {}, debits = {};
  flux.forEach(o => {
    parCat[o.categorie] = (parCat[o.categorie] || 0) + Math.abs(o.montant);
    const cote = o.montant > 0 ? credits : debits;
    cote[o.categorie] = (cote[o.categorie] || 0) + Math.abs(o.montant);
  });
  return { ops, entrees, sorties, solde: entrees - sorties, parCat, credits, debits, versInvest: 0 };
}

/* Mois entièrement couverts par les relevés, du plus ancien au plus récent. */
function moisComplets() {
  if (!E || !E.operations.length) return [];
  const debut = E.creeLe.endsWith('-01') ? moisDe(E.creeLe) : decalerMois(moisDe(E.creeLe), 1);
  const [a, m] = moisDe(DREF).split('-').map(Number);
  const fin = +DREF.slice(8) === joursDansMois(a, m) ? moisDe(DREF) : decalerMois(moisDe(DREF), -1);
  const res = [];
  for (let c = debut; c <= fin; c = decalerMois(c, 1)) res.push(c);
  return res;
}
const moisCouverts = () => { const r = []; if (!E) return r; for (let c = moisDe(E.creeLe); c <= moisDe(DREF); c = decalerMois(c, 1)) r.push(c); return r; };
const moisPartiel = c => !moisComplets().includes(c);

function capaciteConstatee(n = 3) {
  const mois = moisComplets().slice(-n);
  if (!mois.length) return null;
  const f = mois.map(fluxMois), ent = f.reduce((s, x) => s + x.entrees, 0), sol = f.reduce((s, x) => s + x.solde, 0);
  return { moyenne: sol / mois.length, nb: mois.length, mois, taux: ent > 0 ? sol / ent * 100 : null, entrees: ent / mois.length };
}

/* Revenus nets moyens : le crédit des trois derniers mois complets, hors
   virements entre comptes et hors remboursements reçus, qui ne sont pas des revenus. */
function revenusNets(n = 3) {
  const mois = moisComplets().slice(-n);
  if (!mois.length) return null;
  const total = mois.reduce((s, c) => s + E.operations.filter(o => moisDe(o.date) === c && o.montant > 0 && estFlux(o) && o.categorie !== 'rembours')
    .reduce((t, o) => t + o.montant, 0), 0);
  return { moyenne: total / mois.length, mois };
}

async function envoyerReleves(fichiers) {
  if (!fichiers.length) return;
  const zone = $('#imp-corps');
  zone.innerHTML = `<div class="panneau"><div class="vide"><p>Lecture de ${fichiers.length} relevé${fichiers.length > 1 ? 's' : ''}…</p></div></div>`;
  const form = new FormData();
  [...fichiers].forEach(f => form.append('fichiers', f));
  form.append('regles', JSON.stringify((E && E.regles) || {}));
  try {
    const rep = await fetch(API + '/banque/releves', { method: 'POST', headers: { Authorization: 'Bearer ' + JETON }, body: form });
    if (rep.status === 401) return deconnecter();
    const data = await rep.json();
    if (!rep.ok) throw new Error(typeof data.detail === 'string' ? data.detail : 'Lecture impossible');
    if (!data.proposition) {
      zone.innerHTML = `<div class="panneau"><p class="note danger">Aucune opération exploitable.
        ${data.fichiers.map(f => `<br>${echap(f.nom)} : ${echap(f.erreur || (f.anomalies || []).join(', ') || 'relevé déséquilibré')}`).join('')}</p>
        <p class="discret" style="margin-top:12px">Une photo ou un scan ne contient pas de texte : téléchargez le relevé depuis l'espace client de votre banque.</p>
        <button class="btn btn-sec" id="imp-autres" style="margin-top:14px">Choisir d'autres fichiers</button></div>`;
      $('#imp-autres').onclick = () => { IMP = null; rendreImport(); };
      return;
    }
    IMP = { fichiers: data.fichiers, p: data.proposition, affectation: {}, cats: {}, solde: null };
    let principal = null, maxOps = -1;
    data.fichiers.forEach(f => (f.comptes || []).forEach(c => {
      if (!releveAccepte(c)) return;
      if (c.nb_operations > maxOps) { maxOps = c.nb_operations; principal = c.numero; }
      IMP.affectation[c.numero] = 'ignorer';
    }));
    if (principal !== null) IMP.affectation[principal] = 'courant';
    IMP.p.tiers.forEach(t => { IMP.cats[t.cle] = t.categorie; });
    rendreImport();
  } catch (e) {
    zone.innerHTML = `<div class="panneau"><p class="note danger">${echap(e.message)}</p></div>`;
  }
}

/* Relevés retenus pour le compte courant, au format de l'état. */
function relevesImport() {
  return comptesImport().filter(c => IMP.affectation[c.numero] === 'courant' && releveAccepte(c)).map(c => ({
    source: c.tableur ? 'tableur' : 'pdf', debut: c.debut, fin: c.fin, fichier: (c.fichier || '').slice(0, 80), banque: c.banque || '',
    ouverture: c.tableur ? null : c.solde_ouverture, cloture: c.tableur ? null : c.solde_cloture, nb: c.nb_operations,
  }));
}
/* Un tableur ne donne pas de solde. Il faut le demander quand il prolonge l'historique
   au-delà du dernier solde connu, et qu'aucun relevé PDF du même envoi ne le donne. */
function soldeDemande() {
  const rel = relevesImport();
  const finTab = rel.filter(r => r.source === 'tableur').map(r => r.fin).filter(Boolean).sort().pop();
  if (!finTab) return null;
  const finPdf = rel.filter(r => r.source === 'pdf').map(r => r.fin).filter(Boolean).sort().pop() || '';
  const derniere = (E?.ancres || []).map(a => a.date).sort().pop() || '';
  return finTab > finPdf && finTab > derniere ? finTab : null;
}

function blocSolde(ops) {

function brancherImport() {
  const z = $('#imp-corps');

  z.querySelectorAll('[data-cat-tiers]').forEach(s => s.onchange = () => { IMP.cats[s.dataset.catTiers] = s.value; rendreImport(); });

function appliquerImport() {
  const ops = opsImport(), erreur = m => { const z = $('#imp-erreur'); z.textContent = m; z.classList.remove('cache'); };
  if (!ops.length) return erreur('Aucune opération à importer.');
  const demande = soldeDemande();

  if (demande && IMP.solde == null) { $('#imp-solde')?.focus(); return erreur(`Indiquez le solde du compte courant au ${dateLongue(demande)}.`); }
  const releves = relevesImport();
  const ancres = releves.filter(r => r.source === 'pdf' && r.cloture != null).map(r => ({ date: r.fin, solde: r.cloture, source: 'releve' }));
  if (demande) ancres.push({ date: demande, solde: arrondi(IMP.solde), source: 'saisi' });
  const regles = {};
  Object.entries(IMP.cats).forEach(([cle, cat]) => { if (cle && cat && cat !== 'inconnu') regles[cle] = cat; });
  const r = integrer({
    ops: ops.map(o => ({ date: o.date, montant: arrondi(o.montant), libelle: o.libelle.slice(0, 120), categorie: IMP.cats[o.tiers] || 'inconnu', tiers: o.tiers })),
    releves, ancres, regles,
  });
  IMP = null;
  sauver();
  $('#import').classList.add('cache');
  demarrer();
  toast(`${r.ajoutees} opération${r.ajoutees > 1 ? 's' : ''} importée${r.ajoutees > 1 ? 's' : ''}${r.lies ? ` · ${r.lies} échéance${r.lies > 1 ? 's' : ''} d'emprunt retrouvée${r.lies > 1 ? 's' : ''}` : ''}`);
  const reperes = empruntsReperes();
  if (reperes.length) setTimeout(() => modaleEmprunts(reperes), 400);
}

/* Intègre des opérations et des relevés à l'état, qu'ils viennent d'un import ou
   du profil d'exemple : même chemin, mêmes règles. */
function integrer({ ops, releves, ancres, regles = {} }) {
  if (!E) E = { version: 2, format: FORMAT, creeLe: ops[0].date, utilisateur: UTILISATEUR, comptes: { courant: { soldeInitial: 0 } },
    operations: [], releves: [], ancres: [], dettes: [], regles: {}, nonEmprunts: [], ...(E_ANCIEN ? { archiveV1: E_ANCIEN } : {}) };
  Object.assign(E.regles, regles);
  E.creeLe = [E.creeLe, ...releves.map(r => r.debut), ...ops.map(o => o.date)].filter(Boolean).sort()[0];
  // Deux relevés qui se chevauchent contiennent deux fois la même opération : chaque
  // opération déjà connue en « consomme » une identique de l'envoi.
  const cle = o => `${o.date}|${arrondi(o.montant)}|${(o.libelle || '').slice(0, 40)}`;
  const connues = {};
  E.operations.filter(o => !o.ecart).forEach(o => { connues[cle(o)] = (connues[cle(o)] || 0) + 1; });
  let ajoutees = 0;
  ops.forEach(o => {
    const k = cle(o);
    if (connues[k] > 0) { connues[k]--; return; }
    E.operations.push({ id: uid(), compte: 'courant', importe: true, ...o });
    ajoutees++;
  });
  const cleR = r => `${r.source}|${r.debut}|${r.fin}|${r.ouverture}|${r.cloture}`, vus = new Set(E.releves.map(cleR));
  releves.forEach(r => { if (!vus.has(cleR(r))) { E.releves.push(r); vus.add(cleR(r)); } });
  ancres.forEach(a => { E.ancres = E.ancres.filter(x => x.date !== a.date); E.ancres.push(a); });
  regenererEcarts();
  recalerSolde();
  majDateRef();
  const lies = rapprocherDettes();
  lierVirementsTitres();
  return { ajoutees, lies };
}

/* ════════════════════════════════════════════════════════════════════════
   PROFIL D'EXEMPLE
   Six mois de relevés fictifs, passés par le même chemin qu'un vrai import.
   Un relevé du quatrième mois commence le 4 : les trois premiers jours
   manquent, et l'écart entre relevés apparaît. Construit par rapport à
   aujourd'hui : ses chiffres ne se comparent qu'à date fixe.
   ════════════════════════════════════════════════════════════════════════ */
function chargerExemple() {
  let graine = 20261123;
  const alea = () => { graine |= 0; graine = graine + 0x6D2B79F5 | 0; let t = Math.imul(graine ^ graine >>> 15, 1 | graine); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const entre = (a, b) => arrondi(a + alea() * (b - a));
  const premier = decalerMois(moisDe(AUJ), -6), mois = Array.from({ length: 6 }, (_, k) => decalerMois(premier, k));
  const ops = [], push = (date, montant, libelle, categorie, tiers) => ops.push({ date, montant: arrondi(montant), libelle, categorie, tiers: tiers || libelle });
  const fixes = [
    [27, 2850, 'VIR SALAIRE ATELIER NORD', 'salaire'], [5, -780, 'PRLV SCI LES TILLEULS LOYER', 'logement'],
    [5, -16.9, 'PRLV MAIF ASSURANCE HABITATION', 'logement'], [10, -68, 'PRLV EDF ELECTRICITE', 'factures'],
    [12, -44.98, 'PRLV FREE TELECOM', 'factures'], [18, -13.49, 'CB NETFLIX.COM', 'abonnements'],
    [20, -11.12, 'CB SPOTIFY', 'abonnements'], [3, -86.4, 'NAVIGO ANNUEL', 'transport'], [2, -34.9, 'PRLV BASIC FIT', 'loisirs'],
    [28, -150, 'VIR BOURSORAMA TITRES', 'virement'],
  ];
  const commerces = {
    courses: [['CB CARREFOUR MARKET', 22, 68], ['CB MONOPRIX', 12, 42], ['CB BIOCOOP', 15, 38], ['CB BOULANGERIE PAUL', 3, 9]],
    sorties: [['CB BRASSERIE DU PORT', 18, 46], ['CB CINEMA PATHE', 10, 22], ['CB UBER EATS', 16, 34]],
    shopping: [['CB FNAC', 20, 85], ['CB DECATHLON', 25, 70], ['CB UNIQLO', 30, 80]],
    loisirs: [['CB FNAC SPECTACLES', 35, 60], ['CB MUSEE DES BEAUX ARTS', 9, 16]],
    transport: [['CB SNCF', 18, 64], ['CB TOTAL ENERGIES', 38, 62]],
    sante: [['CB PHARMACIE CENTRALE', 6, 24]], divers: [['CB PRESSING', 8, 18]],
  };
  const frequence = { courses: [9, 12], sorties: [4, 7], shopping: [1, 2], loisirs: [1, 2], transport: [1, 2], sante: [0, 2], divers: [0, 1] };
  mois.forEach((cle, k) => {
    const [a, m] = cle.split('-').map(Number), nbJ = joursDansMois(a, m);
    fixes.forEach(([j, v, l, c]) => push(dateDansMois(cle, j), v, l, c));
    for (const [cat, [fmin, fmax]] of Object.entries(frequence)) {
      const n = Math.round(fmin + alea() * (fmax - fmin));
      for (let i = 0; i < n; i++) {
        const [l, mn, mx] = commerces[cat][Math.floor(alea() * commerces[cat].length)];
        push(dateDansMois(cle, 1 + Math.floor(alea() * nbJ)), -entre(mn, mx), l, cat);
      }
    }
    if (alea() > 0.4) push(dateDansMois(cle, 12 + Math.floor(alea() * 10)), entre(8, 26), 'VIR CPAM REMBOURSEMENT', 'rembours');
    if (k === 2) push(dateDansMois(cle, 14), 420, 'VIR MISSION TRADUCTION', 'complement');
  });
  // Trois emprunts, décrits par leur contrat ; leurs échéances sont dans les relevés.
  const contrats = [
    { nom: 'Prêt étudiant', type: 'etudiant', libelle: 'ECH PRET ETUDIANT', capital: 9800, taux: 0.9, mensualite: 215, jour: 8, ilya: 14, assurance: { mode: 'euros', valeur: 4.5 } },
    { nom: 'Crédit auto', type: 'auto', libelle: 'ECH PRET AUTO 0471', capital: 9000, taux: 4.9, mensualite: 229, jour: 10, ilya: 9, assurance: { mode: 'pct', valeur: 0.36, base: 12000 } },
    { nom: 'Crédit renouvelable', type: 'renouvelable', libelle: 'PRLV COFIDIS 88412', capital: 1350, taux: 19.5, mensualite: 60, jour: 15, ilya: 11, assurance: null },
  ].map(c => {
    const premiere = decalerMois(premier, -c.ilya);
    const lignes = tableauContrat({ capital: c.capital, taux: c.taux, premiere, jour: c.jour, mensualite: c.mensualite, ass: arrondi(assuranceMensuelle(c.assurance)) }).lignes;
    lignes.filter(l => moisDe(l.date) >= premier && moisDe(l.date) <= mois[5]).forEach(l => push(l.date, -(l.credit + l.assurance), c.libelle, 'credit'));
    return { ...c, premiere, lignes };
  });
  ops.sort((a, b) => a.date.localeCompare(b.date));
  // Relevés mensuels : ouverture, mouvements, clôture. Le quatrième commence le 4.
  const releves = [];
  let solde = 12000;
  mois.forEach((cle, k) => {
    const [a, m] = cle.split('-').map(Number), fin = dateDansMois(cle, joursDansMois(a, m));
    const duMois = ops.filter(o => moisDe(o.date) === cle);
    const debut = k === 3 ? dateDansMois(cle, 4) : cle + '-01';
    const avant = duMois.filter(o => o.date < debut).reduce((s, o) => s + o.montant, 0);
    const ouverture = arrondi(solde + avant), cloture = arrondi(solde + duMois.reduce((s, o) => s + o.montant, 0));
    releves.push({ source: 'pdf', debut, fin, ouverture, cloture, fichier: `releve-${cle}.pdf`, banque: 'Exemple', nb: duMois.length });
    solde = cloture;
  });
  const manquants = new Set(ops.filter(o => moisDe(o.date) === mois[3] && o.date < releves[3].debut));
  E = null;
  integrer({
    ops: ops.filter(o => !manquants.has(o)),
    releves, ancres: releves.map(r => ({ date: r.fin, solde: r.cloture, source: 'releve' })),
  });
  E.exemple = true;
  contrats.forEach(c => {
    const historique = c.lignes.filter(l => l.date < E.creeLe).map(l => ({ date: l.date, credit: l.credit, assurance: l.assurance }));
    ajouterDette({ nom: c.nom, type: c.type, capital: c.capital, taux: c.taux, mensualite: c.mensualite, jour: c.jour,
      echeance: moisDe(c.lignes[c.lignes.length - 1].date), assurance: c.assurance, premiere: c.premiere, historique, depuisOrigine: true });
  });
  rapprocherDettes();
  sauver();
  $('#import').classList.add('cache');
  demarrer();
  toast('Exemple chargé : six mois de relevés fictifs');
}

      scales: { x: { grid: { display: false }, ticks: { maxTicksLimit: innerWidth < 600 ? 4 : 8, maxRotation: 0, autoSkipPadding: 14 } }, y: axeEuros() } },
  });
  // Crédit, débit et solde de chaque mois
  const fl = retenus.map(fluxMois), pale = (coul, i) => moisPartiel(retenus[i]) ? coul + '66' : coul;
  const encre = couleurTheme('--encre'), perte = couleurTheme('--perte');
  graphique('c-historique', {
    type: 'bar',
    data: { labels: retenus.map(libMoisCourt), datasets: [
      { label: 'Crédit', data: fl.map(x => arrondi(x.entrees)), backgroundColor: retenus.map((_, i) => pale(COULEURS.courant, i)), borderRadius: 3 },
      { label: 'Débit', data: fl.map(x => arrondi(x.sorties)), backgroundColor: retenus.map((_, i) => pale('#CDBFA8', i)), borderRadius: 3 },
      { label: 'Solde du mois', data: fl.map(x => arrondi(x.solde)), backgroundColor: fl.map((x, i) => pale(x.solde < 0 ? perte : encre, i)), borderRadius: 3 },
    ] },
    options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } }, tooltip: { callbacks: { label: c => `${c.dataset.label} : ${argent(c.parsed.y)}` } } },
      scales: { x: { grid: { display: false } }, y: axeEuros() } },
  });
}

/* ═════════════ Budget ═════════════ */
function vueBudget() {
  const vue = $('[data-vue="budget"]');
  const sous = `<nav class="sous-onglets" aria-label="Vue du budget">
    <button type="button" data-bvue="mensuel" aria-pressed="${budgetVue === 'mensuel'}">Budget mensuel</button>
    <button type="button" data-bvue="historique" aria-pressed="${budgetVue === 'historique'}">Budget historique</button></nav>`;
  if (budgetVue === 'mensuel') vueBudgetMensuel(vue, sous); else vueBudgetHistorique(vue, sous);
  vue.querySelectorAll('[data-bvue]').forEach(b => b.onclick = () => { budgetVue = b.dataset.bvue; vueBudget(); });
}

function vueBudgetMensuel(vue, sous) {
  const couverts = moisCouverts();
  if (!couverts.includes(moisBudget)) moisBudget = couverts[couverts.length - 1];
  const F = fluxMois(moisBudget), partiel = moisPartiel(moisBudget);
  const taux = F.entrees > 0 && F.entrees >= F.sorties * 0.25 ? F.solde / F.entrees * 100 : null;
  const precedents = moisComplets().filter(c => c < moisBudget).slice(-3);
  const moy = c => precedents.length ? precedents.reduce((s, m) => s + (fluxMois(m).debits[c] || 0), 0) / precedents.length : null;
  const cats = CATS_SORTIE.filter(c => (F.debits[c] || 0) > 0 || (moy(c) || 0) > 0)
    .map(c => ({ c, reel: F.debits[c] || 0, moy: moy(c) })).sort((a, b) => b.reel - a.reel || (b.moy || 0) - (a.moy || 0));
  const maxV = Math.max(1, ...cats.map(l => Math.max(l.reel, l.moy || 0))) * 1.05;
  const entreesCat = CATS_ENTREE.filter(c => F.credits[c] > 0).map(c => ({ c, v: F.credits[c] })).sort((a, b) => b.v - a.v);
  const emprunts = F.debits.credit || 0;

  vue.innerHTML = `
    <div class="barre-budget">${sous}
      <div class="nav-mois">
        <button type="button" id="m-prec" ${moisBudget <= couverts[0] ? 'disabled' : ''} aria-label="Mois précédent">‹</button>
        <strong>${libelleMois(moisBudget)}</strong>
        <button type="button" id="m-suiv" ${moisBudget >= couverts[couverts.length - 1] ? 'disabled' : ''} aria-label="Mois suivant">›</button>
      </div></div>
    ${partiel ? `<p class="note" style="margin:0 0 20px">Les relevés ne couvrent pas ce mois en entier${moisBudget === moisDe(DREF) ? ` : ils s'arrêtent au ${dateLongue(DREF)}` : ''}.</p>` : ''}
    <div class="kpis-cartes">
      <div class="kpi"><div class="lib">Crédit</div>${gros(argent(F.entrees), 'gain')}<div class="discret">virements entre vos comptes exclus</div></div>
      <div class="kpi"><div class="lib">Débit</div>${gros(argent(F.sorties))}<div class="discret">${emprunts ? `dont ${argent(emprunts)} d'emprunts` : 'virements entre vos comptes exclus'}</div></div>
      <div class="kpi"><div class="lib">${formule('Solde du mois', `Crédit − débit\n${argent0(F.entrees)} − ${argent0(F.sorties)} = ${argent0(F.solde, true)}`)}</div>${gros(argent(F.solde, true), classe(F.solde))}<div class="discret">crédit − débit</div></div>
      <div class="kpi"><div class="lib">${formule("Taux d'épargne", taux == null ? 'Non calculé : le crédit du mois est trop faible devant le débit pour que le rapport ait un sens.' : `(Crédit − débit) ÷ crédit\n${argent0(F.solde, true)} ÷ ${argent0(F.entrees)} = ${pct(taux, 0)}`, true)}</div>${gros(taux == null ? '—' : pct(taux, 0))}<div class="discret">part du crédit non dépensée</div></div>
    </div>

    <section class="carte">
      <h2>D'où vient l'argent, où il va</h2>
      <p class="sous-titre">Le crédit du mois à gauche, sa destination à droite ; à côté, le poids de chaque poste.</p>
      <div class="grille-flux">
        <div id="sankey"></div>
        <div class="bloc-part"><h3>Répartition des débits</h3><p class="sous-titre">${argent0(F.sorties)} dépensés</p>
          <div class="donut"><canvas id="c-part-debits"></canvas></div><div class="legende-part" id="leg-debits"></div></div>
        <div class="bloc-part"><h3>Répartition des crédits</h3><p class="sous-titre">${argent0(F.entrees)} reçus</p>
          <div class="donut"><canvas id="c-part-credits"></canvas></div><div class="legende-part" id="leg-credits"></div></div>
      </div>
    </section>

    <section class="carte">
      <h2>Débits par catégorie</h2>
      <p class="sous-titre">${precedents.length ? `Chaque catégorie face à sa moyenne des ${precedents.length} mois complets précédents (le trait noir).` : 'Pas encore de mois complet avant celui-ci : pas de moyenne à comparer.'} Cliquez une ligne pour voir ses opérations.</p>
      <div class="defile">${cats.length ? `<table><thead><tr><th>Catégorie</th><th style="width:32%">${precedents.length ? 'Ce mois face à la moyenne' : 'Ce mois'}</th><th class="num">${libelleMois(moisBudget).split(' ')[0]}</th><th class="num">Moyenne</th><th class="num">Écart</th></tr></thead><tbody>
        ${cats.map(l => {
          const ecart = l.moy == null ? null : l.reel - l.moy;
          return `<tr class="cliquable" data-cat="${l.c}"><td><i class="pastille" style="background:${CATEGORIES[l.c].couleur}"></i>${CATEGORIES[l.c].nom}</td>
            <td><div class="piste"><i style="width:${l.reel / maxV * 100}%;background:${CATEGORIES[l.c].couleur}"></i>${l.moy != null ? `<b style="left:${l.moy / maxV * 100}%"></b>` : ''}</div></td>
            <td class="num">${argent(l.reel)}</td><td class="num discret">${l.moy == null ? '—' : argent(l.moy)}</td>
            <td class="num ${ecart != null && ecart > 20 ? 'alerte-txt' : 'discret'}">${ecart == null ? '' : Math.abs(ecart) < 0.5 ? '=' : argent0(ecart, true)}</td></tr>`;
        }).join('')}</tbody></table>` : '<div class="vide"><p>Aucun débit ce mois-ci.</p></div>'}</div>
    </section>`;

  $('#m-prec').onclick = () => { moisBudget = couverts[couverts.indexOf(moisBudget) - 1] || moisBudget; vueBudget(); };
  $('#m-suiv').onclick = () => { moisBudget = couverts[couverts.indexOf(moisBudget) + 1] || moisBudget; vueBudget(); };
  vue.querySelectorAll('[data-cat]').forEach(tr => tr.onclick = () => {
    filtre = { mois: moisBudget, sens: 'tous', texte: '', categorie: tr.dataset.cat }; ouvrirOnglet('comptes');
  });
  dessinerSankey(F, entreesCat);
  camembert('c-part-debits', 'leg-debits', CATS_SORTIE.filter(c => F.debits[c] > 0).map(c => ({ cle: c, v: F.debits[c] })), 'Aucun débit ce mois-ci.');
  camembert('c-part-credits', 'leg-credits', entreesCat.map(l => ({ cle: l.c, v: l.v })), 'Aucun crédit ce mois-ci.');
}

/* Budget historique : deux réglages commandent toute la page — la période (et
   donc les moyennes), et ce qu'on regarde : tout, le crédit ou le débit. */
function vueBudgetHistorique(vue, sous) {
  const complets = plageMois(moisComplets(), histo.periode), n = complets.length, sens = histo.sens;
  const reglages = `<div class="barre-budget">${sous}</div>
    <div class="reglages carte">
      <div><span class="lib">Période</span>${segPeriode(histo.periode, 'data-hp')}</div>
      <div><span class="lib">Afficher</span><div class="seg" role="group" aria-label="Afficher">${[['tout', 'Tout'], ['credit', 'Crédit'], ['debit', 'Débit']].map(([v, t]) =>
        `<button type="button" data-hs="${v}" aria-pressed="${sens === v}">${t}</button>`).join('')}</div></div>
      <span class="discret plage">${n ? `${n > 1 ? `De ${libelleMois(complets[0])} à ${libelleMois(complets[n - 1])}` : libelleMois(complets[0])} · ${n} mois complet${n > 1 ? 's' : ''}${histo.periode === 0 || histo.periode > moisComplets().length ? ' (tout l\'historique importé)' : ''}` : ''}</span>
    </div>`;
  if (!n) {
    vue.innerHTML = `${reglages}<section class="carte"><div class="vide"><p>Le budget historique demande au moins un mois complet de relevés.</p></div></section>`;
    brancherHisto(vue); return;
  }
  const fl = complets.map(fluxMois);
  const C = fl.reduce((s, x) => s + x.entrees, 0), D = fl.reduce((s, x) => s + x.sorties, 0), S = C - D;
  const tauxE = C > 0 && C >= D * 0.25 ? S / C * 100 : null;
  const cote = sens === 'credit' ? 'credits' : 'debits';
  const cumul = {};
  if (sens !== 'tout') fl.forEach(x => Object.entries(x[cote]).forEach(([c, v]) => cumul[c] = (cumul[c] || 0) + v));
  const cats = Object.keys(cumul).sort((a, b) => cumul[b] - cumul[a]);
  const total = cats.reduce((s, c) => s + cumul[c], 0);
  const nomCat = c => CATEGORIES[c]?.nom || c, couleur = c => CATEGORIES[c]?.couleur || '#A8B2AB';
  const motPluriel = sens === 'credit' ? 'crédits' : 'débits', Mot = sens === 'credit' ? 'Crédits' : 'Débits';

  vue.innerHTML = `${reglages}
    <section class="carte">
      <h2>Moyennes mensuelles</h2>
      <p class="sous-titre">Sur les ${n} mois complets de la période.</p>
      <div class="kpis-ligne">
        <div><div class="lib">${formule('Crédit', `${argent0(C)} ÷ ${n} mois = ${argent0(C / n)}`)}</div>${gros(argent0(C / n), 'gain')}<div class="discret">par mois</div></div>
        <div><div class="lib">${formule('Débit', `${argent0(D)} ÷ ${n} mois = ${argent0(D / n)}`)}</div>${gros(argent0(D / n))}<div class="discret">par mois</div></div>
        <div><div class="lib">${formule('Solde', `${argent0(S, true)} ÷ ${n} mois = ${argent0(S / n, true)}`)}</div>${gros(argent0(S / n, true), classe(S))}<div class="discret">par mois</div></div>
        <div><div class="lib">${formule("Taux d'épargne", tauxE == null ? 'Non calculé : le crédit de la période est trop faible devant le débit.' : `Total épargné ÷ total du crédit, sur toute la période\n${argent0(S, true)} ÷ ${argent0(C)} = ${pct(tauxE, 0)}`, true)}</div>${gros(tauxE == null ? '—' : pct(tauxE, 0))}<div class="discret">total épargné ÷ total du crédit</div></div>
      </div>
    </section>

    <section class="carte">
      <h2>${sens === 'tout' ? 'Solde mois par mois' : `${Mot} mois par mois`}</h2>
      <p class="sous-titre">${sens === 'tout' ? 'Crédit, débit et leur différence, chaque mois.' : 'Le total en trait épais, les principales catégories en traits fins. Cliquez un nom de la légende pour masquer sa courbe.'}</p>
      <div class="courbe" style="height:290px"><canvas id="c-h-courbe"></canvas></div>
    </section>

    ${sens === 'tout' ? '' : `
    <div class="grille-histo">
      <section class="carte large">
        <h2>Composition de chaque mois</h2>
        <p class="sous-titre">Les ${motPluriel} de chaque mois, empilés par catégorie${cats.length > 7 ? ' (les sept premières, le reste regroupé)' : ''}.</p>
        <div class="courbe" style="height:280px"><canvas id="c-h-barres"></canvas></div>
      </section>
      <section class="carte">
        <h2>Répartition sur la période</h2>
        <p class="sous-titre">${argent0(total)} au total</p>
        <div class="donut"><canvas id="c-h-part"></canvas></div>
        <div class="legende-part" id="leg-h-part"></div>
      </section>
    </div>
    <section class="carte">
      <h2>Moyenne mensuelle par catégorie</h2>
      <p class="sous-titre">Sur les mois complets de la période.</p>
      <div class="courbe" style="height:${Math.max(160, cats.length * 32 + 30)}px"><canvas id="c-h-moyennes"></canvas></div>
    </section>`}`;
  brancherHisto(vue);

  const labels = complets.map(libMoisCourt), infobulle = { callbacks: { label: c => `${c.dataset.label} : ${argent(c.parsed.y)}` } };
  const ligne = (nom, data, coul, epais) => ({ type: 'line', label: nom, data: data.map(arrondi), borderColor: coul, backgroundColor: coul,
    borderWidth: epais ? 3 : 1.6, pointRadius: epais ? 3 : 2, tension: .25 });
  const jeux = sens === 'tout'
    ? [ligne('Crédit', fl.map(x => x.entrees), '#4F9A74', false), ligne('Débit', fl.map(x => x.sorties), '#B59B74', false), ligne('Solde', fl.map(x => x.solde), couleurTheme('--encre'), true)]
    : [ligne(`Total des ${motPluriel}`, fl.map(x => Object.values(x[cote]).reduce((s, v) => s + v, 0)), couleurTheme('--encre'), true),
       ...cats.slice(0, 6).map(c => ligne(nomCat(c), fl.map(x => x[cote][c] || 0), couleur(c), false))];
  graphique('c-h-courbe', { data: { labels, datasets: jeux },
    options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } }, tooltip: infobulle },
      scales: { x: { grid: { display: false } }, y: { ...axeEuros(), beginAtZero: sens !== 'tout' } } } });
  if (sens === 'tout') return;

  const tete = cats.slice(0, 7), reste = cats.slice(7);
  const barres = tete.map(c => ({ type: 'bar', label: nomCat(c), stack: 'h', borderRadius: 2, backgroundColor: couleur(c), data: fl.map(x => arrondi(x[cote][c] || 0)) }));
  if (reste.length) barres.push({ type: 'bar', label: `Autres (${reste.length})`, stack: 'h', borderRadius: 2, backgroundColor: '#C3CCC5',
    data: fl.map(x => arrondi(reste.reduce((s, c) => s + (x[cote][c] || 0), 0))) });
  graphique('c-h-barres', { data: { labels, datasets: barres },
    options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } }, tooltip: infobulle },
      scales: { x: { stacked: true, grid: { display: false } }, y: { ...axeEuros(), stacked: true } } } });
  camembert('c-h-part', 'leg-h-part', cats.map(c => ({ cle: c, v: cumul[c] })), `Aucun ${sens === 'credit' ? 'crédit' : 'débit'} sur la période.`);
  graphique('c-h-moyennes', { data: { labels: cats.map(nomCat), datasets: [{ type: 'bar', label: 'Moyenne mensuelle', data: cats.map(c => arrondi(cumul[c] / n)), backgroundColor: cats.map(couleur), borderRadius: 3 }] },
    options: { indexAxis: 'y', maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `${argent(c.parsed.x)} par mois` } } },
      scales: { x: { ...axeEuros(), beginAtZero: true }, y: { grid: { display: false } } } } });
}
function brancherHisto(vue) {
  vue.querySelectorAll('[data-hp]').forEach(b => b.onclick = () => { histo.periode = +b.dataset.hp; vueBudget(); });
  vue.querySelectorAll('[data-hs]').forEach(b => b.onclick = () => { histo.sens = b.dataset.hs; vueBudget(); });
}

/* ═════════════ Dettes ═════════════ */
function ligneDette(d) {
  const etat = etatDette(d), ass = assuranceDe(d), proj = projDette(d, etat);
  const premier = premierMoisAVenir(d);
  const fin = proj.impossible || etat.capital <= 0.005 ? null : decalerMois(premier, proj.mois - 1);
  return { d, etat, ass, proj, fin, total: arrondi(d.mensualite + ass), suivi: suiviDette(d),
    part: d.capitalDepart ? Math.max(0, 1 - etat.capital / d.capitalDepart) : 1 };
}

function vueDettes() {
  const vue = $('[data-vue="dettes"]');
  const reperes = empruntsReperes();
  const bandeau = reperes.length ? `<div class="bandeau-emprunt">
      <div><strong>${reperes.length > 1 ? `${reperes.length} prélèvements ressemblent à des emprunts` : 'Un prélèvement ressemble à un emprunt'}</strong>
        <div class="discret">${reperes.slice(0, 2).map(l => `${echap(l.libelle)} · ${argent(l.montant)} le ${dateCourte(l.date)}`).join(' ; ')}. Configurez-le pour suivre son capital restant dû ; sinon, il reste une dépense.</div></div>
      <button type="button" class="btn" id="b-configurer">${reperes.length > 1 ? 'Les examiner' : 'Le configurer'}</button>
      ${reperes.length === 1 ? '<button type="button" class="mini-btn" id="b-pas-emprunt">Ce n\'en est pas un</button>' : ''}
    </div>` : '';
  if (!E.dettes.length) {
    vue.innerHTML = `${bandeau}<section class="carte"><div class="vide"><p>Aucun emprunt enregistré. Ajoutez-en un pour suivre son capital restant dû et son échéancier : ses échéances seront retrouvées dans vos relevés.</p><button class="btn" id="btn-dette">Ajouter un emprunt</button></div></section>`;
    $('#btn-dette').onclick = () => tiroirDette();
    brancherBandeau(reperes); return;
  }
  const lignes = E.dettes.map(ligneDette), enCours = lignes.filter(l => l.etat.capital > 0.005);
  const totalCapital = enCours.reduce((s, l) => s + l.etat.capital, 0);
  const totalMens = enCours.reduce((s, l) => s + l.total, 0), totalAss = enCours.reduce((s, l) => s + l.ass, 0);
  const tauxMoyen = totalCapital ? enCours.reduce((s, l) => s + l.etat.capital * l.d.taux, 0) / totalCapital : 0;
  const derniere = enCours.map(l => l.fin).filter(Boolean).sort().pop();
  const rev = revenusNets(), endettement = rev && rev.moyenne > 0 ? totalMens / rev.moyenne * 100 : null;
  const ordre = [...lignes].sort((a, b) => b.d.taux - a.d.taux);
  if (!lignes.some(l => l.d.id === detteVue)) detteVue = (ordre.find(l => l.etat.capital > 0.005) || ordre[0])?.d.id || null;
  const periodeRev = rev ? (rev.mois.length > 1 ? `de ${libelleMois(rev.mois[0]).split(' ')[0]} à ${libelleMois(rev.mois[rev.mois.length - 1])}` : libelleMois(rev.mois[0])) : '';

  vue.innerHTML = `${bandeau}
    <div class="kpis-cartes">
      <div class="kpi"><div class="lib">${formule('Capital restant dû', 'Capital de départ, diminué à chaque échéance retrouvée dans vos relevés de la part qui amortit : échéance − intérêts du mois − assurance.')}</div>${gros(argent(totalCapital))}<div class="discret">au ${dateLongue(DREF)}, ${enCours.length} emprunt${enCours.length > 1 ? 's' : ''} en cours</div></div>
      <div class="kpi"><div class="lib">Prélevé chaque mois</div>${gros(argent(totalMens))}<div class="discret">${totalAss ? `dont ${argent(totalAss)} d'assurance` : 'sans assurance'}</div></div>
      <div class="kpi"><div class="lib">Taux nominal moyen</div>${gros(pct(tauxMoyen, 2))}<div class="discret">pondéré par le capital restant</div></div>
      <div class="kpi"><div class="lib">Fin du dernier emprunt</div>${gros(derniere ? libelleMois(derniere) : '—', 'capitale')}<div class="discret">${derniere ? `dans ${dureeTexte(ecartMois(moisDe(DREF), derniere))}` : ''}</div></div>
    </div>

    <div class="grille-dettes">
      <section class="carte">
        <h2>${formule("Taux d'endettement", rev ? `Mensualités (assurance comprise) ÷ revenus nets moyens
${argent0(totalMens)} ÷ ${argent0(rev.moyenne)} = ${endettement == null ? '—' : pct(endettement)}
Revenus nets : crédit des derniers mois complets, hors virements entre comptes et remboursements reçus.
Les banques françaises retiennent ${SEUIL_ENDETTEMENT} % comme limite usuelle.` : 'Disponible après un premier mois complet de relevés.')}</h2>
        <p class="sous-titre">Mensualités, assurance comprise, rapportées à vos revenus nets moyens des trois derniers mois complets.</p>
        ${gros(endettement == null ? '—' : pct(endettement), endettement > SEUIL_ENDETTEMENT ? 'perte' : '')}
        <div class="jauge-endet" role="img" aria-label="Taux d'endettement face au seuil de ${SEUIL_ENDETTEMENT} %"><i class="${endettement > SEUIL_ENDETTEMENT ? 'depasse' : ''}" style="width:${Math.min(100, (endettement || 0) / 50 * 100)}%"></i><b style="left:${SEUIL_ENDETTEMENT / 50 * 100}%"></b></div>
        <div class="graduation"><span>0 %</span><span style="position:absolute;left:${SEUIL_ENDETTEMENT / 50 * 100}%;transform:translateX(-50%)">seuil ${SEUIL_ENDETTEMENT} %</span><span>50 %</span></div>
        ${rev ? `<dl class="lignes-carte">
          <dt>Mensualités</dt><dd>${argent(totalMens)}</dd>
          <dt>Revenus nets moyens, ${periodeRev}</dt><dd>${argent0(rev.moyenne)}</dd>
          <dt>Marge avant le seuil</dt><dd>${argent0(rev.moyenne * SEUIL_ENDETTEMENT / 100 - totalMens, true)} par mois</dd>
        </dl>` : ''}
      </section>
      <section class="carte">
        <h2>Capital restant dû dans le temps</h2>
        <p class="sous-titre">Projection selon l'échéancier de chaque emprunt.</p>
        <div class="courbe" style="height:240px"><canvas id="c-dettes"></canvas></div>
      </section>
    </div>

    <section class="carte">
      <div class="tete-panneau"><div><h2>Vos emprunts</h2>
        <p class="sous-titre">Chaque échéance retrouvée dans vos relevés fait baisser le capital restant dû. Cliquez une ligne pour son échéancier.</p></div>
        <button class="btn btn-sec" id="btn-dette">Ajouter un emprunt</button></div>
      <div class="defile"><table>
        <thead><tr><th>Emprunt</th><th style="width:15%">Remboursé</th><th class="num">Capital restant</th><th class="num">Taux</th><th class="num">Mensualité</th><th class="num">Fin</th><th>Dans vos relevés</th><th></th></tr></thead>
        <tbody>${ordre.map(({ d, etat, ass, proj, fin, total, part, suivi }) => `<tr class="cliquable ${d.id === detteVue ? 'choisi' : ''}" data-echeancier="${d.id}">
          <td><strong class="moyen">${echap(d.nom)}</strong><span class="sous">${TYPES_DETTE[d.type] || ''} · prélevé le ${d.jour}</span></td>
          <td><div class="progres"><i style="width:${Math.min(100, part * 100)}%"></i></div><span class="sous">${pct(part * 100, 0)} ${d.depuisOrigine ? 'remboursé' : 'depuis la saisie'}</span></td>
          <td class="num">${etat.capital > 0.005 ? argent(etat.capital) : '<span class="statut fini">Soldé</span>'}</td>
          <td class="num">${pct(d.taux, 2)}</td>
          <td class="num">${argent(total)}<span class="sous">${ass ? `dont assurance ${argent(ass)}` : 'sans assurance'}</span></td>
          <td class="num">${proj.impossible ? '<span class="perte">jamais</span>' : fin ? `${libelleMois(fin, true)} ${fin.slice(0, 4)}` : '—'}</td>
          <td>${suivi.attendues ? `<span class="statut ${suivi.vues === suivi.attendues ? 'ok' : 'ko'}">${suivi.vues} sur ${suivi.attendues} échéance${suivi.attendues > 1 ? 's' : ''}</span>` : '<span class="discret">aucune attendue</span>'}</td>
          <td class="num"><button class="mini-btn" data-modif-dette="${d.id}">Modifier</button></td></tr>`).join('')}</tbody></table></div>
      ${lignes.some(l => l.proj.impossible) ? '<p class="note danger" style="margin:12px 0 0">Une mensualité ne couvre pas les intérêts : cet emprunt ne se rembourse jamais à ce rythme.</p>' : ''}
      ${lignes.some(l => l.suivi.vues < l.suivi.attendues) ? '<p class="note alerte" style="margin:12px 0 0">Des échéances attendues manquent dans vos relevés : le capital restant dû n\'en tient pas compte. Un relevé manque peut-être, ou les paramètres de l\'emprunt diffèrent du prélèvement réel.</p>' : ''}
    </section>

    <section class="carte" id="bloc-echeancier"></section>`;

  $('#btn-dette').onclick = () => tiroirDette();
  vue.querySelectorAll('[data-modif-dette]').forEach(b => b.onclick = ev => { ev.stopPropagation(); tiroirDette(b.dataset.modifDette); });
  vue.querySelectorAll('[data-echeancier]').forEach(tr => tr.onclick = () => {
    detteVue = tr.dataset.echeancier; vue.querySelectorAll('[data-echeancier]').forEach(x => x.classList.toggle('choisi', x === tr)); afficherEcheancier();
  });
  brancherBandeau(reperes);
  afficherEcheancier();

  const horizon = Math.min(360, Math.max(12, ...enCours.map(l => l.proj.impossible ? 120 : l.proj.mois)));
  const pas = horizon > 120 ? 3 : 1, labels = [];
  for (let k = 0; k <= horizon; k += pas) labels.push(libMoisCourt(decalerMois(moisDe(DREF), k)));
  const teintes = ['#B8786A', '#D9A397', '#E7C7BE', '#C9A86A', '#9C8FB0'];
  graphique('c-dettes', { type: 'line',
    data: { labels, datasets: enCours.map((l, i) => ({ label: l.d.nom, fill: i === 0 ? 'origin' : '-1', pointRadius: 0, borderWidth: 1,
      borderColor: teintes[i % 5], backgroundColor: teintes[i % 5] + 'CC',
      data: labels.map((_, j) => { const s = l.proj.impossible ? null : l.proj.serie; return s ? arrondi(s[Math.min(j * pas, s.length - 1)]) : arrondi(l.etat.capital); }) })) },
    options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } }, tooltip: { callbacks: { label: c => `${c.dataset.label} : ${argent0(c.parsed.y)}` } } },
      scales: { x: { grid: { display: false }, ticks: { autoSkip: true, autoSkipPadding: 14, maxRotation: 0, maxTicksLimit: innerWidth < 600 ? 4 : 8 } }, y: { ...axeEuros(), stacked: true } } } });
}

function brancherBandeau(reperes) {
  if ($('#b-configurer')) $('#b-configurer').onclick = () => reperes.length > 1 ? modaleEmprunts(reperes) : tiroirDette(null, nouveauCreditDepuis(reperes[0]));
  if ($('#b-pas-emprunt')) $('#b-pas-emprunt').onclick = () => modaleEmprunts(reperes);
}

/* Échéancier : les échéances passées telles que lues dans les relevés, puis les suivantes. */
function afficherEcheancier() {
  const zone = $('#bloc-echeancier'), d = E.dettes.find(x => x.id === detteVue);
  if (!zone || !d) return;
  const passees = echeancesPassees(d).slice(-6), futures = echeancesFutures(d, 6);
  const vues = new Map(E.operations.filter(o => o.detteId === d.id).map(o => [o.date, o]));
  const ligne = (e, source, cls) => `<tr><td>${dateLongue(e.date)}</td>
    <td class="num">${argent(e.anticipe || (e.capital + e.interets + e.assurance))}</td>
    <td class="num discret">${e.anticipe ? '—' : argent(e.interets)}</td><td class="num">${argent(e.anticipe || e.capital)}</td>
    <td class="num discret">${e.assurance ? argent(e.assurance) : '—'}</td><td class="num">${argent(e.restant)}</td>
    <td><span class="statut ${cls}">${source}</span></td></tr>`;
  zone.innerHTML = `<h2>Échéancier · ${echap(d.nom)}</h2>
    <p class="sous-titre">Les dernières échéances, telles que lues dans vos relevés, puis les suivantes d'après le contrat.</p>
    <div class="defile"><table><thead><tr><th>Date</th><th class="num">Échéance</th><th class="num">Intérêts</th><th class="num">Capital amorti</th><th class="num">Assurance</th><th class="num">Capital restant</th><th>Source</th></tr></thead>
      <tbody>${passees.map(e => ligne(e, e.avantSuivi ? 'avant vos relevés' : e.anticipe ? 'anticipé, relevé' : vues.has(e.date) ? `relevé de ${libelleMois(moisDe(e.date), true).replace('.', '')}` : 'relevé', e.avantSuivi ? 'avenir' : 'ok')).join('')}
        ${futures.map(e => ligne(e, 'à venir', 'avenir')).join('')}</tbody></table></div>`;
}

/* ── Boutons d'en-tête ─────────────────────────────────── */
$('#voile').onclick = () => { fermerModale(); fermerTiroir(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') { fermerModale(); fermerTiroir(); } });
$('#btn-import').onclick = () => ouvrirImport();
$('#imp-fermer').onclick = fermerImport;
$('#btn-reinit').onclick = async () => {
  if (!confirm('Effacer toutes les données du module Budget et comptes et repartir de vos relevés ? Le compte-titres n\'est pas concerné.')) return;
  try {
    clearTimeout(minuterie); enAttente = false; if (envoiEnCours) await envoiEnCours;
    await api('/banque/etat', { method: 'DELETE' });
    E = null; E_ANCIEN = null; VERSION = 0; ongletActif = 'synthese'; ouvrirImport();
  } catch (ex) { toast(ex.message); }
};
$('#btn-deconnexion').onclick = async () => { if (enAttente) await envoyer(); enAttente = false; deconnecter(); };

async function lancer() {
  if (!JETON) return;
  ecranEtat('Chargement de vos comptes…', '');
  try {
    await charger();
    $('#ecran-etat').classList.add('cache');
    if (E) demarrer(); else ouvrirImport();
  } catch (ex) {
    if (/Session expirée/.test(ex.message)) return;
    ecranEtat('Impossible de charger vos comptes', ex.message, '<button class="btn" id="etat-reessayer">Réessayer</button>');
    $('#etat-reessayer').onclick = lancer;
  }
}
lancer();
</script>
</body>
</html>
